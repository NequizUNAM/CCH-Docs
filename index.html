<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula Digital - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#f4f6fb; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    main { flex:1; }
    .app-navbar { background:linear-gradient(90deg,#0f172a,#1e293b); box-shadow:0 4px 14px rgba(0,0,0,.25); }
    .app-navbar .dropdown-menu { border:0; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.2); padding:.5rem; }
    .app-navbar .dropdown-item { border-radius:8px; padding:.5rem .8rem; }
    .app-navbar .dropdown-item:hover { background:#e7efff; }
    .app-navbar .dropdown-item.active { background:#0d6efd; }
    .app-navbar .nav-link.active-group { color:#fff; border-bottom:2px solid #0d6efd; }
    .hero { background:linear-gradient(135deg,#1e293b,#0f172a); color:#fff; padding:4rem 1rem; border-bottom:5px solid #0d6efd; }
    .section-card { border:0; border-radius:16px; box-shadow:0 6px 18px rgba(15,23,42,.08); transition:transform .2s, box-shadow .2s; }
    .section-card:hover { transform:translateY(-5px); box-shadow:0 14px 30px rgba(15,23,42,.16); }
    .icon-circle { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.2); }
    .lock-btn { font-weight:700; border-radius:999px; }
    .lock-card { border:2px dashed #cbd5e1; border-radius:16px; background:#fff; }
    .c-mat { background:#6f42c1; } .c-cib { background:#0d6efd; } .c-est { background:#198754; }
  </style>
</head>
<body>

  <!-- Contenedor donde JS dibuja el header -->
  <div id="app-header"></div>

  <main>
    <section class="hero text-center">
      <div class="container">
        <i class="bi bi-mortarboard-fill display-3"></i>
        <h1 class="display-5 fw-bold mt-2">Aula Digital By Nequiz</h1>
        <p class="lead mb-0">Matemáticas • Cibernética • Estadística</p>
      </div>
    </section>

    <div class="container my-5">
      <h2 class="fw-bold mb-4"><i class="bi bi-grid-fill text-primary me-2"></i>Contenido disponible</h2>
      <div class="row g-4" id="home-cards"></div>
    </div>
  </main>

  <footer class="text-center py-3 text-muted bg-white border-top"><small>Aula Digital • pedro.nequizmedina@cch.unam.mx</small></footer>

  <!--
    ============================================================
    FUENTE ÚNICA DEL MENÚ
    Para agregar una página nueva, solo añade un objeto en "items".
    Todas las páginas leen esta configuración y dibujan el header.
    ============================================================
  -->
  <script type="application/json" id="menu-config">
  {
    "brand": { "label": "Aula Digital", "icon": "bi-mortarboard-fill", "href": "index.html" },
    "groups": [
      {
        "id": "matematicas", "label": "Matemáticas", "icon": "bi-calculator", "color": "c-mat",
        "items": [
          { "label": "Los Números", "href": "los_numeros.html", "icon": "bi-hash" },
          { "label": "Fracciones", "href": "fracciones.html", "icon": "bi-pie-chart-fill" },
          { "label": "Variación directamente proporcional", "href": "variacion_proporcional.html", "icon": "bi-graph-up-arrow" },
          { "label": "Exponentes y Radicales", "href": "exponentes_radicales.html", "icon": "bi-superscript" },
          { "label": "Ángulos", "href": "angulos.html", "icon": "bi-compass" },
          { "label": "Teorema de Pitágoras", "href": "pitagoras.html", "icon": "bi-triangle-half" }
        ]
      },
      {
        "id": "cibernetica", "label": "Cibernética", "icon": "bi-cpu", "color": "c-cib",
        "items": [
          { "label": "Precursores", "href": "precursores.html", "icon": "bi-clock-history" },
          { "label": "Circuitos eléctricos", "href": "circuitos.html", "icon": "bi-lightning-charge-fill" },
          { "label": "Protoboard e Interconexiones", "href": "protoboard.html", "icon": "bi-grid-3x3-gap-fill" },
          { "label": "Conversiones numéricas", "href": "conversiones.html", "icon": "bi-123" },
          { "label": "Compuertas lógicas", "href": "compuertas_logicas.html", "icon": "bi-toggles" }
        ]
      },
      {
        "id": "estadistica", "label": "Estadística", "icon": "bi-bar-chart-line", "color": "c-est",
        "items": [
          { "label": "Distribución Muestral", "href": "distribucion_muestral.html", "icon": "bi-bar-chart-line-fill" },
          { "label": "Medidas de Dispersión", "href": "medidas_dispersion.html", "icon": "bi-arrows-expand" },
          { "label": "Amplitudes", "href": "amplitudes.html", "icon": "bi-distribute-horizontal" },
          { "label": "Cuartiles y Percentiles", "href": "cuartiles_percentiles.html", "icon": "bi-percent" },
          { "label": "Correlación Lineal", "href": "correlacion_lineal.html", "icon": "bi-graph-up" },
          { "label": "Probabilidad", "href": "probabilidad.html", "icon": "bi-dice-5-fill" },
          { "label": "Distribución Binomial", "href": "distribucion_binomial.html", "icon": "bi-bar-chart-steps" }
        ]
      }
    ]
  }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth-config.js"></script>
  <script src="aula-header.js"></script>
  <script>
    /* El header, el modal y el bloqueo viven en aula-header.js. Aquí solo se dibujan las tarjetas de inicio. */
    const MENU = JSON.parse(document.getElementById('menu-config').textContent);
    function renderCards(menu, unlocked) {
      const box = document.getElementById('home-cards');
      if (!unlocked) {
        box.innerHTML = `<div class="col-12"><div class="lock-card text-center p-5"><i class="bi bi-lock-fill display-4 text-secondary"></i><h4 class="fw-bold mt-2">Contenido bloqueado</h4><p class="text-muted mb-3">Pulsa «Desbloquear» e ingresa la contraseña para ver los temas.</p><button class="btn btn-primary rounded-pill px-4 lock-btn" type="button" data-unlock><i class="bi bi-lock-fill me-1"></i>Desbloquear</button></div></div>`;
        return;
      }
      box.innerHTML = menu.groups.map(g => {
        const links = g.items.map(i => i.disabled
          ? `<li class="list-group-item text-muted"><i class="bi ${i.icon} me-2"></i>${i.label}</li>`
          : `<a class="list-group-item list-group-item-action" href="${i.href}"><i class="bi ${i.icon} me-2 text-primary"></i><strong>${i.label}</strong>${i.desc ? `<br><small class="text-muted">${i.desc}</small>` : ''}</a>`
        ).join('');
        return `
          <div class="col-md-4">
            <div class="card section-card h-100">
              <div class="card-body">
                <div class="icon-circle ${g.color} mb-3"><i class="bi ${g.icon}"></i></div>
                <h4 class="fw-bold">${g.label}</h4>
                <div class="list-group list-group-flush mt-3">${links}</div>
              </div>
            </div>
          </div>`;
      }).join('');
    }
    document.addEventListener('aula-auth', e => renderCards(MENU, e.detail.unlocked));
  </script>
</body>
</html>
