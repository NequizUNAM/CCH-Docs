<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Estadística 1 · Aula Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --ink:#002B7A;--ink2:#0A3586;--ink3:#1B4AA6;--paper:#b6bbc3;--card:#ffffff;--line:#e2e8f0;--line2:#eef2f7;
  --sage:#D59F0F;--sage2:#EEF3FC;--leaf:#2E5CB8;--leaf2:#002B7A;--coral:#E4572E;--coral2:#FDE9E3;--amber:#F2C14E;--amber2:#FDF6E0;
  --sky:#3E7BD4;--sky2:#E3EDFB;--violet:#7C5CF0;--violet2:#ECE6FD;--muted:#64748b;--ok:#1F9D55;--bad:#D64545;
  --r:16px;--sh:0 1px 2px rgba(0,43,122,.06),0 2px 6px rgba(0,43,122,.04);--sh2:0 1px 2px rgba(0,43,122,.08);
  --f-head:'Space Grotesk','Segoe UI',system-ui,sans-serif;--f-body:'Inter','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:.5rem 0}
a{color:var(--leaf2)}
button{font-family:inherit;cursor:pointer}
code,.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#e8efe9;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 90px;scrollbar-width:thin;scrollbar-color:var(--ink3) transparent;z-index:50}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 16px;border-block-end:1px solid #ffffff1f;margin-block-end:12px;text-decoration:none;color:#fff}
.brand .logo{width:44px;height:44px;border-radius:12px;background:var(--sage);display:grid;place-items:center;color:var(--ink);flex:none;box-shadow:3px 3px 0 #000}
.brand b{font-family:var(--f-head);font-size:1.05rem;display:block;line-height:1.1}
.brand small{opacity:.65;font-size:.74rem}
.ublock{margin:10px 0}
.utitle{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--sage);padding:8px 10px 4px;width:100%;background:none;border:0;text-align:left}
.utitle .n{background:var(--sage);color:var(--ink);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.plink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#cfdad2;padding:8px 10px;border-radius:10px;font-size:.92rem;position:relative;transition:background .2s,color .2s,transform .2s}
.plink:hover{background:#ffffff14;color:#fff;transform:translateX(3px)}
.plink .ic{width:26px;text-align:center;font-size:1.05rem}
.plink.on{background:var(--sage);color:var(--ink);font-weight:600}
.plink .ck{margin-inline-start:auto;font-size:.8rem;opacity:0;transition:opacity .3s}
.plink.done .ck{opacity:1;color:var(--sage)}
.plink.on.done .ck{color:var(--leaf2)}
.rail-foot{display:grid;gap:8px;margin-block-start:18px;padding:12px 6px;border-block-start:1px solid #ffffff1f}
.rail-foot .btn{justify-content:flex-start;background:#ffffff12;color:#fff;border-color:#ffffff30;box-shadow:none}
.rail-foot .btn:hover{background:#ffffff26}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh;
  background-image:linear-gradient(#002B7A0a 1px,transparent 1px),linear-gradient(90deg,#002B7A0a 1px,transparent 1px);background-size:32px 32px}
.top{position:sticky;top:0;z-index:40;background:#fcfcfde8;backdrop-filter:blur(8px);border-block-end:1.5px solid var(--ink);display:flex;align-items:center;gap:12px;padding:10px 22px}
.top .burger{display:none}
.crumb{font-family:var(--f-head);font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{opacity:.4}
.crumb span:last-child{overflow:hidden;text-overflow:ellipsis}
.prog{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;max-width:380px;margin-inline-start:auto}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--sage),var(--sage) 8px,#8fc06f 8px,#8fc06f 16px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.top .btn{flex:none}
.stage{flex:1;padding:26px 28px 40px;max-width:1240px;width:100%;margin:0 auto}
.pager{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fcfcfdf2;backdrop-filter:blur(8px);border-block-start:1.5px solid var(--ink)}
.pager .dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pager .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0;transition:transform .2s,background .2s}
.pager .dot:hover{transform:scale(1.4)}
.pager .dot.on{background:var(--coral);transform:scale(1.3)}
.pager .dot.done{background:var(--sage)}
.pager .dot.on.done{background:var(--coral)}
/* ---------- páginas ---------- */
.pg{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) both}
.pg.out{animation:pgOut .22s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:none}}
@keyframes pgOut{to{opacity:0;transform:translateX(-18px)}}
.hero{position:relative;background:var(--ink);color:#fff;border-radius:22px;padding:28px 30px 26px;overflow:hidden;box-shadow:var(--sh);border:2px solid var(--ink);margin-block-end:20px}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sage),#5f9e4f 60%,transparent 62%);opacity:.9;animation:float 7s ease-in-out infinite}
.hero::before{content:'';position:absolute;right:120px;bottom:-70px;width:150px;height:150px;border-radius:30px;background:var(--coral);transform:rotate(18deg);opacity:.9;animation:float 9s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(14px) rotate(6deg)}}
.hero>*{position:relative;z-index:2}
.kick{display:inline-flex;gap:8px;align-items:center;background:var(--sage);color:var(--ink);font-family:var(--f-head);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.hero h1{font-size:clamp(1.7rem,3.2vw,2.6rem);margin:12px 0 8px;max-width:760px}
.hero p.lead{max-width:680px;color:#cfe0d4;margin:0 0 14px;font-size:1.02rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:6px;background:#fff;border:1.5px solid var(--ink);border-radius:99px;width:max-content;max-width:100%;overflow:auto;box-shadow:var(--sh2)}
.tab{border:0;background:none;padding:8px 16px;border-radius:99px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:all .25s}
.tab:hover{background:var(--sage2);color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.pane{display:none}
.pane.on{display:block;animation:paneIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes paneIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gside{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.stack{display:grid;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.pn{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);min-width:0}
.pn.flat{box-shadow:none;border-width:1.5px}
.pn.dark{background:var(--ink2);color:#e8efe9}
.pn.sage{background:var(--sage2)}
.pn.amber{background:var(--amber2)}
.pn.sky{background:var(--sky2)}
.pn.coral{background:var(--coral2)}
.pn.violet{background:var(--violet2)}
.pn h3{font-size:1.15rem;display:flex;align-items:center;gap:10px;margin-block-end:8px}
.pn h3 .ico{width:34px;height:34px;border-radius:10px;background:var(--sage);display:grid;place-items:center;font-size:1.1rem;border:1.5px solid var(--ink);flex:none}
.pn h4{font-size:1rem;margin:14px 0 6px}
.sub{color:var(--muted);font-size:.9rem}
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
/* ---------- botones / formularios ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:600;font-size:.9rem;box-shadow:var(--sh2);transition:transform .12s,box-shadow .12s,background .2s;text-decoration:none;line-height:1.2}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);background:var(--sage2)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:var(--ink3)}
.btn.go{background:var(--sage)}.btn.go:hover{background:#bde0a2}
.btn.co{background:var(--coral);color:#fff}.btn.co:hover{background:#ff8168}
.btn.sm{padding:5px 12px;font-size:.8rem}
.btn.ghost{box-shadow:none;background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid currentColor;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:600;background:#ffffff14;color:#fff;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--sage);color:var(--ink);border-color:var(--sage)}
.chip.l{color:var(--ink);background:#fff}.chip.l:hover{background:var(--sage2);border-color:var(--ink)}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1.5px solid var(--ink);background:var(--amber2)}
.tag.g{background:var(--sage2)}.tag.b{background:var(--sky2)}.tag.v{background:var(--violet2)}.tag.c{background:var(--coral2)}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
input[type=number]{width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--sage);outline-offset:1px}
textarea{width:100%;min-height:70px;font-family:var(--f-mono);font-size:.88rem}
input[type=range]{width:100%;accent-color:var(--leaf);height:6px}
.sw{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:.85rem;cursor:pointer;user-select:none}
.sw input{accent-color:var(--leaf);width:18px;height:18px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;font-size:.84rem}
.seg button.on{background:var(--ink);color:#fff}
.seg button:not(.on):hover{background:var(--sage2)}
/* ---------- tablas ---------- */
.tw{overflow:auto;border:1.5px solid var(--ink);border-radius:12px;background:#fff;max-width:100%}
table.tb{border-collapse:collapse;width:100%;font-size:.88rem}
.tb th{background:var(--ink);color:#fff;padding:8px 10px;font-family:var(--f-head);font-weight:600;font-size:.78rem;letter-spacing:.03em;text-align:center;position:sticky;top:0;white-space:nowrap}
.tb td{padding:6px 10px;border-block-start:1px solid var(--line2);text-align:center;font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.tb tbody tr:nth-child(even){background:#faf7ee}
.tb tr.tot td{background:var(--sage2);font-weight:700;border-block-start:2px solid var(--ink)}
.tb td.l,.tb th.l{text-align:left}
.tb tr.hl td,.tb td.hl{background:var(--amber2)!important;font-weight:700}
.tb td.rowh{background:var(--ink2);color:#fff;font-family:var(--f-head);font-weight:600;text-align:left}
.tb td input{width:78px;text-align:center;padding:4px 6px;font-family:var(--f-mono)}
.tb td input.ok{background:#dff5e5;border-color:var(--ok)}
.tb td input.bad{background:#fde1e1;border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cellpop{animation:cellpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cellpop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* ---------- notas ---------- */
.note,.tip,.warn,.okb{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem;border:1.5px solid var(--ink)}
.note{background:var(--amber2);position:relative;transform:rotate(-.4deg)}
.note::before{content:'📌 ';}
.tip{background:var(--sky2)}.tip::before{content:'💡 '}
.warn{background:var(--coral2)}.warn::before{content:'⚠️ '}
.okb{background:var(--sage2)}.okb::before{content:'✅ '}
.fm{background:#fff;border:1.5px dashed var(--ink);border-radius:12px;padding:10px 14px;margin:10px 0;overflow-x:auto;text-align:center}
.kpi{display:grid;gap:2px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:var(--sh2);min-width:0}
.kpi small{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--f-mono);font-size:1.45rem;line-height:1.1;overflow-wrap:anywhere}
.kpi.g{background:var(--sage2)}.kpi.a{background:var(--amber2)}.kpi.s{background:var(--sky2)}.kpi.c{background:var(--coral2)}.kpi.v{background:var(--violet2)}
.link{background:none;border:0;padding:0;color:var(--leaf2);font-weight:600;text-decoration:underline dotted;cursor:pointer;font-size:inherit}
.link:hover{color:var(--coral)}
.th{display:inline-flex;align-items:center;gap:6px;background:var(--violet2);border:1.5px solid var(--ink);border-radius:99px;padding:2px 11px 2px 8px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink);transition:all .2s}
.th:hover{background:var(--violet);color:#fff;transform:translateY(-1px)}
.th::before{content:'📖'}
/* ---------- modal / drawer ---------- */
.ov{position:fixed;inset:0;background:#002B7Aaa;backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;animation:dlgIn .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes dlgIn{from{transform:translateY(40px) scale(.94);opacity:0}}
.dlg.wide{max-width:980px}
.dlg-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-block-end:2px solid var(--ink);background:var(--sage)}
.dlg-h h3{font-size:1.15rem;flex:1}
.dlg-h button{border:1.5px solid var(--ink);background:#fff;border-radius:50%;width:34px;height:34px;font-size:1rem}
.dlg-b{padding:18px 22px;overflow:auto}
.dlg-b h4{margin:14px 0 4px}
.dlg-b ul{padding-inline-start:20px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .35s;z-index:300;font-weight:600;border:2px solid var(--sage)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- ejercicios ---------- */
.ex{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-block-end:16px}
.ex-h{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:var(--ink);color:#fff}
.ex-h .no{background:var(--sage);color:var(--ink);font-family:var(--f-head);font-weight:700;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;padding:0 6px;flex:none}
.ex-h .tt{flex:1;font-weight:600}
.ex-h .tags{display:flex;gap:6px;flex-wrap:wrap;margin-block-start:4px}
.ex-b{padding:14px 16px}
.part{border-block-start:1.5px dashed var(--line);padding:10px 0}
.part:first-child{border-block-start:0}
.part-q{display:flex;gap:10px;align-items:flex-start}
.part-q .lb{background:var(--amber);border:1.5px solid var(--ink);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-family:var(--f-head);flex:none}
.part-q .tx{flex:1}
.sol{display:none;margin:10px 0 2px 38px;border-inline-start:4px solid var(--sage);padding:4px 0 4px 14px}
.sol.on{display:block;animation:paneIn .4s both}
.stp{display:none;margin:8px 0}
.stp.on{display:block;animation:stpIn .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes stpIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
.stp .sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;font-weight:700;margin-inline-end:8px}
.stp-b{margin-inline-start:32px}
.ans{display:none;margin-block-start:8px;background:var(--sage2);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
.ans.on{display:block;animation:stpIn .5s both}
.sol-ctl{display:flex;gap:8px;align-items:center;margin-block-start:8px;flex-wrap:wrap}
.pips{display:flex;gap:4px}.pips i{width:18px;height:6px;border-radius:9px;background:var(--line)}.pips i.on{background:var(--leaf)}
/* ---------- gráficas ---------- */
svg{max-width:100%}
svg text{font-family:var(--f-body)}
.ch{width:100%;height:auto;display:block}
.ax{stroke:var(--ink);stroke-width:1.5}.gl{stroke:#002B7A22;stroke-width:1}
.tk{font-size:11px;fill:var(--muted);font-family:var(--f-mono)}
.lbl{font-size:12px;fill:var(--ink);font-weight:600}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*55ms);transition:filter .2s}
.bar:hover{filter:brightness(1.12)}
@keyframes grow{from{transform:scaleY(0)}}
.drw{stroke-dasharray:var(--len,1200);stroke-dashoffset:var(--len,1200);animation:drw 1.4s ease forwards;animation-delay:var(--d,.2s)}
@keyframes drw{to{stroke-dashoffset:0}}
.pt{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.fadein{animation:fade .8s both;animation-delay:var(--d,0s)}
.drop{animation:dropIn .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes dropIn{from{transform:translateY(-120px);opacity:0}}
.draggable{cursor:grab}.draggable:active{cursor:grabbing}
/* ---------- monedas, dados, árbol ---------- */
.coin{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2.5px solid var(--ink);font-family:var(--f-head);background:radial-gradient(circle at 35% 30%,#ffe08a,#e0a82e);box-shadow:2px 3px 0 var(--ink);animation:flip .7s cubic-bezier(.3,1.3,.5,1) both}
.coin.s{background:radial-gradient(circle at 35% 30%,#e8eef0,#9fb0b8)}
@keyframes flip{from{transform:rotateX(720deg) scale(.4);opacity:0}}

/* =====================================================================
   TEMA · MinimalistEdu — azul institucional + oro, Bento, vidrio sutil
   sobre escritorio gris con hoja de libreta (fondo off-white)
   ===================================================================== */
:root{
  --blue:#002B7A;--blue-2:#0B3C9E;--blue-3:#2E5CB8;--blue-50:#EEF3FC;--blue-100:#DCE7F8;
  --gold:#D59F0F;--gold-ink:#8A6400;--gold-50:#FDF6E0;--gold-100:#FAEBBE;
  --bg:#fcfcfd;--bg-2:#f8fafc;--text:#334155;--bd:#d5deeb;--desk:#b6bbc3;--sheet:#fcfcfd;--rule:#dfe7f3;--mx:80px;
  --r-lg:20px;--r-sm:10px;--glass:rgba(255,255,255,.78);--ease:cubic-bezier(.4,0,.2,1);
  --sh-1:0 1px 2px rgba(0,43,122,.06),0 2px 6px rgba(0,43,122,.04);--sh-2:0 12px 24px rgba(0,43,122,.06),0 2px 4px rgba(0,43,122,.05);
  --f-hand:'Caveat','Comic Sans MS',cursive;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--desk);color:var(--text)}
:focus-visible{outline:3px solid rgba(213,159,15,.6);outline-offset:2px}
.d-none{display:none!important}
/* --- tipografía --- */
.stage h2,.pn h3,.pn h4,.dlg-b h4,.plan-u{color:var(--ink)}
.pn.dark h3,.pn.dark h4,.pn.dark b{color:#fff}
.stage h2{font-family:var(--f-hand);font-size:clamp(1.7rem,3.6vw,2.2rem);font-weight:700;letter-spacing:0;text-decoration:underline wavy rgba(213,159,15,.55);text-underline-offset:6px}
.pn h3{font-size:clamp(1.02rem,1.5vw,1.18rem)}
.kpi b,.big{color:var(--ink)}
.pn.dark .big,.pn.dark .kpi b{color:#fff}
/* --- escritorio y barras de vidrio --- */
.main{background-color:var(--desk);background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.5px),linear-gradient(180deg,#c3c7ce,#a9aeb6);background-size:6px 6px,100% 100%}
.top,.pager{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15)}
.top{border-block-end:1px solid rgba(0,43,122,.14);border-bottom-width:1px}
.pager{border-block-start:1px solid rgba(0,43,122,.14);border-top-width:1px}
.prog{border:1px solid var(--bd);background:#fff}
.pager .dot{border:1px solid var(--ink)}
@supports not (backdrop-filter:blur(1px)){.top,.pager{background:rgba(255,255,255,.96)}}
/* --- hoja de libreta: off-white, renglones azulados, margen dorado, espiral --- */
.stage{position:relative;flex:none;inline-size:calc(100% - 48px);max-inline-size:1240px;margin-block:24px 40px;margin-inline:auto;padding-block:30px 48px;padding-inline:calc(var(--mx) + 34px) 34px;
  background-color:var(--sheet);
  background-image:linear-gradient(90deg,transparent calc(var(--mx) - 2px),rgba(213,159,15,.8) calc(var(--mx) - 2px),rgba(213,159,15,.8) var(--mx),transparent var(--mx),transparent calc(var(--mx) + 4px),rgba(213,159,15,.8) calc(var(--mx) + 4px),rgba(213,159,15,.8) calc(var(--mx) + 5px),transparent calc(var(--mx) + 5px)),
    repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 0,0 18px;border-radius:4px 14px 14px 4px;
  box-shadow:0 1px 0 #fff inset,0 7px 0 -3px #eef0f3,0 8px 0 -3px rgba(0,43,122,.16),0 14px 0 -6px #e4e7ec,0 15px 0 -6px rgba(0,43,122,.12),0 24px 36px rgba(0,30,80,.28)}
.stage::before{content:'';position:absolute;inset-inline-start:-20px;inset-block:0;inline-size:54px;pointer-events:none;z-index:3;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='54' height='34'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23fafafa'/><stop offset='.45' stop-color='%23a4aab0'/><stop offset='1' stop-color='%23454a50'/></linearGradient><radialGradient id='h' cx='.5' cy='.4' r='.6'><stop offset='0' stop-color='%23666b71'/><stop offset='1' stop-color='%23202427'/></radialGradient></defs><circle cx='38' cy='17' r='6.5' fill='url(%23h)'/><rect x='4' y='12.5' width='40' height='9' rx='4.5' fill='url(%23g)' stroke='%2330353a' stroke-width='.8'/></svg>") repeat-y}
/* --- héroe (tile principal) --- */
.hero{background:linear-gradient(135deg,#002B7A 0%,#0B3C9E 100%);border:0;border-radius:var(--r-lg);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.14);padding-block:clamp(22px,3vw,30px);padding-inline:clamp(18px,3vw,32px)}
.hero::after{background:radial-gradient(circle at 30% 30%,#F2C14E,#D59F0F 62%,transparent 64%);opacity:.95}
.hero::before{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.6rem);color:#fff}
.hero p.lead{color:#D6E2F7}
.kick{background:var(--gold);color:var(--ink)}
/* --- tiles Bento --- */
.pn{position:relative;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-1);padding:clamp(14px,2vw,20px);transition:box-shadow .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.pn:hover{box-shadow:var(--sh-2);border-color:#c2cfe5}
.pn.flat{box-shadow:none;border-width:1px}
.pn.dark{background:linear-gradient(160deg,#0A3586,#002B7A);border-color:transparent;color:#e7eefc}
.pn h3 .ico{background:var(--gold-50);border:1px solid #ecd48a}
.unitcard{overflow:hidden}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bento>*{min-width:0}
.bento>.s3{grid-column:span 3}.bento>.s4{grid-column:span 4}.bento>.s5{grid-column:span 5}.bento>.s6{grid-column:span 6}.bento>.s7{grid-column:span 7}.bento>.s8{grid-column:span 8}.bento>.s12{grid-column:1/-1}
@media (max-width:1000px){.bento>*{grid-column:span 6!important}.bento>.s12{grid-column:1/-1!important}}
@media (max-width:640px){.bento>*{grid-column:1/-1!important}}
.stack>*,.grid2>*,.grid3>*,.grid4>*,.gside>*{min-width:0}
@media (hover:hover){.unitcard:hover,.ex:hover,.kpi:hover,.flipc:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}}
.unitcard,.ex,.kpi{transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
/* --- botones, pestañas, controles --- */
.btn{border:1px solid var(--bd);box-shadow:none;background:#fff;color:var(--ink);transition:transform .3s var(--ease),box-shadow .3s var(--ease),background-color .3s var(--ease),border-color .3s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh-2);background:var(--blue-50);border-color:#b8c8e4}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:var(--ink2)}
.btn.go{background:var(--gold);color:var(--ink);border-color:var(--gold)}.btn.go:hover{background:#E3B13A}
.btn.co{background:var(--coral);color:#fff;border-color:var(--coral)}.btn.co:hover{background:#EE6D45}
.rail-foot .btn{border-color:#ffffff33}.rail-foot .btn:hover{box-shadow:none;background:#ffffff26}
.tabs{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh-1);padding:5px;gap:4px}
.tab{border-radius:10px;color:var(--muted);transition:background-color .3s var(--ease),color .3s var(--ease)}
.tab:hover{background:var(--blue-50);color:var(--ink)}.tab.on{background:var(--ink);color:#fff}
.seg{border:1px solid var(--bd)}
.chip.l{border:1px solid var(--bd)}
input[type=text],input[type=number],select,textarea,input.cell{border:1px solid var(--bd);border-radius:var(--r-sm)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(0,43,122,.16);outline-offset:1px;border-color:var(--blue-3)}
input[type=range]{accent-color:var(--blue-3)}
.tag,.th{border-width:1px}
.opt{border:1px solid var(--bd)}.opt.ok{background:#DFF3E6;border-color:var(--ok)}.opt.bad{background:var(--coral2);border-color:var(--coral)}
/* --- tablas, KPIs, notas, ejercicios --- */
.tw{border:1px solid var(--bd);border-radius:12px}
.tb tbody tr:nth-child(even){background:var(--bg-2)}
.kpi{border:1px solid var(--bd);box-shadow:var(--sh-1)}
.note,.tip,.warn,.okb{border:1px solid rgba(0,43,122,.14)}
.note{font-family:var(--f-hand);font-size:1.22rem;line-height:1.25;background:#FDF3C4;border-color:#e6cd73;box-shadow:2px 3px 0 rgba(0,43,122,.1);transform:rotate(-.4deg)}
.note::before{content:'📌 '}
.okb{background:#E7F6EC}
.fm{border:1px dashed #b8c8e4;background:#fff}
.ex{border:1px solid var(--bd);box-shadow:var(--sh-1)}
.ans{border:1px solid rgba(0,43,122,.18);background:var(--blue-50)}
.part-q .lb{background:var(--amber);border:1px solid #d9a92f}
.stp .sn{background:var(--ink)}
/* --- cinta adhesiva (libreta) --- */
.stage .pn.rv:not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{content:'';position:absolute;inset-block-start:-11px;inset-inline-start:50%;inline-size:76px;block-size:20px;margin-inline-start:-38px;background:rgba(213,159,15,.55);transform:rotate(-2deg);box-shadow:0 1px 0 rgba(0,43,122,.12);z-index:1;pointer-events:none}
.stage .pn.rv:nth-child(even):not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{transform:rotate(2.5deg);background:rgba(46,92,184,.28);margin-inline-start:-12px}
.stage .pn.rv:nth-child(3n):not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{background:rgba(100,116,139,.3);inset-inline-start:30px;margin-inline-start:0;transform:rotate(-4deg)}
/* --- ventanas (vidrio) --- */
.ov{background:rgba(0,43,122,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(0,43,122,.14);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(0,30,80,.24)}
.dlg-h{background:var(--blue-50);border-block-end:1px solid rgba(0,43,122,.12);border-bottom-width:1px}
.dlg-h button{border:1px solid var(--bd)}
.toast{background:rgba(0,43,122,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--gold)}
@supports not (backdrop-filter:blur(1px)){.dlg{background:#fff}}
/* --- skeletons (se muestran quitando d-none) --- */
.skel{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.sk-tile{grid-column:span 7;display:grid;gap:12px;align-content:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-1)}
.sk-tile.side{grid-column:span 5}
.sk-line,.sk-box{display:block;background:linear-gradient(90deg,#e6ecf6 25%,#f4f7fc 37%,#e6ecf6 63%);background-size:400% 100%;animation:skWave 1.4s ease infinite;border-radius:8px}
.sk-line{block-size:12px}.sk-line.w40{inline-size:40%}.sk-line.w60{inline-size:60%}.sk-line.w80{inline-size:80%}
.sk-box{block-size:150px;border-radius:12px}.sk-box.sm{block-size:90px}
@keyframes skWave{from{background-position:100% 50%}to{background-position:0 50%}}
.sk-pulse{animation:skPulse 1.4s ease-in-out infinite}
@keyframes skPulse{50%{opacity:.5}}
@media (max-width:1000px){.skel>*{grid-column:1/-1}}
/* --- libreta en pantallas chicas --- */
@media (max-width:1000px){:root{--mx:44px}.stage{inline-size:calc(100% - 28px);padding-block:20px 36px;padding-inline:calc(var(--mx) + 18px) 14px;margin-block:16px 28px}}
@media (max-width:640px){:root{--mx:30px}.stage{inline-size:calc(100% - 14px);padding-block:16px 30px;padding-inline:calc(var(--mx) + 12px) 10px;margin-block:10px 22px;border-radius:3px 10px 10px 3px}.stage::before{inset-inline-start:-24px}.stage h2{font-size:1.7rem}}
/* ---------- plan de estudios (modal) ---------- */
.plan-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.plan-sum>div{border:1.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;display:grid;grid-template-columns:32px 1fr;gap:0 8px;align-items:center}
.plan-sum b{grid-row:span 2;background:var(--sage);border:1.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;height:32px;font-family:var(--f-head)}

  --ink:#0f172a;--ink2:#1e293b;--ink3:#334155;--text:#334155;--muted:#64748b;
  --desk:#eef1f6;--line:#e2e8f0;--line2:#eef2f7;--bd:#dbe3ee;--bg-2:#f8fafc;

'use strict';
/* =====================================================================
   NÚCLEO (funciones puras, sin DOM): estadística, fracciones, conteo, datos
   ===================================================================== */
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => sum(a) / a.length;
const sortN = a => [...a].sort((x, y) => x - y);
const median = a => { const s = sortN(a), n = s.length, m = n >> 1; return n % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function modesOf(a) {
  const c = new Map(); a.forEach(x => c.set(x, (c.get(x) || 0) + 1));
  const mx = Math.max(...c.values());
  return { f: mx, vals: mx === 1 ? [] : [...c].filter(([, v]) => v === mx).map(([k]) => k).sort((x, y) => x - y) };
}
const decs = x => { const s = String(+x); const i = s.indexOf('.'); return i < 0 ? 0 : Math.min(6, s.length - i - 1); };
const ceilTo = (x, d) => { const p = 10 ** d; return Math.ceil(x * p - 1e-9) / p; };
const roundTo = (x, d) => { const p = 10 ** d; return Math.round((x + Number.EPSILON) * p) / p; };
const fmt = (x, d = 2) => (x === null || x === undefined || Number.isNaN(x)) ? '—' :
  (Object.is(roundTo(x, d), -0) ? 0 : roundTo(x, d)).toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d });
/* formato "limpio": quita ceros sobrantes */
const fc = (x, d = 2) => (x === null || x === undefined || Number.isNaN(x)) ? '—' :

const pct = (x, d = 2) => fmt(x * 100, d) + '%';

/* ---------- fracciones ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function frac(n, d) { const g = gcd(n, d); return { n: n / g, d: d / g, raw: [n, d] }; }
const fstr = (n, d) => { const f = frac(n, d); return f.d === 1 ? String(f.n) : f.n + '/' + f.d; };
const ftex = (n, d) => { const f = frac(n, d); return f.d === 1 ? String(f.n) : `\\frac{${f.n}}{${f.d}}`; };
const ftexRaw = (n, d) => `\\frac{${n}}{${d}}`;

/* ---------- conteo (BigInt exacto) ---------- */
const fact = n => { let r = 1n; for (let i = 2n; i <= BigInt(n); i++) r *= i; return r; };
const nPr = (n, r) => { let x = 1n; for (let i = 0; i < r; i++) x *= BigInt(n - i); return x; };
const nCr = (n, r) => { if (r < 0 || r > n) return 0n; r = Math.min(r, n - r); let x = 1n; for (let i = 1; i <= r; i++) x = x * BigInt(n - r + i) / BigInt(i); return x; };
const big = x => BigInt(x).toLocaleString('es-MX');
const bigFrac = (a, b) => { // fracción reducida con BigInt
  const g = (x, y) => { while (y) [x, y] = [y, x % y]; return x; };
  const d = g(a, b); return { n: a / d, d: b / d, raw: [a, b] };
};
const bfs = (a, b) => { const f = bigFrac(BigInt(a), BigInt(b)); return f.d === 1n ? f.n.toLocaleString('es-MX') : `${f.n.toLocaleString('es-MX')}/${f.d.toLocaleString('es-MX')}`; };
const bftex = (a, b) => { const f = bigFrac(BigInt(a), BigInt(b)); return f.d === 1n ? f.n.toString() : `\\frac{${f.n}}{${f.d}}`; };
const bdec = (a, b, d = 4) => fmt(Number(BigInt(a) * 10n ** 12n / BigInt(b)) / 1e12, d);

/* ---------- distribución de frecuencias ---------- */
/* conv: 'semi' = [a,b) (último cerrado) · 'semiD' = (a,b] (primero cerrado) · 'incl' = límites incluidos (discretos) */
function pickWidth(range, k, conv, dp) {
  const raw = range / k;
  if (conv === 'incl') return Math.max(1, Math.ceil(raw - 1e-9));
  if (decs(roundTo(raw, 6)) <= 2 && Math.abs(roundTo(raw, 2) - raw) < 1e-9) return roundTo(raw, 2); // fracción "pura"
  return ceilTo(raw, Math.max(1, Math.min(2, dp)) || 1);                                           // se redondea hacia arriba
}
function buildDist(data, o) {
  const k = o.k, conv = o.conv || 'semi';
  const s = sortN(data), n = s.length, mn = s[0], mx = s[n - 1], range = mx - mn;
  const dp = Math.max(...data.map(decs));
  const w = o.width != null ? o.width : pickWidth(range, k, conv, dp);
  const start = o.start != null ? o.start : mn;
  const sc = 10 ** Math.min(6, Math.max(dp, decs(w), decs(start)));
  const I = x => Math.round(x * sc), W = I(w), S = I(start);
  const lims = [];
  for (let i = 0; i < k; i++) {
    const lo = (S + i * W) / sc; let hi = (S + (i + 1) * W) / sc;
    lims.push({ lo, hi });
  }
  if (conv === 'incl') {
    lims.forEach((c, i) => { c.hi = i === k - 1 ? Math.max(c.lo + w - 1, mx) : c.lo + w - 1; });
    // límites reales (fronteras) de cada clase
    lims.forEach(c => { c.rlo = c.lo - 0.5; c.rhi = c.hi + 0.5; });
  } else {
    if (o.capLast !== false && !o.width) lims[k - 1].hi = Math.max(Math.min(lims[k - 1].hi, mx), mx);
    lims.forEach(c => { c.rlo = c.lo; c.rhi = c.hi; });
  }
  const f = new Array(k).fill(0), members = lims.map(() => []);
  s.forEach(x => {
    let idx = -1;
    for (let i = 0; i < k; i++) {
      const c = lims[i], X = I(x);
      let ok;
      if (conv === 'incl') ok = X >= I(c.lo) && X <= I(c.hi);
      else if (conv === 'semiD') ok = (i === 0 ? X >= I(c.lo) : X > I(c.lo)) && X <= I(c.hi);
      else ok = X >= I(c.lo) && (i === k - 1 ? X <= I(c.hi) : X < I(c.hi));
      if (ok) { idx = i; break; }
    }
    if (idx >= 0) { f[idx]++; members[idx].push(x); }
  });
  const Fa = []; let acc = 0; f.forEach(v => Fa.push(acc += v));
  const total = acc;
  return {
    n, total, min: mn, max: mx, range, k, conv, dp, ti: range / k, w, lims, f, members, Fa,
    fr: f.map(v => v / n * 100), Fra: Fa.map(v => v / n * 100),
    xm: lims.map(c => (c.lo + c.hi) / 2), c: lims.map(c => roundTo(c.rhi - c.rlo, 6)),

}

  const dev = xm.map(x => x - mu);

  const ss = sum(f.map((v, i) => v * dev[i] * dev[i]));

  const Fprev = mi ? Fa[mi - 1] : 0, cw = D.c[mi];
  const med = lims[mi].rlo + ((half - Fprev) / f[mi]) * cw;

  const h = f.map((v, i) => v / D.c[i]), hmax = Math.max(...h);

  const modes = modalIdx.map(i => {

}

/* ---------- posición (cuartiles, deciles, percentiles) con L = k(N+1)/100 ---------- */
function percentile(data, p) {
  const s = sortN(data), N = s.length, L = p * (N + 1) / 100;
  if (L <= 1) return { L, lo: 1, hi: 1, frac: 0, val: s[0] };
  if (L >= N) return { L, lo: N, hi: N, frac: 0, val: s[N - 1] };
  const lo = Math.floor(L), fr = L - lo;
  return { L, lo, hi: lo + 1, frac: fr, val: s[lo - 1] + fr * (s[lo] - s[lo - 1]) };
}
function fiveNum(data) {
  const s = sortN(data), q1 = percentile(s, 25).val, q2 = percentile(s, 50).val, q3 = percentile(s, 75).val;

  const out = s.filter(x => x < lf || x > uf), inn = s.filter(x => x >= lf && x <= uf);
  return { min: s[0], q1, q2, q3, max: s[s.length - 1], iqr, lf, uf, out, wlo: inn[0], whi: inn[inn.length - 1], s };
}

/* ---------- regresión y correlación ---------- */
function regress(xs, ys) {
  const n = xs.length, sx = sum(xs), sy = sum(ys);
  const sxy = sum(xs.map((x, i) => x * ys[i])), sx2 = sum(xs.map(x => x * x)), sy2 = sum(ys.map(y => y * y));
  const num = n * sxy - sx * sy, dx = n * sx2 - sx * sx, dy = n * sy2 - sy * sy;
  const r = num / Math.sqrt(dx * dy), m = num / dx, b = (sy - m * sx) / n;
  const xb = sx / n, yb = sy / n;
  const cross = sum(xs.map((x, i) => (x - xb) * (ys[i] - yb)));
  const m2 = num / dy, b2 = (sx - m2 * sy) / n;  // regresión de X sobre Y
  return { n, sx, sy, sxy, sx2, sy2, num, dx, dy, r, m, b, xb, yb, cross, covS: cross / (n - 1), covP: cross / n, m2, b2, r2: r * r };
}

}

/* histograma / polígono / ojiva a partir de una distribución D */
function svgHist(D, o = {}) {

  const isAcc = mode === 'Fa' || mode === 'Fra';
  const lo = D.lims[0].rlo, hi = D.lims[D.k - 1].rhi, cw = D.c;
  const padX = o.poly || isAcc ? (hi - lo) / D.k : 0;
  const xlo = lo - (o.poly ? padX : 0), xhi = hi + (o.poly ? padX : 0);
  const x = lin(xlo, xhi, m.l, W - m.r);
  const ax = niceAxis(0, Math.max(...vals, 1)), y = lin(ax.lo, ax.hi, H - m.b, m.t);
  let g = ax.ticks.map(t => `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="tk" x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${fc(t, 2)}${mode === 'fr' || mode === 'Fra' ? '%' : ''}</text>`).join('');
  const dens = o.dens;                           // alturas por densidad (amplitudes distintas)
  if (!isAcc && o.bars !== false) {
    D.lims.forEach((c, i) => {
      const v = vals[i], x0 = x(c.rlo), x1 = x(c.rhi), hl = o.hl === i;
      g += `<rect class="bar" style="--i:${i}" x="${x0}" y="${y(v)}" width="${x1 - x0}" height="${Math.max(0, y(0) - y(v))}" fill="${hl ? COL.amber : COL.sky}" fill-opacity="${o.poly ? .35 : .85}" stroke="${COL.ink}" stroke-width="1.5"><title>${fc(c.rlo, 2)} – ${fc(c.rhi, 2)}: ${fc(v, 2)}</title></rect>`;
      if (!o.poly) g += `<text class="lbl fadein" style="--d:${.5 + i * .04}s" x="${(x0 + x1) / 2}" y="${y(v) - 5}" text-anchor="middle">${fc(v, 1)}</text>`;
    });
  }
  const xm = D.lims.map(c => (c.rlo + c.rhi) / 2);
  if (o.poly && !isAcc) {
    const pts = [[xm[0] - cw[0], 0], ...xm.map((v, i) => [v, vals[i]]), [xm[D.k - 1] + cw[D.k - 1], 0]];
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
    g += `<path class="drw" style="--len:2000" d="${d}" fill="none" stroke="${COL.coral}" stroke-width="3" stroke-linejoin="round"/>` +
      pts.map((p, i) => `<circle class="pt" style="--i:${i}" cx="${x(p[0])}" cy="${y(p[1])}" r="4.5" fill="${COL.coral}" stroke="${COL.ink}" stroke-width="1.5"><title>x=${fc(p[0], 2)} · ${fc(p[1], 2)}</title></circle>`).join('');
  }
  if (isAcc) {
    const pts = [[lo, 0], ...D.lims.map((c, i) => [c.rhi, vals[i]])];
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
    if (o.slope != null) {                       // resalta el tramo de mayor pendiente
      const sl = vals.map((v, i) => v - (i ? vals[i - 1] : 0)), im = sl.indexOf(Math.max(...sl));
      g += `<rect x="${x(D.lims[im].rlo)}" y="${m.t}" width="${x(D.lims[im].rhi) - x(D.lims[im].rlo)}" height="${y(0) - m.t}" fill="${COL.amber}" opacity=".3"/>`;
    }
    g += `<path class="drw" style="--len:2000" d="${d}" fill="none" stroke="${COL.leaf}" stroke-width="3" stroke-linejoin="round"/>` +
      pts.map((p, i) => `<circle class="pt" style="--i:${i}" cx="${x(p[0])}" cy="${y(p[1])}" r="4.5" fill="${COL.leaf}" stroke="${COL.ink}" stroke-width="1.5"><title>≤ ${fc(p[0], 2)}: ${fc(p[1], 2)}</title></circle>`).join('');
  }
  const ticks = [lo, ...D.lims.map(c => c.rhi)];
  g += `<line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${y(0)}"/><line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  g += ticks.map(t => `<text class="tk" x="${x(t)}" y="${H - m.b + 16}" text-anchor="middle">${fc(t, 2)}</text>`).join('');
  if (o.poly && !isAcc) g += xm.map(v => `<line class="gl" x1="${x(v)}" x2="${x(v)}" y1="${y(0)}" y2="${y(0) + 5}"/>`).join('');
  g += `<text class="lbl" x="${W / 2}" y="${H - 8}" text-anchor="middle">${o.xt || 'Intervalos'}</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

  const every = Math.ceil(xs.length / (o.maxTicks || 12));
  g += xs.map((l, i) => i % every ? '' : `<text class="tk" x="${x(i)}" y="${H - m.b + 16}" text-anchor="middle">${esc(l)}</text>`).join('');
  g += `<line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${y(ax.lo)}"/><line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${y(ax.lo)}" y2="${y(ax.lo)}"/>`;
  series.forEach((s, k) => {
    const c = s.c || PAL[k], d = s.v.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    g += `<path class="drw" style="--len:3000;--d:${.2 + k * .2}s" d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (o.dots !== false) g += s.v.map((v, i) => `<circle class="pt" style="--i:${i}" cx="${x(i)}" cy="${y(v)}" r="4" fill="${c}" stroke="${COL.ink}" stroke-width="1.5"><title>${esc(xs[i])}: ${fc(v, 3)}</title></circle>`).join('');
  });
  if (o.xt) g += `<text class="lbl" x="${W / 2}" y="${H - 4}" text-anchor="middle">${o.xt}</text>`;
  if (o.yt) g += `<text class="lbl" transform="translate(12,${H / 2}) rotate(-90)" text-anchor="middle">${o.yt}</text>`;
  const lg = series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span><i style="background:${s.c || PAL[k]}"></i>${s.n}</span>`).join('')}</div>` : '';
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>${lg}`;
}

function svgScatter(xs, ys, o = {}) {

  const xa = niceAxis(o.x0 != null ? o.x0 : Math.min(...xs), Math.max(...xs), 6), ya = niceAxis(o.y0 != null ? o.y0 : Math.min(...ys), Math.max(...ys), 6);
  const x = lin(xa.lo, xa.hi, m.l, W - m.r), y = lin(ya.lo, ya.hi, H - m.b, m.t);

  g += xa.ticks.map(t => `<line class="gl" x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}"/><text class="tk" x="${x(t)}" y="${H - m.b + 16}" text-anchor="middle">${fc(t, 2)}</text>`).join('');
  g += `<line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/><line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/>`;
  if (o.mean) g += `<line stroke="${COL.violet}" stroke-dasharray="5 5" stroke-width="1.5" x1="${x(mean(xs))}" x2="${x(mean(xs))}" y1="${m.t}" y2="${H - m.b}"/><line stroke="${COL.violet}" stroke-dasharray="5 5" stroke-width="1.5" x1="${m.l}" x2="${W - m.r}" y1="${y(mean(ys))}" y2="${y(mean(ys))}"/>`;
  if (o.line) {
    const { m: sl, b: ic } = o.line, xa0 = xa.lo, xa1 = xa.hi;
    if (o.resid) g += xs.map((v, i) => `<line class="fadein" style="--d:${.4 + i * .04}s" stroke="${COL.coral}" stroke-width="2" x1="${x(v)}" x2="${x(v)}" y1="${y(ys[i])}" y2="${y(sl * v + ic)}"/>`).join('');
    g += `<line class="drw" style="--len:900" stroke="${COL.leaf}" stroke-width="3.2" stroke-linecap="round" x1="${x(xa0)}" y1="${y(sl * xa0 + ic)}" x2="${x(xa1)}" y2="${y(sl * xa1 + ic)}"/>`;
  }
  g += xs.map((v, i) => `<circle class="pt" style="--i:${i}" cx="${x(v)}" cy="${y(ys[i])}" r="${o.r || 6}" fill="${o.col || COL.sky}" stroke="${COL.ink}" stroke-width="2"><title>(${fc(v, 3)}, ${fc(ys[i], 3)})</title></circle>`).join('');
  if (o.xt) g += `<text class="lbl" x="${W / 2}" y="${H - 6}" text-anchor="middle">${o.xt}</text>`;
  if (o.yt) g += `<text class="lbl" transform="translate(13,${H / 2}) rotate(-90)" text-anchor="middle">${o.yt}</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" ${o.id ? `id="${o.id}"` : ''}>${g}</svg>`;
}

T('estadistica', 'Estadística: descriptiva e inferencial', String.raw`
<p><b>Estadística</b> es la rama de las matemáticas que estudia los métodos de <b>recopilación, organización, descripción y análisis de datos</b>, así como la interpretación de la información con el objetivo de tomar la mejor decisión.</p>
<h4>Dos perspectivas</h4>
<ul><li><b>Descriptiva:</b> resume y describe un conjunto de datos con tablas, gráficas y medidas. Sus afirmaciones se refieren <i>sólo a ese conjunto</i>. Ej.: conocer al grupo X.</li>
<li><b>Inferencial:</b> a partir de una <i>muestra</i> establece generalidades sobre la <i>población</i>, usando probabilidad. Ej.: los gustos de los CCHeros.</li></ul>
<div class="note">Descriptiva = «qué pasó». Inferencial = «qué podría pasar».</div>
<h4>Un poco de historia</h4>
<p>En el antiguo Egipto (≈3050 a. C.) se recopilaba información sobre población y riqueza para planear las pirámides. Entre los siglos XV y XVII, pensadores como Leonardo da Vinci, Copérnico, Galileo, Neper, Harvey, Bacon y Descartes aportaron técnicas al método científico; al formarse los Estados nacionales ya había métodos de análisis de datos económicos, y creció el comercio internacional.</p>`);
T('poblacion', 'Población, muestra y muestreo', String.raw`
<ul><li><b>Población (universo):</b> conjunto de elementos (personas, animales, plantas, objetos…) a los que se estudian características comunes. Algunos autores los llaman <i>individuos</i>.</li>
<li><b>Muestra:</b> subconjunto de la población que realmente se analiza.
 <ul><li><b>Aleatoria (representativa):</b> refleja las características de la población.</li><li><b>No aleatoria (sesgada):</b> deja fuera grupos importantes.</li></ul></li>
<li><b>Muestreo:</b> proceso para obtener una muestra: encuestas (electrónicas, telefónicas, físicas), experimentos, observación simple, bases de datos (INEGI, OMS).</li></ul>
<div class="tip">La representatividad depende también del <b>tamaño</b>: si la población es muy variable se necesita una muestra grande; si varía poco, una pequeña basta.</div>`);
T('variable', 'Variables y su clasificación', String.raw`
<p><b>Variable:</b> característica o propiedad de una población que se puede medir con distintos valores o describir con diferentes modalidades.</p>
<ul><li><b>Cualitativa:</b> categorías o atributos.
 <ul><li><i>Nominal:</i> sin orden natural (signo, colonia, sangre, color).</li><li><i>Ordinal:</i> con orden natural (día, mes, estación del año).</li></ul></li>
<li><b>Cuantitativa:</b> valores numéricos de conteo o medición.
 <ul><li><i>Discreta:</i> valores enteros, finitos o infinitos (edad, aciertos, materias reprobadas).</li><li><i>Continua:</i> cualquier real dentro de un intervalo (peso, estatura, tiempo de traslado).</li></ul></li></ul>
<div class="note">En las continuas se trabaja con intervalos (abierto, semiabierto, cerrado).</div>`);
T('investigacion', 'Investigación estadística (el ciclo)', String.raw`
<p>Analiza un problema con procedimientos estadísticos que convierten datos en información útil para decidir.</p>
<ol><li><b>Problema:</b> se refina y se plantea en términos estadísticos.</li><li><b>Plan de recolección:</b> qué variable, qué datos y cómo obtenerlos.</li><li><b>Recolección:</b> encuestas, experimentos…; luego se organizan y depuran.</li><li><b>Análisis:</b> exploratorio (descriptiva, para generar hipótesis) o inferencial.</li><li><b>Conclusión:</b> se interpretan los resultados en el contexto.</li></ol>
<p>Si es necesario, el ciclo se repite considerando los resultados obtenidos.</p>`);
T('graficas', 'Qué gráfica usar', String.raw`
<table class="tb"><thead><tr><th>Tipo de variable</th><th>Gráfica recomendada</th></tr></thead><tbody>
<tr><td class="l">Cualitativa</td><td class="l">Circular (pastel), barras</td></tr>
<tr><td class="l">Cuantitativa discreta con pocos valores</td><td class="l">Líneas, barras, puntos</td></tr>
<tr><td class="l">Series de tiempo</td><td class="l">Líneas</td></tr>
<tr><td class="l">Cuantitativa discreta con muchos valores / continua</td><td class="l">Histograma, polígono de frecuencias, puntos</td></tr>
<tr><td class="l">Cualquier variable con frecuencias acumuladas</td><td class="l">Ojiva</td></tr></tbody></table>`);
T('intervalos', 'Intervalos y límites', String.raw`
<h4>Tipos de intervalo</h4><ul><li><b>Abierto</b> $(a,b)$: no incluye a sus extremos: $a<x<b$.</li><li><b>Cerrado</b> $[a,b]$: incluye a los dos extremos: $a\le x\le b$.</li><li><b>Semiabierto</b> $(a,b]$ o $[a,b)$: incluye solo uno de los extremos.</li></ul>
<svg viewBox="0 0 420 96" style="max-width:420px;width:100%" role="img" aria-label="intervalos en la recta"><g font-family="system-ui,sans-serif" font-size="12" font-weight="700"><text x="6" y="22">(a, b)</text><line x1="70" y1="18" x2="400" y2="18" stroke="#94a3b8" stroke-width="2"/><line x1="140" y1="18" x2="320" y2="18" stroke="#1c7ed6" stroke-width="5"/><circle cx="140" cy="18" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><circle cx="320" cy="18" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="6" y="52">[a, b]</text><line x1="70" y1="48" x2="400" y2="48" stroke="#94a3b8" stroke-width="2"/><line x1="140" y1="48" x2="320" y2="48" stroke="#2f9e44" stroke-width="5"/><circle cx="140" cy="48" r="6" fill="#2f9e44"/><circle cx="320" cy="48" r="6" fill="#2f9e44"/>
<text x="6" y="82">(a, b]</text><line x1="70" y1="78" x2="400" y2="78" stroke="#94a3b8" stroke-width="2"/><line x1="140" y1="78" x2="320" y2="78" stroke="#f08c00" stroke-width="5"/><circle cx="140" cy="78" r="6" fill="#fff" stroke="#f08c00" stroke-width="2.5"/><circle cx="320" cy="78" r="6" fill="#f08c00"/><text x="136" y="94" font-size="10">a</text><text x="316" y="94" font-size="10">b</text></g></svg>
<p class="sub">Punto hueco = el extremo no entra · punto relleno = sí entra.</p>
<p>Los datos continuos se agrupan en intervalos. Existen varias convenciones para decidir a qué clase pertenece un dato que cae justo en un límite:</p>
<ul><li><b>$(a,\,b]$</b> semiabierto por la izquierda: el límite superior sí entra (la primera clase es cerrada, para que entre el mínimo). Es la convención de las tablas de calificaciones del cuadernillo.</li>
<li><b>$[a,\,b)$</b> semiabierto por la derecha: el límite inferior sí entra (la última clase es cerrada para que entre el máximo).</li>
<li><b>Límites incluidos $[a,\,b]$:</b> para datos <i>discretos</i> (enteros): 152–155, 156–159… Entre una clase y la siguiente queda un «hueco» (155 → 156).</li></ul>
<h4>Fronteras (límites reales) de clase</h4>
<p>Si los datos son enteros, la unidad mínima es 1, y $\frac12=0.5$. Se restan 0.5 al límite inferior y se suman 0.5 al superior: <b>54.5 – 59.5</b>, <b>59.5 – 64.5</b>… Así no hay huecos y los histogramas no tienen espacios entre barras. Las fórmulas de mediana y moda para datos agrupados se aplican con estas fronteras.</p>`);
T('sturges', 'Regla de Sturges y número de clases', String.raw`
<p>Criterio para decidir cuántos intervalos $k$ usar con $n$ datos:</p>
<div class="fm">$$k = 1 + 3.32\,\log_{10} n \qquad\text{o bien}\qquad k \approx \sqrt n$$</div>
<p>Para $n=60$: $k = 1+3.32\log 60 = 6.90 \approx 7$ clases (Sturges); $\sqrt{60}=7.75$.</p>
<h4>Tamaño (amplitud) del intervalo</h4>
<div class="fm">$$\text{Rango}=L_{sup}-L_{inf}\qquad T.I.=\frac{\text{Rango}}{\text{núm. de intervalos}}$$</div>
<ul><li>Si el cociente es <b>exacto</b> (p. ej. $50/8=6.25$) se usa tal cual («fracción pura»).</li><li>Si <b>no es exacto</b> ($50/7=7.14$) se redondea <b>hacia arriba</b> (7.2) para que $k$ intervalos cubran todo el rango.</li></ul>`);
T('frecuencias', 'Tipos de frecuencia', String.raw`
<ul><li><b>Absoluta $f_i$:</b> cuántos datos caen en la clase.</li>
<li><b>Relativa $F_r$:</b> proporción o porcentaje del total: $F_r=\dfrac{f_i}{n}\cdot100$ (regla de tres: $n \to 100\%$). La suma puede quedar entre 99.9 % y 100.1 % por redondeo.</li>
<li><b>Acumulada $F_a$:</b> suma de las frecuencias hasta esa clase («a lo más <i>límite superior</i>»).</li>
<li><b>Relativa acumulada $F_{ra}$:</b> $F_a/n\cdot 100$.</li>
<li><b>Marca de clase $x_i=\dfrac{L_{inf}+L_{sup}}{2}$:</b> punto medio, representa a todos los datos de la clase. (Se escribe $y_i$ si la variable es $Y$.)</li></ul>`);
T('histograma', 'Histograma, polígono y ojiva', String.raw`
<ul><li><b>Histograma:</b> barras pegadas; la base es el intervalo y la altura es $f$ (o $F_r$).</li>
<li><b>Polígono de frecuencias:</b> se unen con rectas los puntos medios (marcas de clase) de la parte superior de las barras; se cierra en el eje con una clase vacía a cada lado.</li>
<li><b>Ojiva:</b> gráfica de la frecuencia acumulada contra el <i>límite superior</i>. Siempre sube; un tramo horizontal indica clase sin datos. El tramo de <b>mayor pendiente</b> es donde se concentran más datos.</li></ul>`);
T('media', 'Media, mediana y moda', String.raw`
<p><b>Medidas de tendencia central:</b> un solo valor que resume dónde se «centran» los datos.</p>
<ul><li><b>Media (promedio):</b> $\bar x=\dfrac{\sum x_i}{n}$. Es el punto de equilibrio: <b>$\sum (x_i-\bar x)=0$</b>.</li>
<li><b>Mediana:</b> dato central. Si $n$ es par, promedio de los dos centrales.</li>
<li><b>Moda:</b> dato de mayor frecuencia. Puede no existir (amodal), o ser bimodal, trimodal…</li></ul>
<h4>Datos agrupados</h4>
<div class="fm">$$\bar x=\frac{\sum x_i f_i}{n}\qquad \tilde x = L_i+\frac{\frac n2-F_{ant}}{f_{med}}\,c\qquad \hat x=L_i+\frac{\Delta_1}{\Delta_1+\Delta_2}\,c$$</div>
<p>$L_i$: límite inferior (frontera) de la clase; $F_{ant}$: acumulada anterior; $f_{med}$: frecuencia de la clase; $c$: amplitud; $\Delta_1=f_i-f_{i-1}$ y $\Delta_2=f_i-f_{i+1}$.</p>
<p>Si las clases tienen <b>amplitudes distintas</b>, se usan las alturas $h_i=f_i/a_i$ en lugar de $f_i$, y la clase modal es la de mayor <b>altura</b>.</p>
<div class="note">La mediana usa <b>interpolación</b>: estimar un valor desconocido entre dos puntos conocidos.</div>`, true);
T('dispersion', 'Medidas de dispersión', String.raw`
<p>La <b>variancia</b> (o varianza) y la desviación estándar son las medidas de dispersión más usadas.</p><p>La media sola no basta: cuatro grupos distintos pueden tener la misma media (15) y ser muy diferentes. Hay que medir <b>qué tan alejados</b> están los datos.</p>
<p>La suma de desviaciones $\sum(x_i-\bar x)$ siempre es 0 (positivas y negativas se cancelan). Se evita con <b>valor absoluto</b> o elevando <b>al cuadrado</b>.</p>
<div class="fm">$$D.M.=\frac{\sum f_i\,|x_i-\bar x|}{n}\qquad S^2=\frac{\sum f_i\,(x_i-\bar x)^2}{n}\qquad S=\sqrt{S^2}$$</div>
<ul><li><b>Poblacional</b> ($\sigma^2$): se divide entre $n$. <b>Muestral</b> ($s^2$): entre $n-1$ (estimador insesgado); con $n$ grande casi no hay diferencia.</li>
<li>La varianza nunca es negativa. La desviación estándar vuelve a las unidades originales.</li></ul>
<h4>Otro modelo (se obtiene desarrollando el binomio)</h4>
<div class="fm">$$S^2=\frac{\sum x_i^2 f_i}{n}-\bar x^{\,2}$$</div>
<div class="warn">Para usar este modelo <b>no redondees la media</b>: al elevarla al cuadrado el error se amplifica (con la tabla de calificaciones, usar 75.3 en lugar de 75.33 cambia la varianza de 133.6 a 138.7).</div>`, true);
T('binomio', 'Desarrollo del binomio', String.raw`
<div class="fm">$$(a+b)^2=a^2+2ab+b^2$$</div>
<p>Sale de multiplicar $(a+b)(a+b)$ con la propiedad distributiva. Se usa para deducir la fórmula corta de la varianza:</p>
<div class="fm">$$\frac{\sum (x_i-\bar x)^2 f_i}{n}=\frac{\sum x_i^2 f_i}{n}-2\bar x\frac{\sum x_i f_i}{n}+\bar x^2\frac{\sum f_i}{n}=\frac{\sum x_i^2 f_i}{n}-\bar x^2$$</div>`);
T('posicion', 'Cuartiles, deciles y percentiles', String.raw`
<ul><li><b>Cuartiles $Q_1,Q_2,Q_3$:</b> parten los datos ordenados en 4 bloques de 25 %. $Q_2$ es la mediana. Rango intercuartílico $IQR=Q_3-Q_1$ (el «corazón» de los datos).</li>
<li><b>Deciles $D_1\ldots D_9$</b> (de 10 % en 10 %) y <b>percentiles $P_1\ldots P_{99}$</b>. $D_5=Q_2=P_{50}$. Estar en $P_{90}$ significa superar al 90 % del grupo.</li></ul>
<h4>Posición</h4>
<div class="fm">$$L=\frac{k\,(N+1)}{100}$$</div>
<p>Si $L$ no es entero, se interpola entre los datos de las posiciones $\lfloor L\rfloor$ y $\lfloor L\rfloor+1$. ($Q_1=P_{25}$, $D_5=P_{50}$.)</p>
<h4>Diagrama de caja y bigotes</h4>
<p>Resume cinco números: mínimo, $Q_1$, mediana, $Q_3$ y máximo. La caja encierra el 50 % central. Son <b>atípicos</b> los datos fuera de $[\,Q_1-1.5\,IQR,\; Q_3+1.5\,IQR\,]$.</p>`);
T('contingencia', 'Tablas de contingencia (dos variables cualitativas)', String.raw`
<p>Cruzan dos variables cualitativas: cada celda es una <b>frecuencia conjunta</b>; los totales de fila y columna son <b>frecuencias marginales</b>.</p>
<ul><li><b>Conjunta:</b> $P(A\cap B)=\dfrac{\text{celda}}{\text{total general}}$</li><li><b>Marginal:</b> $P(A)=\dfrac{\text{total de la fila (o columna)}}{\text{total general}}$</li><li><b>Condicional:</b> $P(B\mid A)=\dfrac{\text{celda}}{\text{total de la fila de }A}$ (el universo se reduce a la fila).</li></ul>
<div class="tip">Regla para completar tablas: los totales de cada fila y de cada columna deben «cuadrar» con el total general.</div>`);
T('covarianza', 'Covarianza y diagrama de dispersión', String.raw`
<p>Con datos bivariados $(x_i,y_i)$ se grafica un <b>diagrama de dispersión</b>. El punto $(\bar x,\bar y)$ es el <b>centroide</b>: pertenece a la recta de mejor ajuste.</p>
<div class="fm">$$s_{xy}=\frac{\sum (x_i-\bar x)(y_i-\bar y)}{n-1}\qquad \sigma_{xy}=\frac{\sum (x_i-\bar x)(y_i-\bar y)}{n}$$</div>
<p>Signo $>0$: relación directa; $<0$: inversa. Sus unidades son producto de las de $x$ y $y$ (cm·kg), por eso no sirve por sí sola para medir la <i>fuerza</i>.</p>`);
T('pearson', 'Coeficiente de correlación de Pearson', String.raw`
<p>Hay dos formas equivalentes de calcular $r$; dan exactamente el mismo resultado.</p>
<h4>1 · Fórmula estándar (por definición, con desviaciones)</h4>
<div class="fm">$$r=\frac{\sum (x_i-\bar x)(y_i-\bar y)}{\sqrt{\sum (x_i-\bar x)^2\;\sum (y_i-\bar y)^2}}=\frac{s_{xy}}{s_x\,s_y}$$</div>
<p>Primero se calculan las medias y las desviaciones de cada dato. Muestra la idea: si los datos se alejan de sus medias <i>en el mismo sentido</i>, los productos son positivos y $r>0$.</p>
<h4>2 · Fórmula algebraica (de cálculo, con sumas)</h4>
<div class="fm">$$r=\frac{n\sum xy-\sum x\sum y}{\sqrt{\left[n\sum x^2-(\sum x)^2\right]\left[n\sum y^2-(\sum y)^2\right]}}$$</div>
<p>Se obtiene desarrollando los binomios de la estándar. Solo necesita las columnas $xy$, $x^2$ y $y^2$: es la más cómoda con calculadora y evita redondear medias.</p>
<ul><li>$-1\le r\le 1$. $r=1$: recta creciente; $r=-1$: recta decreciente; $r=0$: no hay relación lineal.</li><li>Orientación: $|r|\ge0.8$ fuerte, $0.5$–$0.8$ moderada, $<0.5$ débil.</li></ul>
<div class="warn"><b>Autocomprobación:</b> $r$ <u>nunca</u> puede salir mayor que 1 o menor que −1. Si te da 1.17, hay un error de cuentas.</div>
<p>Correlación ≠ causalidad: «¿se mueven juntas?» frente a «¿una causa la otra?».</p>`, true);
T('regresion', 'Recta de mínimos cuadrados', String.raw`
<p>La recta $Y=mX+b$ que minimiza la suma de los cuadrados de las distancias verticales de los puntos a la recta:</p>
<div class="fm">$$m=\frac{n\sum xy-\sum x\sum y}{n\sum x^2-(\sum x)^2}\qquad b=\frac{\sum y-m\sum x}{n}$$</div>
<ul><li><b>Pendiente $m$:</b> cuánto cambia $y$ por cada unidad que aumenta $x$ (su signo es el mismo que el de $r$).</li><li><b>Ordenada al origen $b$:</b> el valor de $y$ cuando $x=0$ (donde la recta corta al eje $Y$).</li><li>La recta siempre pasa por el <b>centroide</b> $(\bar x,\bar y)$, por eso también $b=\bar y-m\bar x$.</li></ul><p>La correlación responde «¿se mueven juntas?»; la regresión responde «si conozco una variable, ¿cuánto valdrá la otra?». Sirve para <b>interpolar</b> (valores dentro del rango de los datos); extrapolar lejos de ellos es arriesgado.</p>
<div class="note">Para estimar $x$ a partir de $y$ lo correcto es ajustar la recta de $X$ sobre $Y$; despejar $x$ de la recta de $Y$ sobre $X$ sólo es una aproximación (coinciden si $|r|=1$).</div>`);
T('aleatorio', 'Fenómenos determinísticos y aleatorios', String.raw`
<ul><li><b>Determinístico:</b> el resultado se predice con certeza (relación causa-efecto). Ej.: costo de 35 litros de gasolina a 24.10 pesos el litro; la fecha del próximo eclipse.</li>
<li><b>Aleatorio:</b> tiene varios resultados posibles que no se pueden predecir con certeza; obedece al azar. Ej.: lanzar una moneda, el resultado de una rifa.</li></ul>`);
T('espacio', 'Espacio muestral y eventos', String.raw`
<ul><li><b>Espacio muestral $\Omega$</b> (o $S$): conjunto de <i>todos</i> los resultados posibles de un experimento aleatorio. Moneda: $\Omega=\{a,s\}$. Dado: $\Omega=\{1,2,3,4,5,6\}$.</li>
<li><b>Evento</b> (suceso): cualquier subconjunto de $\Omega$ ($A,B,C…$). Ej.: $A=\{2,4,6\}$ «cae par».</li>
<li><b>Evento simple:</b> un solo elemento. <b>Evento seguro:</b> igual a $\Omega$. <b>Evento imposible:</b> $\varnothing$.</li></ul>
<h4>Principio fundamental del conteo</h4>
<p>3 monedas: $2\times2\times2=8$ resultados. Una moneda y un dado: $2\times 6=12$.</p>`);
T('enfoques', 'Enfoques de la probabilidad', String.raw`
<ul><li><b>Subjetivo:</b> asignada por una persona según su experiencia/evidencia. «¿Qué probabilidad hay de que hoy llueva?»</li>
<li><b>Frecuencial:</b> se basa en una serie larga de repeticiones: $P(A)\approx\dfrac{\text{veces que ocurre }A}{\text{veces que se repite}}$. (Ley de los grandes números: al repetir muchas veces, la frecuencia relativa se estabiliza.)</li>
<li><b>Clásico (Laplace):</b> si todos los resultados son igualmente probables, $P(A)=\dfrac{n(A)}{n(\Omega)}=\dfrac{\text{casos favorables}}{\text{casos posibles}}$.</li></ul>
<p>Siempre: $0\le P(A)\le1$, $P(\Omega)=1$, $P(\varnothing)=0$.</p>`);
T('reglas', 'Reglas de la probabilidad', String.raw`
<ul><li><b>Conjunción</b> $A\cap B$ («A y B»): ocurren los dos a la vez. Su probabilidad $P(A\cap B)$ se llama <b>probabilidad conjunta</b> de A y B (Sánchez, E.).</li><li><b>Disyunción</b> $A\cup B$ («A o B»): ocurre al menos uno de los dos.</li><li><b>«O» = unión ∪</b> y <b>«Y» = intersección ∩</b>.</li>
<li><b>Regla de la adición:</b> $P(A\cup B)=P(A)+P(B)-P(A\cap B)$ (se resta una vez la intersección porque se contó dos veces).</li>
<li><b>Mutuamente excluyentes</b> ($A\cap B=\varnothing$): $P(A\cup B)=P(A)+P(B)$.</li>
<li><b>Complemento:</b> $P(A')=1-P(A)$ («que no ocurra»).</li>
<li><b>Tres eventos:</b> $P(A\cup B\cup C)=P(A)+P(B)+P(C)-P(A\cap B)-P(A\cap C)-P(B\cap C)+P(A\cap B\cap C)$.</li>
<li><b>Leyes de De Morgan:</b> $(A\cup B)'=A'\cap B'$ y $(A\cap B)'=A'\cup B'$.</li></ul>
<div class="tip">Con problemas de «a lo más» o «al menos» suele convenir usar el complemento. «Al menos uno» $=1-P(\text{ninguno})$.</div>`);
T('condicional', 'Probabilidad condicional e independencia', String.raw`
<div class="fm">$$P(B\mid A)=\frac{P(A\cap B)}{P(A)},\;P(A)>0$$</div>
<p>Se lee «probabilidad de $B$ dado que ocurrió $A$»: el espacio muestral se reduce a $A$.</p>
<h4>Regla del producto e independencia</h4>
<div class="fm">$$P(A\cap B)=P(A)\,P(B\mid A)$$</div>
<p>$A$ y $B$ son <b>independientes</b> si saber que ocurrió uno no cambia la probabilidad del otro: $P(B\mid A)=P(B)$, es decir $P(A\cap B)=P(A)P(B)$.</p>
<div class="warn">No confundir <b>independientes</b> (no se afectan) con <b>mutuamente excluyentes</b> (no pueden ocurrir juntos). Si dos eventos tienen probabilidad positiva y son excluyentes, ¡son dependientes!</div>`);
T('conteo', 'Principios de conteo, permutaciones y combinaciones', String.raw`
<ul><li><b>Principio multiplicativo:</b> si una tarea tiene $n_1$ formas y otra $n_2$, juntas hay $n_1\cdot n_2$.</li>
<li><b>Principio aditivo:</b> si son excluyentes, se suman: $n_1+n_2$.</li>
<li><b>Factorial:</b> $n!=n(n-1)\cdots 2\cdot1$ ordenaciones de $n$ elementos distintos ($0!=1$).</li>
<li><b>Permutación</b> (el orden <i>sí</i> importa): $_nP_r=\dfrac{n!}{(n-r)!}$. Ej.: presidente, vicepresidente y secretario.</li>
<li><b>Combinación</b> (el orden <i>no</i> importa): $_nC_r=\dbinom nr=\dfrac{n!}{r!\,(n-r)!}$. Ej.: un comité.</li></ul>
<div class="note">Pregunta clave: «¿si cambio el orden, el resultado es distinto?» Sí → permutación; No → combinación.</div>
<p>Probabilidad con combinaciones: $P=\dfrac{\text{formas favorables}}{\text{formas totales}}$, ambas contadas con $\binom nr$.</p>`);
T('caos', 'Teoría del caos', String.raw`
<p>«En todo desorden hay un orden». Muchos sistemas considerados predecibles tienen límites severos de previsibilidad: son <b>muy sensibles a las condiciones iniciales</b> (efecto mariposa).</p>
<ul><li>Los pronósticos del tiempo más allá de 7–10 días son poco confiables.</li><li>Los mercados financieros son difíciles de predecir.</li><li>Pequeños eventos históricos pueden cambiar el curso de las naciones.</li><li>Sistemas biológicos (corazón, cerebro) muestran patrones complejos.</li></ul>
<p><b>Experimento de Lorenz (1961):</b> al reintroducir un dato redondeado de 0.506127 a 0.506 en un modelo del clima, el sistema evolucionó de manera completamente distinta. El caos no es desorden total, sino un orden complejo con patrones que se pueden estudiar matemáticamente.</p>`);

T('empirica', 'Regla empírica (68 – 95 – 99.7)', String.raw`
<p>Si los datos tienen una distribución <b>aproximadamente simétrica y unimodal</b> (en forma de campana), entonces:</p>
<ul><li>Cerca del <b>68 %</b> de los datos está en $\bar x\pm1\sigma$.</li><li>Cerca del <b>95 %</b> está en $\bar x\pm2\sigma$.</li><li>Cerca del <b>99.7 %</b> está en $\bar x\pm3\sigma$.</li></ul>
<div class="fm">$$\bar x-3\sigma\ \ \bar x-2\sigma\ \ \bar x-\sigma\ \ \bar x\ \ \bar x+\sigma\ \ \bar x+2\sigma\ \ \bar x+3\sigma$$</div>
<h4>Para qué sirve</h4>
<ul><li>Dar una idea rápida de dónde se concentran los datos usando sólo $\bar x$ y $\sigma$.</li><li>Detectar valores raros: un dato a más de $3\sigma$ de la media es muy poco común.</li></ul>
<div class="warn">Si la distribución es muy asimétrica o tiene varias modas, <b>no</b> debe usarse: los porcentajes reales pueden ser muy distintos.</div>`);
T('cv', 'Coeficiente de variación', String.raw`
<p>La desviación estándar se mide en las <b>mismas unidades</b> que los datos, así que no sirve para comparar variables con unidades o medias muy diferentes. El <b>coeficiente de variación</b> mide la variabilidad <i>relativa</i> a la media:</p>
<div class="fm">$$CV=\dfrac{s}{\bar x}\cdot100\%$$</div>
<ul><li>No tiene unidades (es un porcentaje).</li><li>Sólo tiene sentido si $\bar x>0$ y los datos están en una escala de razón.</li><li>Un CV menor indica un grupo más <b>homogéneo</b>; uno mayor, más <b>heterogéneo</b>.</li></ul>
<div class="tip">Ejemplo: pesos de recién nacidos $\bar x=3200$ g, $s=450$ g → $CV=14.06\%$. Estatura de adultas $\bar x=162$ cm, $s=7$ cm → $CV=4.32\%$. Aunque $450>7$, los pesos varían relativamente más.</div>
<div class="note">Como guía común, menos de 10 % se considera poca variabilidad y más de 30 % mucha, pero el criterio depende del contexto.</div>`);

add('cond', 5, 'Dos dígitos sin reemplazo', 'Se extraen dos dígitos del 1 al 9, sin reemplazamiento. Si la suma de los dígitos es un número par, hallar la probabilidad de que ambos números sean impares.', [{
  l: '', q: 'P(ambos impares | suma par)', sol: () => {
    const pairs = []; for (let a = 1; a <= 9; a++) for (let b = 1; b <= 9; b++) if (a !== b) pairs.push([a, b]);

  }
}], [{ t: 'Cuaderno', c: 'g' }]);

add('ind', 2, 'Tres monedas: ¿qué eventos son independientes?', 'Considérese el lanzamiento de 3 monedas y sean los eventos: A: la primera moneda cae águila; B: la segunda moneda cae águila; C: caen únicamente dos águilas seguidas. Determinar por parejas cuáles eventos son independientes.', [{
  l: '', q: 'Analiza las parejas (A,B), (A,C) y (B,C).', sol: () => {
    const om = coinsOmega(3), A = om.filter(s => s[0] === 'A'), B = om.filter(s => s[1] === 'A'), C = om.filter(s => /^(AAS|SAA)$/.test(s));
    const I = (X, Y) => X.filter(s => Y.includes(s)), nice = X => '{' + X.map(s => s.replace(/A/g, 'a').replace(/S/g, 's')).join(', ') + '}';
    const chk = (nm, X, Y, a, b) => { const x = I(X, Y).length; const ind = x * 8 === X.length * Y.length; return `<b>${nm}</b>: $P(${a}\\cap ${b})=\\dfrac{${x}}{8}$ y $P(${a})P(${b})=\\dfrac{${X.length}}{8}\\cdot\\dfrac{${Y.length}}{8}=\\dfrac{${X.length * Y.length}}{64}$ → ${x * 8 === X.length * Y.length ? '<span class="tag g">independientes</span>' : '<span class="tag c">dependientes</span>'}`; };
    return { steps: [['Los eventos como conjuntos', `$A=${nice(A)}$<br>$B=${nice(B)}$<br>$C=${nice(C)}$ (águilas «seguidas»: aas o saa)`], ['Criterio', `$A$ y $B$ son independientes si $P(A\\cap B)=P(A)\\cdot P(B)$.`], ['Comprobar cada pareja', [chk('(A, B)', A, B, 'A', 'B'), chk('(A, C)', A, C, 'A', 'C'), chk('(B, C)', B, C, 'B', 'C')].map(s => s.replace('$P(', '$P(')).join('<br><br>')], ['Conclusión', `Son independientes (A,B) y (A,C). Son dependientes (B,C): si C ocurre, la 2.ª moneda <i>siempre</i> es águila ($P(B\\mid C)=1\\neq\\frac12$).`]], ans: 'A y B: independientes · A y C: independientes · B y C: <b>dependientes</b>' };
  }
}], [{ t: 'Cuaderno', c: 'g' }]);

{

  const tot = i => M[i] + F[i], mS = sum(M), fS = sum(F);

    { l: 'b', q: 'Sea del sexo masculino.', sol: r([['Total de la fila masculina', `$${mS}$`], ['Probabilidad', `$P(M)=\\dfrac{${mS}}{500}=${ftex(mS, 500)}$`]], mS, 500) },
    { l: 'c', q: 'Sea del tipo «A» o tipo «AB».', sol: r([['Eventos excluyentes', `Una persona no puede ser A y AB a la vez: se suman las columnas.`], ['Sumar', `$P=\\dfrac{${tot(1)}+${tot(3)}}{500}=\\dfrac{${tot(1) + tot(3)}}{500}=${ftex(tot(1) + tot(3), 500)}$`]], tot(1) + tot(3), 500) },
    { l: 'd', q: 'No tenga sangre tipo «B».', sol: r([['Complemento', `$P(B')=1-P(B)$, con $P(B)=\\dfrac{${tot(2)}}{500}$`], ['Calcular', `$\\dfrac{500-${tot(2)}}{500}=\\dfrac{${500 - tot(2)}}{500}=${ftex(500 - tot(2), 500)}$`]], 500 - tot(2), 500) },
    { l: 'e', q: 'Sea del sexo femenino o tenga sangre tipo «A».', sol: r([['Regla de la adición', `$P(F\\cup A)=P(F)+P(A)-P(F\\cap A)$`], ['Valores', `$F=${fS}$, $A=${tot(1)}$, $F\\cap A=${F[1]}$`], ['Calcular', `$\\dfrac{${fS}+${tot(1)}-${F[1]}}{500}=\\dfrac{${fS + tot(1) - F[1]}}{500}$`]], fS + tot(1) - F[1], 500) },
    { l: 'f', q: 'Sea del sexo masculino o sexo femenino.', sol: r([['Observa', `Todas las personas son de uno u otro sexo: es el evento seguro.`], ['Calcular', `$\\dfrac{${mS}+${fS}}{500}=\\dfrac{500}{500}=1$`]], 500, 500) },
    { l: 'g', q: 'Sea del sexo femenino y no tenga sangre tipo «B».', sol: r([['Fila femenina sin la columna B', `$${fS}-${F[2]}=${fS - F[2]}$`], ['Probabilidad', `$P=\\dfrac{${fS - F[2]}}{500}$`]], fS - F[2], 500) },

const ILU = { t: 'Datos ilustrativos', c: 'a' };
/* ---- ayudantes ---- */
function contHTML(rows, rn, cn, o = {}) {
  const R = rows.map(sum), Cc = rows[0].map((_, j) => sum(rows.map(r => r[j]))), T = sum(R), hl = new Set(o.hl || []);
  const head = `<tr><th>${o.corner || ''}</th>${cn.map(c => `<th>${c}</th>`).join('')}<th>Total</th></tr>`;
  const body = rows.map((r, i) => `<tr><td class="rowh">${rn[i]}</td>${r.map((v, j) => `<td class="${hl.has(i + ',' + j) ? 'hl' : ''}">${v}</td>`).join('')}<td class="${hl.has('r' + i) ? 'hl' : ''}"><b>${R[i]}</b></td></tr>`).join('');
  return `<div class="tw"><table class="tb"><thead>${head}</thead><tbody>${body}<tr class="tot"><td>Total</td>${Cc.map((v, j) => `<td class="${hl.has('c' + j) ? 'hl' : ''}">${v}</td>`).join('')}<td>${T}</td></tr></tbody></table></div>`;
}
function regSol(xs, ys, o) {
  const g = regress(xs, ys), n = xs.length;
  const rows = xs.map((x, i) => tr([i + 1, fc(x, 4), fc(ys[i], 4), fc(x * ys[i], 4), fc(x * x, 4), fc(ys[i] * ys[i], 4)]));
  const tot = `<tr class="tot"><td>Σ</td><td>${fc(g.sx, 4)}</td><td>${fc(g.sy, 4)}</td><td>${fc(g.sxy, 4)}</td><td>${fc(g.sx2, 4)}</td><td>${fc(g.sy2, 4)}</td></tr>`;
  const yh = g.m * o.xq + g.b;
  return {
    steps: [
      ['Tabla de sumas', `$n=${n}$<br>${tbl(['#', `x (${o.xu})`, `y (${o.yu})`, 'x·y', 'x²', 'y²'], [...rows, tot])}`],
      ['Coeficiente de Pearson', `$r=\\dfrac{n\\sum xy-\\sum x\\sum y}{\\sqrt{[n\\sum x^2-(\\sum x)^2][n\\sum y^2-(\\sum y)^2]}}=\\dfrac{${n}(${fc(g.sxy, 4)})-(${fc(g.sx, 4)})(${fc(g.sy, 4)})}{\\sqrt{(${fc(g.dx, 4)})(${fc(g.dy, 4)})}}=\\dfrac{${fc(g.num, 4)}}{${fc(Math.sqrt(g.dx * g.dy), 4)}}=${fmt(g.r, 4)}$<br>Correlación <b>${strength(g.r)}</b>.`],
      ['Recta de mínimos cuadrados', `$m=\\dfrac{${fc(g.num, 4)}}{${fc(g.dx, 4)}}=${fmt(g.m, 4)}$<br>$b=\\dfrac{\\sum y-m\\sum x}{n}=\\dfrac{${fc(g.sy, 4)}-(${fmt(g.m, 4)})(${fc(g.sx, 4)})}{${n}}=${fmt(g.b, 4)}$<br>$\\hat y=${fmt(g.m, 4)}\\,x ${g.b < 0 ? '-' : '+'} ${fmt(Math.abs(g.b), 4)}$`],
      ['Predicción', `Para $x=${fc(o.xq, 4)}$ ${o.xu}: $\\hat y=${fmt(g.m, 4)}(${fc(o.xq, 4)})${g.b < 0 ? '-' : '+'}${fmt(Math.abs(g.b), 4)}=${fmt(yh, 2)}$ ${o.yu}.`]],
    r: g.r, m: g.m, b: g.b, yh,
    ans: `$r=${fmt(g.r, 4)}$ (${strength(g.r)}) · $\\hat y=${fmt(g.m, 4)}x${g.b < 0 ? '' : '+'}${fmt(g.b, 4)}$ · estimación: <b>${fmt(yh, 2)} ${o.yu}</b>`
  };
}
function distSol(arr, k, o) {
  const D = buildDist(arr, { k, conv: 'semiD' }), g = groupedStats(D), s = sturges(D.n);
  const rows = D.lims.map((c, i) => tr([i + 1, `(${fc(c.lo, 3)}, ${fc(c.hi, 3)}]`.replace('(' + fc(D.lims[0].lo, 3), '[' + fc(D.lims[0].lo, 3)), D.f[i], fmt(D.fr[i], 2) + '%', D.Fa[i], fc(D.xm[i], 3), fc(D.f[i] * D.xm[i], 3)]));
  const tabl = tbl(['Clase', 'Intervalo', 'f', 'Fr', 'Fa', 'Marca x', 'x·f'], [...rows, `<tr class="tot"><td colspan="2">Total</td><td>${D.n}</td><td>100%</td><td></td><td></td><td>${fc(sum(D.f.map((f, i) => f * D.xm[i])), 3)}</td></tr>`]);
  return { D, g, s, tabl };
}

const vzBox = (t, inner, foot = '') => `<div class="tokbox vz"><p class="sub"><b>${t}</b></p>${inner}${foot ? `<p class="sub">${foot}</p>` : ''}</div>`;
/* casillas del principio multiplicativo: items = [[valor, etiqueta], ...] */
const vzSlots = (items, res, t = 'Casillas: cuántas opciones hay en cada lugar') =>
  vzBox(t, `<div class="slots">${items.map((it, i) => `${i ? '<span class="sx">×</span>' : ''}<span class="slot" style="--i:${i}"><b>${it[0]}</b><small>${it[1] || ''}</small></span>`).join('')}<span class="sx">=</span><span class="slot res"><b>${res}</b></span></div>`);
/* fichas: grupos = [[etiqueta, cantidad, clase], ...]; se destaca lo que se elige */
const vzDots = (groups, pick, t = 'Lo que hay y lo que se elige') => {
  const mini = groups.reduce((s, g) => s + g[1], 0) > 20; let k = 0;
  const dots = groups.map(g => Array.from({ length: g[1] }, () => `<span class="dt ${g[2]}${mini ? ' sm' : ''}" style="--i:${k++}"></span>`).join('')).join('');
  const lg = groups.map(g => `<span><i class="dt ${g[2]} sm"></i>${g[0]}: <b>${g[1]}</b></span>`).join('');
  return vzBox(t, `<div class="vdots">${dots}</div><div class="legend">${lg}</div>`, pick);
};
/* modelo de área: dos probabilidades independientes p y q → el cuadro rojo es p·q */
const vzArea = (p, q, lp, lq, res) => {
  const W = 220, H = 140, O = 110, a = W * p, b = H * q;
  return vzBox('Modelo de área: «los dos a la vez» es una parte de una parte', `<svg viewBox="0 0 ${W + O + 10} ${H + 34}" class="vzsvg" role="img" aria-label="Modelo de área"><rect x="${O}" y="4" width="${W}" height="${H}" fill="#fff" stroke="#0f172a" stroke-width="1.5"/><rect x="${O}" y="${4 + H - b}" width="${a}" height="${b}" fill="#fdeaea" stroke="#e03131" stroke-width="2.2" class="vzpop"/><text x="${O + a / 2}" y="${4 + H + 18}" text-anchor="middle" font-size="12" fill="#1c7ed6" font-weight="700">${lp}</text><text x="${O - 6}" y="${4 + H - b / 2 + 4}" text-anchor="end" font-size="12" fill="#2f9e44" font-weight="700">${lq}</text><text x="${O + a / 2}" y="${4 + H - b / 2 + 5}" text-anchor="middle" font-size="14" fill="#e03131" font-weight="800">${res}</text></svg>`, 'El rectángulo rojo (ancho × alto) es la probabilidad de que ocurran ambos.');
};
/* barra proporcional: partes = [[etiqueta, valor, color], ...] */
const vzBar = (parts, t = 'Cómo se reparte la probabilidad') => { const s = parts.reduce((a, x) => a + x[1], 0); return vzBox(t, `<div class="pbar">${parts.map(x => `<span style="flex:${x[1]};background:${x[2]}"><b>${x[0]}</b></span>`).join('')}</div>`, `Todo el espacio suma ${s === 1 ? '1' : s}.`); };
/* chips de resultados: [texto, estado] con estado ''|'out'|'fav' */
const vzChips = (items, t, foot) => vzBox(t, `<div class="vchips">${items.map((c, i) => `<span class="vch ${c[1] || ''}" style="--i:${i}">${c[0]}</span>`).join('')}</div><div class="legend"><span><i class="dt out sm"></i>descartado por la condición</span><span><i class="dt fav sm"></i>favorable</span></div>`, foot);
