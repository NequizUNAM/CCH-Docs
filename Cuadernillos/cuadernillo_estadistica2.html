<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Estadística 2 · Aula Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --ink:#002B7A;--ink2:#0A3586;--ink3:#1B4AA6;--paper:#b6bbc3;--card:#ffffff;--line:#e2e8f0;--line2:#eef2f7;
  --sage:#D59F0F;--sage2:#EEF3FC;--leaf:#2E5CB8;--leaf2:#002B7A;--coral:#E4572E;--coral2:#FDE9E3;--amber:#F2C14E;--amber2:#FDF6E0;
  --sky:#3E7BD4;--sky2:#E3EDFB;--violet:#7C5CF0;--violet2:#ECE6FD;--muted:#64748b;--ok:#1F9D55;--bad:#D64545;
  --r:16px;--sh:0 1px 2px rgba(0,43,122,.06),0 2px 6px rgba(0,43,122,.04);--sh2:0 1px 2px rgba(0,43,122,.08);
  --f-head:'Space Grotesk','Segoe UI',system-ui,sans-serif;--f-body:'Inter','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:.5rem 0}
a{color:var(--leaf2)}
button{font-family:inherit;cursor:pointer}
code,.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#e8efe9;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 90px;scrollbar-width:thin;scrollbar-color:var(--ink3) transparent;z-index:50}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 16px;border-block-end:1px solid #ffffff1f;margin-block-end:12px;text-decoration:none;color:#fff}
.brand .logo{width:44px;height:44px;border-radius:12px;background:var(--sage);display:grid;place-items:center;color:var(--ink);flex:none;box-shadow:3px 3px 0 #000}
.brand b{font-family:var(--f-head);font-size:1.05rem;display:block;line-height:1.1}
.brand small{opacity:.65;font-size:.74rem}
.ublock{margin:10px 0}
.utitle{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--sage);padding:8px 10px 4px;width:100%;background:none;border:0;text-align:left}
.utitle .n{background:var(--sage);color:var(--ink);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.plink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#cfdad2;padding:8px 10px;border-radius:10px;font-size:.92rem;position:relative;transition:background .2s,color .2s,transform .2s}
.plink:hover{background:#ffffff14;color:#fff;transform:translateX(3px)}
.plink .ic{width:26px;text-align:center;font-size:1.05rem}
.plink.on{background:var(--sage);color:var(--ink);font-weight:600}
.plink .ck{margin-inline-start:auto;font-size:.8rem;opacity:0;transition:opacity .3s}
.plink.done .ck{opacity:1;color:var(--sage)}
.plink.on.done .ck{color:var(--leaf2)}
.rail-foot{display:grid;gap:8px;margin-block-start:18px;padding:12px 6px;border-block-start:1px solid #ffffff1f}
.rail-foot .btn{justify-content:flex-start;background:#ffffff12;color:#fff;border-color:#ffffff30;box-shadow:none}
.rail-foot .btn:hover{background:#ffffff26}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh;
  background-image:linear-gradient(#002B7A0a 1px,transparent 1px),linear-gradient(90deg,#002B7A0a 1px,transparent 1px);background-size:32px 32px}
.top{position:sticky;top:0;z-index:40;background:#fcfcfde8;backdrop-filter:blur(8px);border-block-end:1.5px solid var(--ink);display:flex;align-items:center;gap:12px;padding:10px 22px}
.top .burger{display:none}
.crumb{font-family:var(--f-head);font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{opacity:.4}
.crumb span:last-child{overflow:hidden;text-overflow:ellipsis}
.prog{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;max-width:340px;margin-inline-start:auto}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--sage),var(--sage) 8px,#8fc06f 8px,#8fc06f 16px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.top .btn{flex:none}
.stage{flex:1;padding:26px 28px 40px;max-width:1240px;width:100%;margin:0 auto}
.pager{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fcfcfdf2;backdrop-filter:blur(8px);border-block-start:1.5px solid var(--ink)}
.pager .dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pager .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0;transition:transform .2s,background .2s}
.pager .dot:hover{transform:scale(1.4)}
.pager .dot.on{background:var(--coral);transform:scale(1.3)}
.pager .dot.done{background:var(--sage)}
.pager .dot.on.done{background:var(--coral)}
/* ---------- páginas ---------- */
.pg{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) both}
.pg.out{animation:pgOut .22s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:none}}
@keyframes pgOut{to{opacity:0;transform:translateX(-18px)}}
.hero{position:relative;background:var(--ink);color:#fff;border-radius:22px;padding:28px 30px 26px;overflow:hidden;box-shadow:var(--sh);border:2px solid var(--ink);margin-block-end:20px}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sage),#5f9e4f 60%,transparent 62%);opacity:.9;animation:float 7s ease-in-out infinite}
.hero::before{content:'';position:absolute;right:120px;bottom:-70px;width:150px;height:150px;border-radius:30px;background:var(--coral);transform:rotate(18deg);opacity:.9;animation:float 9s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(14px) rotate(6deg)}}
.hero>*{position:relative;z-index:2}
.kick{display:inline-flex;gap:8px;align-items:center;background:var(--sage);color:var(--ink);font-family:var(--f-head);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.hero h1{font-size:clamp(1.7rem,3.2vw,2.6rem);margin:12px 0 8px;max-width:760px}
.hero p.lead{max-width:680px;color:#cfe0d4;margin:0 0 14px;font-size:1.02rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:6px;background:#fff;border:1.5px solid var(--ink);border-radius:99px;width:max-content;max-width:100%;overflow:auto;box-shadow:var(--sh2)}
.tab{border:0;background:none;padding:8px 16px;border-radius:99px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:all .25s}
.tab:hover{background:var(--sage2);color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.pane{display:none}
.pane.on{display:block;animation:paneIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes paneIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gside{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.stack{display:grid;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.pn{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);min-width:0}
.pn.flat{box-shadow:none;border-width:1.5px}
.pn.dark{background:var(--ink2);color:#e8efe9}
.pn.sage{background:var(--sage2)}
.pn.amber{background:var(--amber2)}
.pn.sky{background:var(--sky2)}
.pn.coral{background:var(--coral2)}
.pn.violet{background:var(--violet2)}
.pn h3{font-size:1.15rem;display:flex;align-items:center;gap:10px;margin-block-end:8px}
.pn h3 .ico{width:34px;height:34px;border-radius:10px;background:var(--sage);display:grid;place-items:center;font-size:1.1rem;border:1.5px solid var(--ink);flex:none}
.pn h4{font-size:1rem;margin:14px 0 6px}
.sub{color:var(--muted);font-size:.9rem}
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
/* ---------- botones / formularios ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:600;font-size:.9rem;box-shadow:var(--sh2);transition:transform .12s,box-shadow .12s,background .2s;text-decoration:none;line-height:1.2}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);background:var(--sage2)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:var(--ink3)}
.btn.go{background:var(--sage)}.btn.go:hover{background:#bde0a2}
.btn.co{background:var(--coral);color:#fff}.btn.co:hover{background:#ff8168}
.btn.sm{padding:5px 12px;font-size:.8rem}
.btn.ghost{box-shadow:none;background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid currentColor;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:600;background:#ffffff14;color:#fff;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--sage);color:var(--ink);border-color:var(--sage)}
.chip.l{color:var(--ink);background:#fff}.chip.l:hover{background:var(--sage2);border-color:var(--ink)}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1.5px solid var(--ink);background:var(--amber2)}
.tag.g{background:var(--sage2)}.tag.b{background:var(--sky2)}.tag.v{background:var(--violet2)}.tag.c{background:var(--coral2)}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
input[type=number]{width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--sage);outline-offset:1px}
textarea{width:100%;min-height:70px;font-family:var(--f-mono);font-size:.88rem}
input[type=range]{width:100%;accent-color:var(--leaf);height:6px}
.sw{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:.85rem;cursor:pointer;user-select:none}
.sw input{accent-color:var(--leaf);width:18px;height:18px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;font-size:.84rem}
.seg button.on{background:var(--ink);color:#fff}
.seg button:not(.on):hover{background:var(--sage2)}
/* ---------- tablas ---------- */
.tw{overflow:auto;border:1.5px solid var(--ink);border-radius:12px;background:#fff;max-width:100%}
table.tb{border-collapse:collapse;width:100%;font-size:.88rem}
.tb th{background:var(--ink);color:#fff;padding:8px 10px;font-family:var(--f-head);font-weight:600;font-size:.78rem;letter-spacing:.03em;text-align:center;position:sticky;top:0;white-space:nowrap}
.tb td{padding:6px 10px;border-block-start:1px solid var(--line2);text-align:center;font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.tb tbody tr:nth-child(even){background:#faf7ee}
.tb tr.tot td{background:var(--sage2);font-weight:700;border-block-start:2px solid var(--ink)}
.tb td.l,.tb th.l{text-align:left}
.tb tr.hl td,.tb td.hl{background:var(--amber2)!important;font-weight:700}
.tb td.rowh{background:var(--ink2);color:#fff;font-family:var(--f-head);font-weight:600;text-align:left}
.tb td input{width:78px;text-align:center;padding:4px 6px;font-family:var(--f-mono)}
.tb td input.ok{background:#dff5e5;border-color:var(--ok)}
.tb td input.bad{background:#fde1e1;border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cellpop{animation:cellpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cellpop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* ---------- notas ---------- */
.note,.tip,.warn,.okb{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem;border:1.5px solid var(--ink)}
.note{background:var(--amber2);position:relative;transform:rotate(-.4deg)}
.note::before{content:'📌 ';}
.tip{background:var(--sky2)}.tip::before{content:'💡 '}
.warn{background:var(--coral2)}.warn::before{content:'⚠️ '}
.okb{background:var(--sage2)}.okb::before{content:'✅ '}
.fm{background:#fff;border:1.5px dashed var(--ink);border-radius:12px;padding:10px 14px;margin:10px 0;overflow-x:auto;text-align:center}
.kpi{display:grid;gap:2px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:var(--sh2);min-width:0}
.kpi small{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--f-mono);font-size:1.45rem;line-height:1.1;overflow-wrap:anywhere}
.kpi.g{background:var(--sage2)}.kpi.a{background:var(--amber2)}.kpi.s{background:var(--sky2)}.kpi.c{background:var(--coral2)}.kpi.v{background:var(--violet2)}
.link{background:none;border:0;padding:0;color:var(--leaf2);font-weight:600;text-decoration:underline dotted;cursor:pointer;font-size:inherit}
.link:hover{color:var(--coral)}
.th{display:inline-flex;align-items:center;gap:6px;background:var(--violet2);border:1.5px solid var(--ink);border-radius:99px;padding:2px 11px 2px 8px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink);transition:all .2s}
.th:hover{background:var(--violet);color:#fff;transform:translateY(-1px)}
.th::before{content:'📖'}
/* ---------- modal / drawer ---------- */
.ov{position:fixed;inset:0;background:#002B7Aaa;backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;animation:dlgIn .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes dlgIn{from{transform:translateY(40px) scale(.94);opacity:0}}
.dlg.wide{max-width:980px}
.dlg-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-block-end:2px solid var(--ink);background:var(--sage)}
.dlg-h h3{font-size:1.15rem;flex:1}
.dlg-h button{border:1.5px solid var(--ink);background:#fff;border-radius:50%;width:34px;height:34px;font-size:1rem}
.dlg-b{padding:18px 22px;overflow:auto}
.dlg-b h4{margin:14px 0 4px}
.dlg-b ul{padding-inline-start:20px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .35s;z-index:300;font-weight:600;border:2px solid var(--sage)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- ejercicios ---------- */
.ex{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-block-end:16px}
.ex-h{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:var(--ink);color:#fff}
.ex-h .no{background:var(--sage);color:var(--ink);font-family:var(--f-head);font-weight:700;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;padding:0 6px;flex:none}
.ex-h .tt{flex:1;font-weight:600}
.ex-h .tags{display:flex;gap:6px;flex-wrap:wrap;margin-block-start:4px}
.ex-b{padding:14px 16px}
.part{border-block-start:1.5px dashed var(--line);padding:10px 0}
.part:first-child{border-block-start:0}
.part-q{display:flex;gap:10px;align-items:flex-start}
.part-q .lb{background:var(--amber);border:1.5px solid var(--ink);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-family:var(--f-head);flex:none}
.part-q .tx{flex:1}
.sol{display:none;margin:10px 0 2px 38px;border-inline-start:4px solid var(--sage);padding:4px 0 4px 14px}
.sol.on{display:block;animation:paneIn .4s both}
.stp{display:none;margin:8px 0}
.stp.on{display:block;animation:stpIn .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes stpIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
.stp .sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;font-weight:700;margin-inline-end:8px}
.stp-b{margin-inline-start:32px}
.ans{display:none;margin-block-start:8px;background:var(--sage2);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
.ans.on{display:block;animation:stpIn .5s both}
.sol-ctl{display:flex;gap:8px;align-items:center;margin-block-start:8px;flex-wrap:wrap}
.pips{display:flex;gap:4px}.pips i{width:18px;height:6px;border-radius:9px;background:var(--line)}.pips i.on{background:var(--leaf)}
/* ---------- gráficas ---------- */
svg{max-width:100%}
svg text{font-family:var(--f-body)}
.ch{width:100%;height:auto;display:block}
.ax{stroke:var(--ink);stroke-width:1.5}.gl{stroke:#002B7A22;stroke-width:1}
.tk{font-size:11px;fill:var(--muted);font-family:var(--f-mono)}
.lbl{font-size:12px;fill:var(--ink);font-weight:600}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*55ms);transition:filter .2s}
.bar:hover{filter:brightness(1.12)}
@keyframes grow{from{transform:scaleY(0)}}
.drw{stroke-dasharray:var(--len,1200);stroke-dashoffset:var(--len,1200);animation:drw 1.4s ease forwards;animation-delay:var(--d,.2s)}
@keyframes drw{to{stroke-dashoffset:0}}
.pt{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.fadein{animation:fade .8s both;animation-delay:var(--d,0s)}
.drop{animation:dropIn .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes dropIn{from{transform:translateY(-120px);opacity:0}}
.draggable{cursor:grab}.draggable:active{cursor:grabbing}
/* ---------- monedas, dados, árbol ---------- */
.coin{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2.5px solid var(--ink);font-family:var(--f-head);background:radial-gradient(circle at 35% 30%,#ffe08a,#e0a82e);box-shadow:2px 3px 0 var(--ink);animation:flip .7s cubic-bezier(.3,1.3,.5,1) both}
.coin.s{background:radial-gradient(circle at 35% 30%,#e8eef0,#9fb0b8)}
@keyframes flip{from{transform:rotateX(720deg) scale(.4);opacity:0}}

/* =====================================================================
   TEMA · MinimalistEdu — azul institucional + oro, Bento, vidrio sutil
   sobre escritorio gris con hoja de libreta (fondo off-white)
   ===================================================================== */
:root{
  --blue:#002B7A;--blue-2:#0B3C9E;--blue-3:#2E5CB8;--blue-50:#EEF3FC;--blue-100:#DCE7F8;
  --gold:#D59F0F;--gold-ink:#8A6400;--gold-50:#FDF6E0;--gold-100:#FAEBBE;
  --bg:#fcfcfd;--bg-2:#f8fafc;--text:#334155;--bd:#d5deeb;--desk:#b6bbc3;--sheet:#fcfcfd;--rule:#dfe7f3;--mx:80px;
  --r-lg:20px;--r-sm:10px;--glass:rgba(255,255,255,.78);--ease:cubic-bezier(.4,0,.2,1);
  --sh-1:0 1px 2px rgba(0,43,122,.06),0 2px 6px rgba(0,43,122,.04);--sh-2:0 12px 24px rgba(0,43,122,.06),0 2px 4px rgba(0,43,122,.05);
  --f-hand:'Caveat','Comic Sans MS',cursive;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--desk);color:var(--text)}
:focus-visible{outline:3px solid rgba(213,159,15,.6);outline-offset:2px}
.d-none{display:none!important}
/* --- tipografía --- */
.stage h2,.pn h3,.pn h4,.dlg-b h4,.plan-u{color:var(--ink)}
.pn.dark h3,.pn.dark h4,.pn.dark b{color:#fff}
.stage h2{font-family:var(--f-hand);font-size:clamp(1.7rem,3.6vw,2.2rem);font-weight:700;letter-spacing:0;text-decoration:underline wavy rgba(213,159,15,.55);text-underline-offset:6px}
.pn h3{font-size:clamp(1.02rem,1.5vw,1.18rem)}
.kpi b,.big{color:var(--ink)}
.pn.dark .big,.pn.dark .kpi b{color:#fff}
/* --- escritorio y barras de vidrio --- */
.main{background-color:var(--desk);background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.5px),linear-gradient(180deg,#c3c7ce,#a9aeb6);background-size:6px 6px,100% 100%}
.top,.pager{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15)}
.top{border-block-end:1px solid rgba(0,43,122,.14);border-bottom-width:1px}
.pager{border-block-start:1px solid rgba(0,43,122,.14);border-top-width:1px}
.prog{border:1px solid var(--bd);background:#fff}
.pager .dot{border:1px solid var(--ink)}
@supports not (backdrop-filter:blur(1px)){.top,.pager{background:rgba(255,255,255,.96)}}
/* --- hoja de libreta: off-white, renglones azulados, margen dorado, espiral --- */
.stage{position:relative;flex:none;inline-size:calc(100% - 48px);max-inline-size:1240px;margin-block:24px 40px;margin-inline:auto;padding-block:30px 48px;padding-inline:calc(var(--mx) + 34px) 34px;
  background-color:var(--sheet);
  background-image:linear-gradient(90deg,transparent calc(var(--mx) - 2px),rgba(213,159,15,.8) calc(var(--mx) - 2px),rgba(213,159,15,.8) var(--mx),transparent var(--mx),transparent calc(var(--mx) + 4px),rgba(213,159,15,.8) calc(var(--mx) + 4px),rgba(213,159,15,.8) calc(var(--mx) + 5px),transparent calc(var(--mx) + 5px)),
    repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 0,0 18px;border-radius:4px 14px 14px 4px;
  box-shadow:0 1px 0 #fff inset,0 7px 0 -3px #eef0f3,0 8px 0 -3px rgba(0,43,122,.16),0 14px 0 -6px #e4e7ec,0 15px 0 -6px rgba(0,43,122,.12),0 24px 36px rgba(0,30,80,.28)}
.stage::before{content:'';position:absolute;inset-inline-start:-20px;inset-block:0;inline-size:54px;pointer-events:none;z-index:3;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='54' height='34'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23fafafa'/><stop offset='.45' stop-color='%23a4aab0'/><stop offset='1' stop-color='%23454a50'/></linearGradient><radialGradient id='h' cx='.5' cy='.4' r='.6'><stop offset='0' stop-color='%23666b71'/><stop offset='1' stop-color='%23202427'/></radialGradient></defs><circle cx='38' cy='17' r='6.5' fill='url(%23h)'/><rect x='4' y='12.5' width='40' height='9' rx='4.5' fill='url(%23g)' stroke='%2330353a' stroke-width='.8'/></svg>") repeat-y}
/* --- héroe (tile principal) --- */
.hero{background:linear-gradient(135deg,#002B7A 0%,#0B3C9E 100%);border:0;border-radius:var(--r-lg);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.14);padding-block:clamp(22px,3vw,30px);padding-inline:clamp(18px,3vw,32px)}
.hero::after{background:radial-gradient(circle at 30% 30%,#F2C14E,#D59F0F 62%,transparent 64%);opacity:.95}
.hero::before{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.6rem);color:#fff}
.hero p.lead{color:#D6E2F7}
.kick{background:var(--gold);color:var(--ink)}
/* --- tiles Bento --- */
.pn{position:relative;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-1);padding:clamp(14px,2vw,20px);transition:box-shadow .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.pn:hover{box-shadow:var(--sh-2);border-color:#c2cfe5}
.pn.flat{box-shadow:none;border-width:1px}
.pn.dark{background:linear-gradient(160deg,#0A3586,#002B7A);border-color:transparent;color:#e7eefc}
.pn h3 .ico{background:var(--gold-50);border:1px solid #ecd48a}
.unitcard{overflow:hidden}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bento>*{min-width:0}
.bento>.s3{grid-column:span 3}.bento>.s4{grid-column:span 4}.bento>.s5{grid-column:span 5}.bento>.s6{grid-column:span 6}.bento>.s7{grid-column:span 7}.bento>.s8{grid-column:span 8}.bento>.s12{grid-column:1/-1}
@media (max-width:1000px){.bento>*{grid-column:span 6!important}.bento>.s12{grid-column:1/-1!important}}
@media (max-width:640px){.bento>*{grid-column:1/-1!important}}
.stack>*,.grid2>*,.grid3>*,.grid4>*,.gside>*{min-width:0}
@media (hover:hover){.unitcard:hover,.ex:hover,.kpi:hover,.flipc:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}}
.unitcard,.ex,.kpi{transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
/* --- botones, pestañas, controles --- */
.btn{border:1px solid var(--bd);box-shadow:none;background:#fff;color:var(--ink);transition:transform .3s var(--ease),box-shadow .3s var(--ease),background-color .3s var(--ease),border-color .3s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh-2);background:var(--blue-50);border-color:#b8c8e4}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:var(--ink2)}
.btn.go{background:var(--gold);color:var(--ink);border-color:var(--gold)}.btn.go:hover{background:#E3B13A}
.btn.co{background:var(--coral);color:#fff;border-color:var(--coral)}.btn.co:hover{background:#EE6D45}
.rail-foot .btn{border-color:#ffffff33}.rail-foot .btn:hover{box-shadow:none;background:#ffffff26}
.tabs{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh-1);padding:5px;gap:4px}
.tab{border-radius:10px;color:var(--muted);transition:background-color .3s var(--ease),color .3s var(--ease)}
.tab:hover{background:var(--blue-50);color:var(--ink)}.tab.on{background:var(--ink);color:#fff}
.seg{border:1px solid var(--bd)}
.chip.l{border:1px solid var(--bd)}
input[type=text],input[type=number],select,textarea,input.cell{border:1px solid var(--bd);border-radius:var(--r-sm)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(0,43,122,.16);outline-offset:1px;border-color:var(--blue-3)}
input[type=range]{accent-color:var(--blue-3)}
.tag,.th{border-width:1px}
.opt{border:1px solid var(--bd)}.opt.ok{background:#DFF3E6;border-color:var(--ok)}.opt.bad{background:var(--coral2);border-color:var(--coral)}
/* --- tablas, KPIs, notas, ejercicios --- */
.tw{border:1px solid var(--bd);border-radius:12px}
.tb tbody tr:nth-child(even){background:var(--bg-2)}
.kpi{border:1px solid var(--bd);box-shadow:var(--sh-1)}
.note,.tip,.warn,.okb{border:1px solid rgba(0,43,122,.14)}
.note{font-family:var(--f-hand);font-size:1.22rem;line-height:1.25;background:#FDF3C4;border-color:#e6cd73;box-shadow:2px 3px 0 rgba(0,43,122,.1);transform:rotate(-.4deg)}
.note::before{content:'📌 '}
.okb{background:#E7F6EC}
.fm{border:1px dashed #b8c8e4;background:#fff}
.ex{border:1px solid var(--bd);box-shadow:var(--sh-1)}
.ans{border:1px solid rgba(0,43,122,.18);background:var(--blue-50)}
.part-q .lb{background:var(--amber);border:1px solid #d9a92f}
.stp .sn{background:var(--ink)}
/* --- cinta adhesiva (libreta) --- */
.stage .pn.rv:not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{content:'';position:absolute;inset-block-start:-11px;inset-inline-start:50%;inline-size:76px;block-size:20px;margin-inline-start:-38px;background:rgba(213,159,15,.55);transform:rotate(-2deg);box-shadow:0 1px 0 rgba(0,43,122,.12);z-index:1;pointer-events:none}
.stage .pn.rv:nth-child(even):not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{transform:rotate(2.5deg);background:rgba(46,92,184,.28);margin-inline-start:-12px}
.stage .pn.rv:nth-child(3n):not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{background:rgba(100,116,139,.3);inset-inline-start:30px;margin-inline-start:0;transform:rotate(-4deg)}
/* --- ventanas (vidrio) --- */
.ov{background:rgba(0,43,122,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(0,43,122,.14);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(0,30,80,.24)}
.dlg-h{background:var(--blue-50);border-block-end:1px solid rgba(0,43,122,.12);border-bottom-width:1px}
.dlg-h button{border:1px solid var(--bd)}
.toast{background:rgba(0,43,122,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--gold)}
@supports not (backdrop-filter:blur(1px)){.dlg{background:#fff}}
/* --- skeletons (se muestran quitando d-none) --- */
.skel{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.sk-tile{grid-column:span 7;display:grid;gap:12px;align-content:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-1)}
.sk-tile.side{grid-column:span 5}
.sk-line,.sk-box{display:block;background:linear-gradient(90deg,#e6ecf6 25%,#f4f7fc 37%,#e6ecf6 63%);background-size:400% 100%;animation:skWave 1.4s ease infinite;border-radius:8px}
.sk-line{block-size:12px}.sk-line.w40{inline-size:40%}.sk-line.w60{inline-size:60%}.sk-line.w80{inline-size:80%}
.sk-box{block-size:150px;border-radius:12px}.sk-box.sm{block-size:90px}
@keyframes skWave{from{background-position:100% 50%}to{background-position:0 50%}}
.sk-pulse{animation:skPulse 1.4s ease-in-out infinite}
@keyframes skPulse{50%{opacity:.5}}
@media (max-width:1000px){.skel>*{grid-column:1/-1}}
/* --- libreta en pantallas chicas --- */
@media (max-width:1000px){:root{--mx:44px}.stage{inline-size:calc(100% - 28px);padding-block:20px 36px;padding-inline:calc(var(--mx) + 18px) 14px;margin-block:16px 28px}}
@media (max-width:640px){:root{--mx:30px}.stage{inline-size:calc(100% - 14px);padding-block:16px 30px;padding-inline:calc(var(--mx) + 12px) 10px;margin-block:10px 22px;border-radius:3px 10px 10px 3px}.stage::before{inset-inline-start:-24px}.stage h2{font-size:1.7rem}}
/* ---------- plan de estudios (modal) ---------- */
.plan-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.plan-sum>div{border:1.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;display:grid;grid-template-columns:32px 1fr;gap:0 8px;align-items:center}
.plan-sum b{grid-row:span 2;background:var(--sage);border:1.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;height:32px;font-family:var(--f-head)}
.plan-sum span{font-size:.76rem;line-height:1.2}
.plan-sum em{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:.86rem}

.plan-pill:hover{background:var(--sage2)}.plan-pill.on{background:var(--ink);color:#fff}

.plan-pill{color:var(--ink)}.plan-pill.on{color:#fff}
label.f{min-width:0}label.f>input,label.f>select,label.f>textarea{width:100%;min-width:0}
html,body{overflow-x:clip}.stage,main{overflow-x:clip}

/* =====================================================================
   ESTÁNDAR AULA DIGITAL · igual en todos los cuadernillos
   paleta primaria (rojo = resultados) + pasteles por tipo de ecuación,
   sombras suaves, tarjetas y fondo gris pastel claro
   ===================================================================== */
:root{
  --c1:#e03131;--c2:#1c7ed6;--c3:#2f9e44;--c4:#f08c00;--c5:#7048e8;               /* primarios: rojo · azul · verde · naranja · violeta */
  --p1:#fdeaea;--p2:#e7f1fb;--p3:#e6f6ea;--p4:#fff4e0;--p5:#efeafc;               /* pasteles */
  --b1:#f5b8b8;--b2:#b9d5f1;--b3:#b4e1bf;--b4:#fbd49c;--b5:#d3c8f6;               /* bordes pastel */
  --shadow-sm:0 4px 10px rgba(15,23,42,.06);--shadow-md:0 10px 25px rgba(15,23,42,.12);--shadow-lg:0 18px 40px rgba(15,23,42,.18);
  --sh:var(--shadow-sm);--sh2:var(--shadow-sm);--sh-1:var(--shadow-sm);--sh-2:var(--shadow-md);
  --ink:#0f172a;--ink2:#1e293b;--ink3:#334155;--text:#334155;--muted:#64748b;
  --desk:#eef1f6;--line:#e2e8f0;--line2:#eef2f7;--bd:#dbe3ee;--bg-2:#f8fafc;
  --sage:var(--c4);--sage2:var(--p3);--gold:var(--c4);--gold-50:var(--p4);--gold-100:#ffe8cc;--gold-ink:#9a4b00;
  --coral:var(--c1);--coral2:var(--p1);--sky:var(--c2);--sky2:var(--p2);--leaf:var(--c3);--violet:var(--c5);--violet2:var(--p5);
  --amber:#ffd43b;--amber2:var(--p4);--blue-50:var(--p2);--blue-100:#d0e4f8;--blue-3:var(--c2);--ok:var(--c3);--bad:var(--c1);
}
/* --- fondo gris pastel claro (solo cuadernillos) --- */
body{background:var(--desk)}
.main{background-color:var(--desk);background-image:radial-gradient(rgba(15,23,42,.055) 1px,transparent 1.6px);background-size:8px 8px}
:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
/* --- barras y encabezados --- */
.rail{background:linear-gradient(180deg,#0f172a,#1e293b)}
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#0f172a 100%);border-bottom:5px solid var(--c4);box-shadow:var(--shadow-md)}
.pn.dark{background:linear-gradient(160deg,#1e293b,#0f172a)}
.ov{background:rgba(15,23,42,.38)}
.toast{background:rgba(15,23,42,.92);border-color:var(--c4)}
.stage{box-shadow:0 1px 0 #fff inset,0 7px 0 -3px #f4f6f9,0 8px 0 -3px rgba(15,23,42,.12),0 14px 0 -6px #e9edf2,0 15px 0 -6px rgba(15,23,42,.09),var(--shadow-lg)}
/* --- tarjetas y sombras --- */
.pn,.ex,.kpi,.tw,.tabs,.unitcard,.flipc{border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.pn.flat{box-shadow:none}
.pn:hover{box-shadow:var(--shadow-md);border-color:#cdd8e8}
.pn.sage{background:var(--p3);border-color:var(--b3)}.pn.amber{background:var(--p4);border-color:var(--b4)}.pn.sky{background:var(--p2);border-color:var(--b2)}
.pn.coral{background:var(--p1);border-color:var(--b1)}.pn.violet{background:var(--p5);border-color:var(--b5)}
.pn h3 .ico{background:var(--p4);border:1px solid var(--b4)}
.ex{border-top:5px solid var(--gc,var(--c2))}
.ex-h{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.ex-h .no{background:var(--gc,var(--c2));color:#fff}
.ex-h .tag{color:var(--ink)}
.part-q .lb{background:var(--p4);border:1px solid var(--b4);color:#9a4b00}
.sol{border-inline-start:4px solid var(--b4)}
@media (hover:hover){.unitcard:hover,.ex:hover,.kpi:hover,.flipc:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}}
/* --- botones --- */
.btn{border:1px solid var(--bd);box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--p2);border-color:var(--b2);box-shadow:var(--shadow-md)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:var(--ink2)}
.btn.go{background:var(--c4);border-color:var(--c4);color:#fff}.btn.go:hover{background:#d97a00}
.btn.co{background:var(--c1);border-color:var(--c1);color:#fff}.btn.co:hover{background:#c92a2a}
.rail-foot .btn{background:#ffffff12;color:#fff;border-color:#ffffff33;box-shadow:none}
.tab.on,.seg button.on,.plan-pill.on{background:var(--ink);color:#fff}
.tab:hover,.seg button:not(.on):hover,.plan-pill:hover{background:var(--p2)}
.th{background:var(--p5);border-color:var(--b5);color:#4c2fb0}.th:hover{background:var(--c5);color:#fff}
.opt:hover{background:var(--p2)}.opt.ok{background:var(--p3);border-color:var(--c3)}.opt.bad{background:var(--p1);border-color:var(--c1)}
/* --- tablas --- */
.tb th,.plan-t th{background:var(--ink)}
.tb tbody tr:nth-child(even){background:var(--bg-2)}
.tb tr.tot td,.tb tr.sum td{background:var(--p1);color:var(--c1);font-weight:800}      /* totales = resultado */
.tb tr.hl td,.tb td.hl{background:var(--p4)!important}
/* --- RESULTADOS SIEMPRE EN ROJO --- */
.ans{background:var(--p1);border:1px solid var(--b1);border-left:5px solid var(--c1);color:var(--c1);font-weight:700}
.ans b,.ans i,.ans em,.ans span,.ans .katex{color:var(--c1)}
.kpi b,.res,.result{color:var(--c1)}
.pn.dark .kpi b{color:#fff}
.kpi{background:#fff}.kpi.g{background:var(--p3)}.kpi.a{background:var(--p4)}.kpi.s{background:var(--p2)}.kpi.c{background:var(--p1)}.kpi.v{background:var(--p5)}
/* --- TIPOS DE ECUACIÓN (pastel) ---
   violeta = fórmula/modelo · azul = datos · naranja = sustitución y cálculo · verde = comprobación · rojo = resultado */
.eqbox,.fm{border-radius:12px;padding:10px 14px;margin:10px 0;overflow-x:auto;text-align:center;border:1px solid var(--b2);border-left:5px solid var(--c2);background:var(--p2)}
.fm{border-style:solid;border-color:var(--b5);border-left-color:var(--c5);background:var(--p5)}
.stp[data-k=f] :is(.eqbox,.fm){background:var(--p5);border-color:var(--b5);border-left-color:var(--c5)}
.stp[data-k=d] :is(.eqbox,.fm){background:var(--p2);border-color:var(--b2);border-left-color:var(--c2)}
.stp[data-k=c] :is(.eqbox,.fm){background:var(--p4);border-color:var(--b4);border-left-color:var(--c4)}
.stp[data-k=v] :is(.eqbox,.fm){background:var(--p3);border-color:var(--b3);border-left-color:var(--c3)}
.stp[data-k=r] :is(.eqbox,.fm){background:var(--p1);border-color:var(--b1);border-left-color:var(--c1)}
.stp[data-k=r] :is(.eqbox,.fm) .katex{color:var(--c1)}
.stp .sn{background:var(--c2)}
.stp[data-k=f] .sn{background:var(--c5)}.stp[data-k=c] .sn{background:var(--c4)}.stp[data-k=v] .sn{background:var(--c3)}.stp[data-k=r] .sn{background:var(--c1)}
.pips i.on{background:var(--c4)}
/* --- notas --- */
.note,.tip,.warn,.okb{border:1px solid var(--b4);box-shadow:var(--shadow-sm)}
.note{background:var(--p4);border-color:var(--b4);box-shadow:var(--shadow-sm)}
.tip{background:var(--p2);border-color:var(--b2)}
.okb{background:var(--p3);border-color:var(--b3)}
.warn{background:var(--p1);border-color:var(--b1)}
.dlg-h{background:var(--p2)}
/* --- animaciones estándar (como en las páginas del aula) --- */
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes stpIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.stp.on{animation:stpIn .45s ease both}
.ans.on{animation:stpIn .5s ease both}
.ex.no{animation:shake .35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =====================================================================
   ESTADÍSTICA 2 · acento guinda pastel (el resto del tema es el mismo de los cuadernillos)
   ===================================================================== */
:root{--g:#8B2F4F;--g-ink:#6A2140;--g-p:#F3DDE4;--g-p2:#E7B8C6;--g-m:#C98AA0;--g-50:#FBF2F5}
.brand .logo{background:var(--g-p2)}
.utitle{color:#F0C9D6}.utitle .n{background:var(--g-p2);color:var(--g-ink)}
.plink.on{background:var(--g-p);color:var(--g-ink)}
.plink.done .ck{color:#F0C9D6}.plink.on.done .ck{color:var(--g)}
.prog i{background:repeating-linear-gradient(45deg,var(--g-m),var(--g-m) 8px,var(--g-p2) 8px,var(--g-p2) 16px)}
.kick{background:var(--g-p);color:var(--g-ink);border:1px solid var(--g-p2)}
.hero::after{background:radial-gradient(circle at 30% 30%,#F8E6EC,#E7B8C6 55%,#C98AA0 63%,transparent 65%);opacity:.95}
.stage{background-image:linear-gradient(90deg,transparent calc(var(--mx) - 2px),rgba(139,47,79,.55) calc(var(--mx) - 2px),rgba(139,47,79,.55) var(--mx),transparent var(--mx),transparent calc(var(--mx) + 4px),rgba(139,47,79,.55) calc(var(--mx) + 4px),rgba(139,47,79,.55) calc(var(--mx) + 5px),transparent calc(var(--mx) + 5px)),
    repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
.stage h2{text-decoration-color:rgba(201,138,160,.9)}
.pn h3 .ico{background:var(--g-p);border:1px solid var(--g-p2)}
.stage .pn.rv:not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{background:rgba(201,138,160,.6)}
.stage .pn.rv:nth-child(even):not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{background:rgba(46,92,184,.28)}
.stage .pn.rv:nth-child(3n):not(.flat):not(.dark):not(.unitcard):not(.flipc)::before{background:rgba(213,159,15,.45)}
.plan-sum b{background:var(--g-p2);color:var(--g-ink)}.plan-sum .tot b{background:var(--g-p);color:var(--g-ink)}
.plan-pill:hover{background:var(--g-50)}
.th{color:var(--g-ink)}
.gbadge{display:inline-flex;align-items:center;gap:6px;background:var(--g-p);color:var(--g-ink);border:1px solid var(--g-p2);border-radius:99px;padding:1px 10px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi.gd{background:var(--g-50);border-color:var(--g-p2)}
.pn.gd{background:var(--g-50);border-color:var(--g-p2)}
.tb th.hl{background:var(--g)}
.cirow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.cirow>.f{min-width:130px;flex:1}
.ztab{font-size:.78rem}.ztab td,.ztab th{padding:4px 6px;text-align:center;font-family:var(--f-mono)}.ztab td:first-child,.ztab th:first-child{background:var(--g-p);position:sticky;inset-inline-start:0}
.kpi small{text-transform:none;letter-spacing:0;font-size:.8rem}

/* fichas de ensayos (binomial) */
.tokbox{background:var(--p2);border:1px solid var(--b2);border-radius:12px;padding:10px 12px;margin-block:8px}
.tokrow{display:flex;gap:6px;flex-wrap:wrap;margin-block:6px}
.tk{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 .78rem var(--f-mono,monospace);border:2px solid var(--c2);animation:tkIn .35s calc(var(--i,0)*45ms) both}
.tk.ok{background:var(--c3);border-color:var(--c3);color:#fff}
.tk.no{background:#fff;color:var(--c2)}
.tk.mini{width:20px;height:20px;font-size:.62rem;animation:none;vertical-align:middle}
@keyframes tkIn{from{transform:scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}
.tk.sm{width:22px;height:22px;font-size:.62rem}

/* fracción ⇄ decimal */
.nf-d{display:none}
body.dec [data-nf] .nf-f{display:none}
body.dec [data-nf] .nf-d{display:inline}
.nfbtn{display:inline-flex;gap:0;padding:0!important;overflow:hidden;border-radius:999px}
.nfbtn[hidden]{display:none}

.nfbtn .nf-a{background:var(--c5);color:#fff}.nfbtn .nf-b{background:#fff;color:#64748b}
body.dec .nfbtn .nf-a{background:#fff;color:#64748b}body.dec .nfbtn .nf-b{background:var(--c5);color:#fff}

/* figuras SVG y espacios agrupados */
.figbox{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 12px;margin-block:10px;box-shadow:var(--sh-1)}
.figrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fig{flex:none;animation:figIn .45s calc(var(--i,0)*70ms) cubic-bezier(.3,1.4,.5,1) both;filter:drop-shadow(0 2px 2px rgba(15,23,42,.18))}
@keyframes figIn{from{transform:translateY(-8px) rotate(-12deg) scale(.6);opacity:0}}
.fig.spin .arrow{transform-origin:50px 50px;animation:spinA 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes spinA{from{transform:rotate(-540deg)}}
.gsp{display:grid;grid-template-columns:34px repeat(var(--n),minmax(26px,1fr));gap:3px;max-width:560px}
.gsp .gh{display:grid;place-items:center;font-weight:800;font-size:.74rem;background:#1e293b;color:#fff;border-radius:6px;min-height:26px}
.gsp .gh.cn{background:transparent}
.gsp .gc{display:grid;place-items:center;min-height:26px;border-radius:6px;font:700 .74rem var(--f-mono,monospace);color:#0f172a;border:1px solid rgba(15,23,42,.12);animation:tkIn .3s calc(var(--i,0)*8ms) both}
.gsp .gc.sk{background:repeating-linear-gradient(45deg,#f1f5f9 0 4px,#e2e8f0 4px 8px);border-color:transparent;animation:none}
.gsp .gc.fav{outline:2.5px solid var(--c1);outline-offset:-2px;color:var(--c1)}
.gks{display:flex;flex-wrap:wrap;gap:6px}
.gk{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;border:1px solid rgba(15,23,42,.15);font-size:.78rem}
.gk i{font-style:normal;background:#fff;border-radius:999px;padding:1px 7px;font-weight:800;color:var(--c2)}
.glr{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:8px;align-items:center;background:var(--gc);border-radius:10px;padding:6px 10px;margin-block:5px;border:1px solid rgba(15,23,42,.1);animation:stpIn .35s calc(var(--i,0)*70ms) both}
.glr.fav{outline:2.5px solid var(--c1)}
.gll{font-size:.8rem}.glc{display:flex;flex-wrap:wrap;gap:4px}.glc span{background:#fff;border-radius:6px;padding:1px 6px;font:600 .74rem var(--f-mono,monospace)}
.gln{font-style:normal;font-weight:800;background:#fff;border-radius:999px;padding:2px 9px;color:var(--c2)}
@media (max-width:520px){.glr{grid-template-columns:1fr auto}.glc{grid-column:1/-1;order:3}.gsp{grid-template-columns:26px repeat(var(--n),minmax(20px,1fr));gap:2px}.gsp .gc,.gsp .gh{font-size:.62rem;min-height:22px}}
@media (prefers-reduced-motion:reduce){.fig,.gsp .gc,.glr,.fig.spin .arrow{animation:none}}
.glx{font-style:normal;font-size:.82rem}

/* ola de color en tablas */
.tb.wv tbody td{animation:cellWave .8s both;animation-delay:calc(var(--ci,0)*140ms + var(--ri,0)*35ms)}
.tb.wv thead th{animation:headWave .6s both;animation-delay:calc(var(--ci,0)*140ms)}
@keyframes cellWave{0%{background:color-mix(in srgb,var(--mc) 28%,#fff);transform:scale(1.05)}100%{transform:none}}

/* formulario en cards */
.fm-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;position:sticky;top:-18px;z-index:3;background:#fff;padding:8px 0 10px;border-bottom:1px solid #e2e8f0;margin-bottom:12px}

.fm-dl{display:flex;flex-wrap:wrap;gap:6px}
.fsec{margin-block:14px 22px}
.fsec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--fp);border-left:6px solid var(--fc);color:#0f172a}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fcard{background:#fff;border:1px solid #e2e8f0;border-top:4px solid var(--fc);border-radius:14px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.07);animation:stpIn .4s calc(var(--i,0)*40ms) both;transition:transform .2s,box-shadow .2s;min-width:0}

<body>

<p>Una <b>variable aleatoria</b> (VA) es una <b>función</b> $X$ que asigna un número real a cada resultado del espacio muestral $S$ de un experimento aleatorio. Así los resultados (águila, sol, cara 4…) se convierten en números con los que sí se puede calcular.</p>
<ul><li><b>Dominio:</b> el espacio muestral $S$.</li><li><b>Recorrido (rango):</b> los valores reales que puede tomar $X$.</li></ul>
<h4>Discreta o continua</h4>
<ul><li><b>Discreta (VAD):</b> sus valores se pueden <i>contar</i> (0, 1, 2, …). Pueden ser finitos o una lista infinita que aún se puede enumerar. Ej.: número de águilas, de defectuosos, de llamadas.</li>
<li><b>Continua (VAC):</b> puede tomar <i>cualquier valor de un intervalo</i>. Ej.: estatura, tiempo, peso, temperatura.</li></ul>
<div class="note">Contar → discreta. Medir → continua.</div>
<p>En un mismo espacio muestral se pueden definir distintas variables aleatorias (suma, producto, máximo…).</p>`);
T('fdp', 'Función de distribución de probabilidad (FDP)', String.raw`
<p>Para una VA discreta, la <b>función de probabilidad</b> (o distribución de probabilidad) es</p>
<div class="eqbox">$$f(x)=P(X=x)$$</div>
<p>Se puede dar con una <b>tabla</b>, una <b>fórmula</b> o una <b>gráfica</b> de barras. Para que sea una FDP debe cumplir (axiomas de Kolmogorov):</p>
<ol><li>$0\le f(x)\le 1$ para todo $x$.</li><li>$\displaystyle\sum_x f(x)=1$.</li></ol>
<div class="tip">Si la suma no da 1, no es una FDP. Esa es la prueba más rápida.</div>
<h4>Cómo se construye</h4>
<ol><li>Espacio muestral (árbol de resultados).</li><li>Valor de $X$ de cada resultado.</li><li>Probabilidad de cada resultado (producto de las ramas).</li><li>Agrupar los resultados con el mismo valor de $X$ y sumar sus probabilidades.</li></ol>`);
T('acum', 'Función de distribución acumulada F(x)', String.raw`
<div class="eqbox">$$F(x)=P(X\le x)=\sum_{t\le x} f(t)$$</div>
<ul><li>Es una <b>función escalón</b>: sube en cada valor posible de $X$ y vale 1 al final.</li><li>No decrece: $0\le F(x)\le1$.</li><li>$P(a< X\le b)=F(b)-F(a)$.</li><li>$P(X=x)=F(x)-F(x^-)$ = el tamaño del salto en $x$.</li><li>$P(X>x)=1-F(x)$.</li></ul>
<div class="warn">Ojo: $P(X=3)$ <b>no</b> es $F(3)$, sino el salto de $F$ en 3.</div>`);
T('esperanza', 'Esperanza matemática (valor esperado)', String.raw`
<div class="eqbox">$$\mu=E(X)=\sum_i x_i\,P(X=x_i)$$</div>
<p>Es el <b>promedio a largo plazo</b> de $X$ si el experimento se repitiera muchas veces: cada valor se pondera con su probabilidad. No tiene que ser un valor posible de $X$.</p>
<p>Para una ganancia $g(X)$: $E[g(X)]=\sum g(x)\,f(x)$.</p>
<h4>Decisiones con el valor esperado</h4>
<ul><li>$E>0$ → conviene participar.</li><li>$E<0$ → no conviene.</li><li>$E=0$ → <b>juego justo</b>.</li></ul>
<div class="tip">Con frecuencias: $\mu=\dfrac{\sum x_if_i}{N}$. Si cada frecuencia se convierte a probabilidad ($f_i/N$), el $÷N$ ya está dentro de $P(x)$.</div>`);
T('varianza', 'Varianza y desviación estándar de una VA', String.raw`
<div class="eqbox">$$\sigma^2=\sum (x_i-\mu)^2P(x_i)=\sum x_i^2P(x_i)-\mu^2\qquad \sigma=\sqrt{\sigma^2}$$</div>
<p>$E(X^2)=\sum x_i^2P(x_i)$. La forma corta es $\sigma^2=E(X^2)-\mu^2$. $\sigma$ está en las mismas unidades que $X$ y mide cuánto suelen alejarse los valores de $\mu$.</p>
<div class="note">Estadística descriptiva divide entre $n$ ó $n-1$; aquí no hay $÷N$: ya está incluido en cada probabilidad.</div>
<h4>Entonces, ¿cuándo aparece $N$?</h4>
<div class="grid2"><div class="eqbox">$$\text{Con frecuencias: }\ \mu=\frac{\sum x_if_i}{N}\qquad \sigma^2=\frac{\sum f_i(x_i-\mu)^2}{N}$$</div><div class="eqbox">$$\text{Con probabilidades: }\ \mu=\sum x_iP(x_i)\qquad \sigma^2=\sum (x_i-\mu)^2P(x_i)$$</div></div>
<p>Si conviertes cada frecuencia en probabilidad, $P(x_i)=\dfrac{f_i}{N}$, el $÷N$ ya queda «dentro» de cada probabilidad. Símbolos: $\mu$ (mu) = media poblacional o esperanza; $\sigma$ (sigma minúscula) = desviación estándar; $\Sigma$ (sigma mayúscula) = suma.</p>
<p class="sub">Ejemplo del cuadernillo (monedas): $x=-16,2,4,6$ con $P=\tfrac18,\tfrac38,\tfrac38,\tfrac18$ → $\mu=\tfrac88=1$, $\sigma^2=\tfrac{352}{8}-1=43$, $\sigma=\sqrt{43}\approx6.56$.</p>`, true);
T('combinaciones', 'Combinaciones', String.raw`
<div class="eqbox">$$_nC_x=\binom{n}{x}=\frac{n!}{x!\,(n-x)!}$$</div>
<p>Número de formas de elegir $x$ elementos de $n$ cuando el <b>orden no importa</b>. Ej.: $\binom{15}{14}=15$ y $\binom{12}{10}=\dfrac{12\cdot11}{2}=66$. Propiedad útil: $\binom{n}{x}=\binom{n}{n-x}$.</p>`);
T('algebra', 'Repaso de álgebra para la binomial', String.raw`
<p>Antes de la binomial conviene repasar algunas propiedades (del cuadernillo, «Clase de Álgebra»).</p>
<div class="grid2"><div class="eqbox">$$\textbf{Distributiva: } a(b+c)=ab+ac$$</div><div class="eqbox">$$\textbf{Factorizar: } ab+ac=a(b+c)$$</div>
<div class="eqbox">$$\textbf{Conmutativa (suma): } 2+7=7+2$$</div><div class="eqbox">$$\textbf{Conmutativa (producto): } 9\cdot4=4\cdot9$$</div></div>
<p class="sub">«El orden de los sumandos no altera la <b>suma</b>»; «el orden de los factores no altera el <b>producto</b>».</p>
<h4>Desarrollo de un binomio al cuadrado</h4>
<div class="eqbox">$$(a+b)^2=(a+b)(a+b)=a^2+2ab+b^2\qquad (a-b)^2=a^2-2ab+b^2$$</div>
<ol><li>$(a+5)^2=a^2+5a+5a+25=a^2+10a+25$</li><li>$(3-b)^2=9-6b+b^2$</li><li>$(-x+7)^2=x^2-14x+49$</li><li>$(-y-6)^2=y^2+12y+36$</li><li>$(6+9)^2=36+108+81=225$ ✓ (con calculadora $15^2=225$)</li></ol>
<div class="warn">Corrección al cuadernillo: en los ejemplos 2 y 3 el último término es <b>positivo</b> ($+b^2$ y $+49$) y en el 3 también $x^2$ es positivo, porque todo número al cuadrado es positivo: $(-b)^2=b^2$, $(-x)^2=x^2$.</div>
<h4>¿Para qué sirve en la binomial?</h4>
<p>Con $p+q=1$: $(p+q)^n=\sum_{x=0}^{n}\binom{n}{x}p^xq^{n-x}=1$. Cada término del desarrollo es una probabilidad binomial; por eso la tabla suma 1.</p>
<p><b>Para $n=1$</b> (un solo ensayo): $X\in\{0,1\}$ con $P(0)=q$, $P(1)=p$. Entonces $\mu=0\cdot q+1\cdot p=p$ y $\sigma^2=\sum x^2P(x)-\mu^2=p-p^2=p(1-p)=pq$, $\sigma=\sqrt{pq}$. Para $n$ ensayos independientes se suman: $\mu=np$, $\sigma^2=npq$.</p>`, true);
T('binomial', 'Distribución binomial', String.raw`
<p><b>Experimento de Bernoulli:</b> un ensayo con solo dos resultados, <i>éxito</i> (prob. $p$) y <i>fracaso</i> (prob. $q=1-p$).</p>
<p><b>Experimento binomial</b> si cumple:</p>
<ol><li>Hay $n$ ensayos (n fijo).</li><li>Cada ensayo es éxito o fracaso.</li><li>$p$ es la misma en todos los ensayos.</li><li>Los ensayos son <b>independientes</b>.</li></ol>
<p>$X$ = número de éxitos en los $n$ ensayos.</p>
<div class="eqbox">$$b(x;n,p)=\binom{n}{x}p^{x}q^{\,n-x},\quad x=0,1,\dots,n$$
$$\mu=np\qquad \sigma^2=npq\qquad \sigma=\sqrt{npq}$$</div>
<p>$\binom{n}{x}$ cuenta las formas de acomodar los $x$ éxitos; $p^xq^{n-x}$ es la probabilidad de <i>una</i> de esas formas (regla del producto).</p>
<div class="warn">Si se extrae <b>sin reemplazo</b> de una población pequeña, $p$ cambia y no es binomial (es hipergeométrica). Con poblaciones muy grandes sí se usa la binomial como aproximación.</div>`);
T('poisson', 'Distribución de Poisson (complemento)', String.raw`
<p>Cuenta el número de ocurrencias de un evento en un <b>intervalo</b> de tiempo o espacio (llamadas por hora, accidentes por mes, ratas por manzana), cuando los eventos ocurren de forma independiente y a una tasa media constante.</p>
<div class="eqbox">$$P(X=x)=\frac{e^{-\lambda}\lambda^{x}}{x!},\quad x=0,1,2,\dots$$
$$\mu=\lambda\qquad\sigma^2=\lambda\qquad\sigma=\sqrt\lambda$$</div>
<ul><li>$\lambda$ es el promedio de ocurrencias <b>en el intervalo que se pregunta</b>: si son 4 por hora, en 30 min $\lambda=2$.</li><li>No hay máximo de ocurrencias (x puede ser cualquier entero ≥ 0).</li><li>Aproxima a la binomial cuando $n$ es grande y $p$ pequeña, con $\lambda=np$ (regla usual: $n\ge20$ y $p\le0.05$).</li></ul>
<div class="note">La distribución de Poisson no aparece en la carta descriptiva 2024; está porque tu problemario la incluye.</div>`);
T('densidad', 'Variable continua y función de densidad', String.raw`
<p>En una VA continua la probabilidad se calcula sobre <b>intervalos</b>, como el <b>área bajo la función de densidad</b> $f(x)$ y sobre el intervalo.</p>
<ul><li>$f(x)\ge0$ y el área total bajo la curva es 1.</li><li>$P(a\le X\le b)=$ área entre $a$ y $b$.</li><li>$P(X=x)=0$ (un punto no tiene longitud ni área); por eso $P(a<X<b)=P(a\le X\le b)$.</li></ul>
<p>Cuando todos los puntos de un intervalo $[a,b]$ son igualmente probables (uniforme): $P(c\le X\le d)=\dfrac{d-c}{b-a}$ (cociente de longitudes, como el enfoque clásico).</p>`);
T('normal', 'Distribución normal', String.raw`
<div class="eqbox">$$f(x)=\frac{1}{\sigma\sqrt{2\pi}}\,e^{-\frac{(x-\mu)^2}{2\sigma^2}}$$</div>
<ul><li>Curva en <b>forma de campana</b>, simétrica respecto de $x=\mu$ (media = mediana = moda).</li><li>La distancia de $\mu$ a los puntos donde cambia la concavidad es $\sigma$.</li><li>Área total = 1; hacia cada lado de $\mu$ el área es 0.5.</li><li>Las probabilidades mayores están en intervalos centrados en $\mu$; la cola se acerca al eje pero no lo toca.</li><li>$\mu$ la mueve de lugar; $\sigma$ la hace más alta y angosta (σ chica) o más baja y ancha (σ grande).</li></ul>
<p>Se escribe $X\sim N(\mu,\sigma)$.</p>`);
T('empirica', 'Regla empírica (68 – 95 – 99.7)', String.raw`
<p>En una distribución normal (o aproximadamente normal):</p>
<table class="tb"><thead><tr><th>Intervalo</th><th>Aprox.</th><th>Valor exacto</th></tr></thead><tbody>
<tr><td>$\mu\pm1\sigma$</td><td>68 %</td><td>68.27 %</td></tr><tr><td>$\mu\pm2\sigma$</td><td>95 %</td><td>95.45 %</td></tr><tr><td>$\mu\pm3\sigma$</td><td>99.7 %</td><td>99.73 %</td></tr></tbody></table>
<p>Sirve para estimaciones rápidas (estatura, tallas, tiempos, errores de medición) sin usar tablas.</p>`);
T('estandar', 'Normal estándar y estandarización', String.raw`
<p>La <b>normal estándar</b> es $Z\sim N(0,1)$. Cualquier normal se convierte a ella con</p>
<div class="eqbox">$$Z=\frac{X-\mu}{\sigma}$$</div>
<p>$z$ dice <b>cuántas desviaciones estándar</b> se aleja $x$ de la media. Se cumple $P(a\le X<b)=P\!\left(\dfrac{a-\mu}{\sigma}\le Z<\dfrac{b-\mu}{\sigma}\right)$.</p>
<ul><li>$P(Z\le z)=\Phi(z)$ se lee en la tabla z (menú lateral) o con una calculadora/celular.</li><li>$\Phi(-z)=1-\Phi(z)$ (simetría).</li><li>$P(a\le Z\le b)=\Phi(b)-\Phi(a)$.</li></ul>`);
T('poblacion', 'Población, muestra, parámetro y estadístico', String.raw`
<ul><li><b>Población:</b> todos los elementos de interés. Sus características numéricas son <b>parámetros</b> (fijos, casi siempre desconocidos): $\mu$, $\sigma$, $p$.</li>
<li><b>Muestra:</b> subconjunto que sí se observa. Sus características son <b>estadísticos</b> (cambian de muestra en muestra): $\bar x$, $s$, $\hat p$.</li>
<li><b>Muestreo aleatorio simple (MAS):</b> cada elemento de la población tiene la misma probabilidad de entrar y los elementos se eligen de forma independiente.</li></ul>
<table class="tb"><thead><tr><th></th><th>Población</th><th>Muestra</th></tr></thead><tbody><tr><td>Media</td><td>$\mu$</td><td>$\bar x$</td></tr><tr><td>Desv. estándar</td><td>$\sigma$</td><td>$s$</td></tr><tr><td>Proporción</td><td>$p$</td><td>$\hat p=x/n$</td></tr></tbody></table>
<div class="tip">Como cada muestra da un $\bar x$ distinto, <b>un estimador es una variable aleatoria</b>: tiene su propia distribución (distribución muestral).</div>`);
T('errorstd', 'Error estándar', String.raw`
<p>Es la desviación estándar de un estimador. Mide cuánto varían los valores del estimador de una muestra a otra.</p>
<div class="eqbox">$$\sigma_{\bar X}=\frac{\sigma}{\sqrt n}\qquad\qquad \sigma_{\hat p}=\sqrt{\frac{pq}{n}}$$</div>
<p>Al aumentar $n$ el error estándar disminuye (para reducirlo a la mitad hace falta cuadruplicar $n$).</p>`);
T('tlc', 'Teorema del Límite Central', String.raw`
<p>Si de una población con media $\mu$ y desviación estándar $\sigma$ (finita) se toman muestras aleatorias de tamaño $n$ <b>suficientemente grande</b>, la distribución de la media muestral es aproximadamente normal, <b>sin importar la forma de la población</b>:</p>
<div class="eqbox">$$\bar X\approx N\!\left(\mu,\ \frac{\sigma}{\sqrt n}\right)\qquad \mu_{\bar X}=\mu,\ \ \sigma_{\bar X}=\frac{\sigma}{\sqrt n}$$</div>
<ul><li>Regla práctica: $n\ge30$. Si la población es muy sesgada puede necesitarse más; si es simétrica, menos; si es normal, $\bar X$ es normal para cualquier $n$.</li>
<li><b>Proporción:</b> $\hat p\approx N\!\left(p,\sqrt{\dfrac{pq}{n}}\right)$ cuando $np\ge10$ y $nq\ge10$ (algunos textos usan 5).</li></ul>
<p>Las fórmulas de $\sigma/\sqrt n$ suponen muestreo con reemplazo o población muy grande respecto de la muestra.</p>`);
T('estimacion', 'Tipos de inferencia: estimar y contrastar', String.raw`
<ul><li><b>Estimación:</b> se desconoce un parámetro y se quiere un valor aproximado. <i>Puntual</i>: un número ($\bar x$, $\hat p$). <i>Por intervalo</i>: un rango de valores plausibles con un nivel de confianza.</li>
<li><b>Contraste de hipótesis:</b> alguien afirma algo sobre el parámetro y se verifica si la muestra lo contradice.</li></ul>
<div class="note">Estimar = «¿cuánto vale?». Contrastar = «¿será cierto que vale…?».</div>`);
T('ic', 'Intervalo de confianza', String.raw`
<div class="eqbox">$$\bar x\pm z_{\alpha/2}\frac{\sigma}{\sqrt n}\qquad\qquad \hat p\pm z_{\alpha/2}\sqrt{\frac{\hat p\,\hat q}{n}}$$</div>
<p>Estimador ± <b>margen de error</b> $E=z_{\alpha/2}\cdot$(error estándar). Si no se conoce $\sigma$ y $n\ge30$ se usa $s$.</p>
<table class="tb"><thead><tr><th>Confianza</th><th>$z_{\alpha/2}$</th></tr></thead><tbody><tr><td>90 %</td><td>1.645</td></tr><tr><td>95 %</td><td>1.960</td></tr><tr><td>99 %</td><td>2.576</td></tr></tbody></table>
<h4>¿Qué significa «95 % de confianza»?</h4>
<p>Que el <b>procedimiento</b> produce intervalos que contienen al parámetro en el 95 % de las muestras. Un intervalo ya calculado o contiene al parámetro o no; no se dice «hay 95 % de probabilidad de que $\mu$ esté aquí».</p>
<ul><li>Más confianza → intervalo <b>más largo</b>.</li><li>Mayor $n$ → intervalo <b>más corto</b>.</li></ul>
<p>Tamaño de muestra para un margen $E$: $n=\left(\dfrac{z\sigma}{E}\right)^2$ (media) y $n=\dfrac{z^2\,pq}{E^2}$ (proporción; sin dato previo se usa $p=0.5$). Se redondea hacia arriba.</p>`);
T('hipotesis', 'Contraste de hipótesis', String.raw`
<ol><li><b>Hipótesis:</b> $H_0$ (nula, con «=») y $H_1$ (alternativa): bilateral $\ne$, cola derecha $>$ o cola izquierda $<$.</li>
<li><b>Nivel de significancia</b> $\alpha$ (p. ej. 0.05): probabilidad máxima de rechazar $H_0$ siendo verdadera (error tipo I).</li>
<li><b>Estadístico de prueba</b> (bajo $H_0$): $z=\dfrac{\hat p-p_0}{\sqrt{p_0q_0/n}}$ ó $z=\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}$.</li>
<li><b>Regla:</b> región de rechazo (valor crítico) <i>o</i> valor $p$.</li>
<li><b>Conclusión</b> en el contexto del problema.</li></ol>
<table class="tb"><thead><tr><th></th><th>$H_0$ verdadera</th><th>$H_0$ falsa</th></tr></thead><tbody><tr><td>Rechazo $H_0$</td><td>Error tipo I (prob. $\alpha$)</td><td>Decisión correcta</td></tr><tr><td>No rechazo $H_0$</td><td>Decisión correcta</td><td>Error tipo II (prob. $\beta$)</td></tr></tbody></table>
<div class="warn">«No rechazar $H_0$» no prueba que $H_0$ sea cierta: solo que la muestra no da evidencia suficiente en su contra. Por eso es más preciso decir «no se rechaza» que «se acepta».</div>`);
T('pvalor', 'Valor p', String.raw`
<p>Es la probabilidad, <b>suponiendo que $H_0$ es verdadera</b>, de obtener un estadístico tan extremo o más que el observado.</p>
<ul><li>Cola derecha: $p=P(Z\ge z)$ · cola izquierda: $p=P(Z\le z)$ · bilateral: $p=2\,P(Z\ge|z|)$.</li><li>Si $p\le\alpha$ → <b>se rechaza</b> $H_0$. Si $p>\alpha$ → no se rechaza.</li></ul>
<p>Es la vía que usan los paquetes computacionales; el valor crítico (región de rechazo) da la misma decisión.</p>`);

/* tabla del espacio muestral de un experimento por etapas: stages [[etiqueta,prob],...] por etapa */
function spaceHtml(stages, xfun, o = {}) {
  const out = enumSeq(stages).map(([lab, pr]) => [lab, pr, xfun(lab)]);
  return `<p>${o.intro || 'Se enumeran los resultados posibles, su probabilidad (producto, porque las etapas son independientes) y el valor de $X$.'}</p>` + tbl(['Resultado', 'Probabilidad', '$x$'], out.map(([l, p, x]) => tr([l.split('').join(' '), `$${o.frac ? pf(p) : fpr(p)}$`, `<b>${fc(x, 2)}</b>`])));
}
const cnt = ch => lab => lab.split('').filter(c => c === ch).length;

'use strict';
/* =====================================================================
   BANCO · Esperanza matemática (problemas 15 a 32 del cuadernillo)
   ===================================================================== */
const $$m = x => `§${fc(x, 2)}`;     // dinero (el § se convierte en $ al mostrar)
function espPart(l, q, rowsFn, o = {}) {
  return {
    l, q, sol() {
      const rows = rowsFn(), r = espTable(rows, { frac: o.frac, lab: o.lab }), steps = [];
      if (o.pre) steps.push(['Plantea', o.pre]);
      steps.push(['Tabla de $g(x)$, $P(x)$ y $g(x)\\cdot P(x)$', r.html]);
      steps.push(['Valor esperado', `<div class="eqbox">$E=\\sum g(x)\\,P(x)=${TN(r.E, 4)}$</div>`]);
      if (o.after) steps.push(...o.after(r.E));
      return { steps, ans: o.ans ? o.ans(r.E) : `$E=${TN(r.E, 2)}$ → ${veredicto(r.E)}`, viz: '' };
    }
  };
}

/* ---------- Tabla z (área a la izquierda, Φ(z)) calculada con el modelo exacto ---------- */
function zTableHTML() {
  const cols = Array.from({ length: 10 }, (_, j) => j / 100);
  const head = ['z', ...cols.map(c => c.toFixed(2).slice(1) || '.00')];
  const rows = Array.from({ length: 35 }, (_, i) => { const z0 = i / 10; return tr([`<b>${z0.toFixed(1)}</b>`, ...cols.map(c => { const v = Phi(z0 + c); return `<span title="Φ(${(z0 + c).toFixed(2)})">${v.toFixed(4)}</span>`; })]); });
  return `<p class="sub">Área bajo la curva normal estándar <b>a la izquierda</b> de $z$: $\\Phi(z)=P(Z\\le z)$. Para $z$ negativo usa la simetría: $\\Phi(-z)=1-\\Phi(z)$. Se lee el renglón (z con un decimal) y la columna (segundo decimal). Valores calculados con el modelo normal exacto.</p>
    <div class="tw"><table class="tb ztab"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <div class="tip">Ejemplo: $P(Z\\le 1.96)$ → renglón 1.9, columna .06 → <b>0.9750</b>. Por eso $z_{0.975}=1.96$ deja 95 % al centro.</div>`;
}
