<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller de Cómputo · Guía interactiva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {

    }
    html { scroll-behavior:smooth; }
    body { background:#f1f5f9; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; min-height:100vh; display:flex; flex-direction:column; color:var(--ink); }
    main { flex:1; }
    .mono { font-family:'Courier New',Courier,monospace; font-weight:700; }
    section.lesson, section.unit, section#glosario, section#examen { scroll-margin-top:118px; }

    /* ---- header compartido ---- */

    table.tb { width:100%; font-size:.9rem; border-collapse:separate; border-spacing:0; border-radius:12px; overflow:hidden; box-shadow:var(--shadow-sm); }

    /* ---- widgets ---- */

    .wgt-head i { color:var(--c); } .wgt-head .tag { margin-left:auto; font-size:.7rem; background:var(--c); color:#fff; border-radius:99px; padding:.1rem .6rem; }

    .btn-chip { border:2px solid var(--cc,var(--c)); color:var(--cc,var(--c)); background:#fff; font-weight:800; font-size:.84rem; padding:.25rem .8rem; border-radius:999px; transition:all .2s; cursor:pointer; }
    .btn-chip:hover { background:color-mix(in srgb,var(--cc,var(--c)) 12%,#fff); }
    .btn-chip.on { background:var(--cc,var(--c)); color:#fff; box-shadow:0 4px 12px color-mix(in srgb,var(--cc,var(--c)) 40%,transparent); }
    .inlab { font-size:.76rem; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:.03em; }
    .tin { font-family:'Courier New',monospace; font-weight:800; border:2px solid #cbd5e1; border-radius:10px; padding:.3rem .6rem; background:#f8fafc; width:100%; }

    .readout { background:#0f172a; color:#e2e8f0; border-radius:14px; padding:.7rem .95rem; font-family:'Courier New',monospace; font-size:.95rem; line-height:1.6; }
    .readout b { color:#ffd43b; }
    .infobox { background:#fffbe6; border:1px solid #ffe58f; border-radius:12px; padding:.6rem .85rem; font-size:.92rem; min-height:3rem; }
    .svgnode { cursor:pointer; } .svgnode:hover rect, .svgnode:hover circle { filter:brightness(1.08); }
    .bitbtn { width:46px; height:58px; border-radius:10px; border:2px solid #1864ab; background:#fff; font-family:'Courier New',monospace; font-weight:900; font-size:1.5rem; color:#1864ab; cursor:pointer; transition:all .15s; }
    .bitbtn.on { background:#1864ab; color:#fff; transform:translateY(-2px); box-shadow:0 5px 12px rgba(24,100,171,.4); }
    .seg { display:inline-flex; border-radius:999px; background:#e9eef5; padding:3px; gap:2px; flex-wrap:wrap; }
    .seg button { border:0; background:transparent; font-weight:800; font-size:.84rem; padding:.28rem .85rem; border-radius:999px; color:#475569; }
    .seg button.on { background:var(--c); color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.18); }

    .quiz { background:linear-gradient(180deg,#f8fafc,#f1f5f9); border:2px dashed color-mix(in srgb,var(--c) 45%,#fff); border-radius:18px; padding:1rem 1.1rem; margin-top:1.6rem; }
    .quiz-head { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.6rem; }

    .score-pill { margin-left:auto; background:var(--c); color:#fff; font-weight:800; border-radius:99px; padding:.12rem .8rem; font-size:.86rem; }
    .qbox { background:#fff; border-radius:14px; padding:.8rem .95rem; margin-bottom:.7rem; box-shadow:var(--shadow-sm); border:1px solid #e9eef5; }
    .qbox .qt { font-weight:700; margin-bottom:.5rem; } .qbox .qt .qn { display:inline-flex; width:1.7rem; height:1.7rem; border-radius:50%; background:var(--c); color:#fff; font-size:.82rem; align-items:center; justify-content:center; margin-right:.45rem; }
    .opt { display:flex; align-items:flex-start; gap:.55rem; width:100%; text-align:left; background:#f8fafc; border:2px solid #dbe3ee; border-radius:12px; padding:.45rem .75rem; margin-bottom:.4rem; font-size:.93rem; cursor:pointer; transition:all .15s; color:var(--ink); }
    .opt:hover:not(:disabled) { border-color:var(--c); background:color-mix(in srgb,var(--c) 7%,#fff); }
    .opt .ltr { flex:0 0 1.55rem; height:1.55rem; border-radius:50%; background:#dbe3ee; color:#334155; font-weight:800; font-size:.8rem; display:flex; align-items:center; justify-content:center; }
    .opt.ok { background:#e6f6ea; border-color:#2f9e44; } .opt.ok .ltr { background:#2f9e44; color:#fff; }

    .res-row.ok { color:#2f9e44; font-weight:800; } .res-row.bad { color:#e03131; font-weight:800; }
    .ordpick { display:flex; flex-wrap:wrap; gap:.4rem; margin:.3rem 0; } .ordseq { display:flex; flex-direction:column; gap:.3rem; margin:.5rem 0; counter-reset:o; }
    .ordseq .it { counter-increment:o; background:#e7f1fb; border-radius:10px; padding:.3rem .7rem .3rem 2.4rem; position:relative; font-size:.9rem; }
    .ordseq .it::before { content:counter(o); position:absolute; left:.6rem; top:50%; transform:translateY(-50%); width:1.5rem; height:1.5rem; background:var(--c); color:#fff; border-radius:50%; font-weight:800; font-size:.78rem; display:flex; align-items:center; justify-content:center; }
    .ordseq .it.ok { background:#e6f6ea; } .ordseq .it.bad { background:#fdeaea; }

    .mtrow select.ok { border-color:#2f9e44; background:#e6f6ea; } .mtrow select.bad { border-color:#e03131; background:#fdeaea; }

    /* ---- glosario / examen ---- */
    .gl-card { background:#fff; border-radius:14px; border:1px solid #e2e8f0; border-left:6px solid var(--c); padding:.7rem .9rem; box-shadow:var(--shadow-sm); height:100%; }
    .gl-card b { font-size:1rem; } .gl-card a { font-size:.76rem; font-weight:700; text-decoration:none; color:var(--c); }
    mark.hl { background:#ffe066; padding:0 .1rem; border-radius:3px; }

    .exam-prog { height:10px; border-radius:99px; background:#e2e8f0; overflow:hidden; } .exam-prog > div { height:100%; background:linear-gradient(90deg,#4dabf7,#7048e8); width:0; transition:width .3s; }
    /* ---- hoja de cálculo simulada ---- */

    table.sheet { border-collapse:collapse; font-size:.86rem; width:max-content; min-width:100%; user-select:none; }

    table.sheet th.rh { position:sticky; left:0; z-index:2; width:34px; } table.sheet th.sel { background:#cfe3ff; color:#0b3d91; }
    table.sheet td { border:1px solid #dfe5ec; min-width:76px; height:27px; padding:.1rem .45rem; white-space:nowrap; cursor:cell; }
    table.sheet td.sel { outline:2px solid #1c7ed6; outline-offset:-2px; background:#eaf3ff; } table.sheet td.num { text-align:right; } table.sheet td.err { color:#c92a2a; font-weight:700; text-align:center; }
    table.sheet td.hd { font-weight:800; background:#f4f8fc; } table.sheet td.cf-bad { background:#ffc9c9; color:#9c1c1c; } table.sheet td.cf-ok { background:#c3fae8; color:#087f5b; }
    .fbar { display:flex; align-items:center; gap:.4rem; margin-bottom:.4rem; } .fbar .nb { width:64px; text-align:center; font-weight:800; background:#fff; border:1px solid #b6c2d0; border-radius:6px; padding:.2rem; font-size:.9rem; }

    .ribbon-body { background:#f3f6f9; border:1px solid #d8e0e8; border-top:0; padding:.6rem .8rem; border-radius:0 0 10px 10px; font-size:.88rem; }
    .ribbon-body .grp { display:inline-block; background:#fff; border:1px solid #d8e0e8; border-radius:8px; padding:.3rem .6rem; margin:.15rem .3rem .15rem 0; font-size:.82rem; }
    .grade-in { width:62px; text-align:center; font-weight:800; border:2px solid #cbd5e1; border-radius:8px; padding:.2rem; }
    .fab { position:fixed; right:14px; bottom:14px; z-index:1030; display:flex; flex-direction:column; gap:.5rem; }
    .fab .btn { width:46px; height:46px; border-radius:50%; box-shadow:var(--shadow-lg); display:flex; align-items:center; justify-content:center; font-size:1.15rem; }
    .idx-row { display:flex; align-items:center; gap:.5rem; padding:.45rem .6rem; border-radius:10px; text-decoration:none; color:var(--ink); font-size:.9rem; font-weight:600; }

    :focus-visible { outline:3px solid #f08c00; outline-offset:2px; }
    textarea.note { width:100%; border:2px dashed #cbd5e1; border-radius:12px; padding:.5rem .7rem; font-size:.9rem; min-height:60px; background:#fffef8; }

    @media print { .fab,.sec-nav,.app-navbar { display:none !important; } }

</head>
<body>
  <div class="read-progress" id="rp"></div>
  <div id="app-header"></div>
  <nav class="sec-nav" id="sec-nav" aria-label="Secciones">

    <div class="tools">
      <span class="here" id="here"></span>
      <button class="btn btn-sm btn-dark rounded-pill fw-bold" id="btn-idx" data-bs-toggle="offcanvas" data-bs-target="#idxCanvas"><i class="bi bi-list-nested me-1"></i><span class="d-none d-sm-inline">Índice</span></button>
      <button class="btn btn-sm btn-warning rounded-pill fw-bold" id="btn-bms" data-bs-toggle="offcanvas" data-bs-target="#idxCanvas" data-tab="bm"><i class="bi bi-bookmarks-fill me-1"></i><span class="d-none d-sm-inline">Marcadores</span> <span class="badge text-bg-dark" id="bm-count">0</span></button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill" id="btn-fs" title="Pantalla completa" aria-label="Pantalla completa"><i class="bi bi-arrows-fullscreen"></i></button>
    </div>
  </nav>
  <main>
    <header class="hero-header text-center mb-4" id="top">
      <div class="hero-bits" id="hero-bits" aria-hidden="true"></div>
      <div class="container">
        <h1 class="display-5 fw-bold"><i class="bi bi-pc-display-horizontal text-info me-2"></i>Taller de Cómputo</h1>
        <p class="lead mb-1">Guía de estudio interactiva • internet • hardware y software • hoja de cálculo • multimedia</p>
        <p class="mb-3 text-light opacity-75">Lee, prueba cada simulador y comprueba lo aprendido con quizzes que se califican solos</p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3" id="hero-stats"></div>
        <div class="hero-prog mb-1"><div id="hero-prog-bar"></div></div>
        <div class="small text-light opacity-75 mb-3" id="hero-prog-txt"></div>
        <a class="btn btn-info text-white rounded-pill fw-bold me-1 mb-1" href="#u1"><i class="bi bi-play-fill me-1"></i>Empezar</a>
        <button class="btn btn-warning rounded-pill fw-bold me-1 mb-1 d-none" id="btn-resume"><i class="bi bi-skip-forward-fill me-1"></i><span></span></button>
        <a class="btn btn-outline-light rounded-pill fw-bold mb-1" href="#examen"><i class="bi bi-patch-question-fill me-1"></i>Examen final</a>
        <div class="row g-3 mt-3 unit-map" id="unit-map"></div>
      </div>

    <div class="container mb-5" id="content"></div>
  </main>
  <footer class="text-center py-3 text-muted bg-white border-top"><small>Taller de Cómputo • Guía de estudio interactiva</small></footer>

  <div class="fab">
    <button class="btn btn-warning" id="fab-bm" title="Marcar esta sección" aria-label="Marcar esta sección"><i class="bi bi-bookmark-plus-fill"></i></button>
    <button class="btn btn-dark" id="fab-up" title="Subir" aria-label="Subir"><i class="bi bi-arrow-up"></i></button>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="idxCanvas" aria-labelledby="idxTitle" style="width:min(420px,92vw)">
    <div class="offcanvas-header bg-dark text-white"><h5 class="offcanvas-title fw-bold" id="idxTitle"><i class="bi bi-compass-fill me-2"></i>Navegación</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button></div>
    <div class="offcanvas-body">
      <ul class="nav nav-pills mb-2" id="idx-tabs"><li class="nav-item"><button class="nav-link active" data-t="idx">Índice</button></li><li class="nav-item"><button class="nav-link" data-t="bm">Marcadores</button></li></ul>
      <div id="idx-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth-config.js"></script>
  <script src="aula-header.js"></script>
<script>
/* ============ TC: núcleo (estado, renderizado, quiz, glosario, examen) ============ */
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const TC = window.TC = { SECS: [], WID: {}, $, $$, esc, shuffle };
  TC.UNITS = [
    { n: 1, t: 'Búsqueda y uso de información en Internet', short: 'Internet', icon: 'bi-globe2', hrs: 18, color: 'var(--u1)',
      purpose: 'Realizar búsquedas de información digital con métodos y herramientas, para desarrollar trabajos académicos con un enfoque crítico, autónomo y ético.' },
    { n: 2, t: 'Hardware y software', short: 'Hardware y software', icon: 'bi-motherboard', hrs: 14, color: 'var(--u2)',
      purpose: 'Comprender la evolución de las computadoras, la relación entre hardware y software, los tipos de dispositivos y programas, y los riesgos del uso de las tecnologías de la información y la comunicación (TIC).' },
    { n: 3, t: 'Solución de problemas con la hoja electrónica de cálculo', short: 'Hoja de cálculo', icon: 'bi-table', hrs: 16, color: 'var(--u3)',
      purpose: 'Utilizar fórmulas, funciones y gráficos en una hoja electrónica de cálculo para manejar datos y resolver problemas matemáticos.' },
    { n: 4, t: 'Multimedia', short: 'Multimedia', icon: 'bi-film', hrs: 16, color: 'var(--u4)',
      purpose: 'Editar imagen, audio y video con aplicaciones y asistentes de IA para integrar elementos multimedia de forma creativa en actividades académicas y cotidianas.' }
  ];
  TC.sec = o => TC.SECS.push(o);

  /* ---------- constructores de contenido y de preguntas ---------- */
  TC.K = {
    P: x => ({ t: 'p', x }), H: x => ({ t: 'h', x }), D: items => ({ t: 'defs', items }), L: (items, ord) => ({ t: 'l', items, ord }),
    T: (kind, x, title) => ({ t: 'tip', kind, x, title }), TB: (head, rows) => ({ t: 'tb', head, rows }), C: items => ({ t: 'cards', items }),
    S: items => ({ t: 'steps', items }), TL: items => ({ t: 'tl', items }), W: (id, title, icon, hint) => ({ t: 'w', id, title, icon, hint }),
    mc: (q, o, a, why) => ({ k: 'mc', q, o, a, why }), tf: (q, a, why) => ({ k: 'tf', q, a, why }),
    ord: (q, items, why) => ({ k: 'ord', q, items, why }), mt: (q, pairs, why) => ({ k: 'mt', q, pairs, why }),
    num: (q, ans, why, ph) => ({ k: 'num', q, ans: [].concat(ans), why, ph })
  };

  /* ---------- estado persistente (solo conveniencias del lector) ---------- */
  const KEY = 'tc_v1'; let ST = { bm: {}, done: {}, score: {}, notes: {}, last: null, exam: null };
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && typeof j === 'object') ST = Object.assign(ST, j); } catch (e) { }
  let saveT = 0; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { } }, 250); };
  TC.ST = ST;

  /* ---------- helpers de pregunta ---------- */
  const L4 = 'ABCDEFGH';
  const normNum = s => String(s).trim().toLowerCase().replace(/\s+/g, '').replace(/,/g, '').replace(/^=/, '');
  TC.answerText = q => q.k === 'mc' ? q.o[q.a] : q.k === 'tf' ? (q.a ? 'Verdadero' : 'Falso') : q.k === 'ord' ? q.items.join(' → ') : q.k === 'mt' ? q.pairs.map(p => p[0] + ' ⇒ ' + p[1]).join(' · ') : q.ans[0];
  function renderQ(q, i, host, cb) {
    const box = document.createElement('div'); box.className = 'qbox'; host.appendChild(box);
    const done = (ok, mine) => { box.querySelector('.why').classList.add('show'); box.dataset.res = ok ? 'ok' : 'bad'; cb && cb(ok, mine); };
    const head = `<div class="qt"><span class="qn">${i + 1}</span>${q.q}</div>`;
    const why = `<div class="why"><i class="bi bi-lightbulb-fill text-warning me-1"></i><span class="res-row"></span> ${q.why || ''}</div>`;
    const verdict = ok => { const r = box.querySelector('.res-row'); r.className = 'res-row ' + (ok ? 'ok' : 'bad'); r.innerHTML = ok ? '¡Correcto!' : 'Revisa: la respuesta correcta es «' + (q.k === 'mc' || q.k === 'tf' || q.k === 'num' ? TC.answerText(q) : '') + '».'; if (!ok && (q.k === 'ord' || q.k === 'mt')) r.innerHTML = 'Casi: compara con el orden/relación correcta.'; };
    if (q.k === 'mc' || q.k === 'tf') {
      const opts = q.k === 'tf' ? [{ t: 'Verdadero', c: q.a === true }, { t: 'Falso', c: q.a === false }] : shuffle(q.o.map((t, k) => ({ t, c: k === q.a })));
      box.innerHTML = head + opts.map((o, k) => `<button class="opt" data-k="${k}" type="button"><span class="ltr">${L4[k]}</span><span>${o.t}</span></button>`).join('') + why;
      $$('.opt', box).forEach(b => b.addEventListener('click', () => {
        const o = opts[+b.dataset.k]; $$('.opt', box).forEach((x, k) => { x.disabled = true; if (opts[k].c) x.classList.add('ok'); });
        if (!o.c) b.classList.add('bad'); verdict(o.c); done(o.c, o.t);
      }));
    } else if (q.k === 'num') {
      box.innerHTML = head + `<div class="d-flex gap-2 flex-wrap"><input class="tin" style="max-width:280px" autocomplete="off" placeholder="${esc(q.ph || 'Escribe tu respuesta')}" aria-label="Respuesta"><button class="btn btn-dark rounded-pill btn-sm fw-bold" type="button">Comprobar</button></div>` + why;
      const inp = $('input', box), btn = $('button', box);
      const go = () => { if (!inp.value.trim()) return; const ok = q.ans.some(a => normNum(a) === normNum(inp.value)); inp.disabled = btn.disabled = true; inp.style.borderColor = ok ? '#2f9e44' : '#e03131'; verdict(ok); done(ok, inp.value); };
      btn.addEventListener('click', go); inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    } else if (q.k === 'ord') {
      const items = shuffle(q.items.map((t, k) => ({ t, k }))); const seq = [];
      box.innerHTML = head + `<div class="small text-muted mb-1">Toca los pasos en el orden correcto.</div><div class="ordpick"></div><div class="ordseq"></div><button class="btn btn-sm btn-outline-secondary rounded-pill" type="button">Deshacer</button>` + why;
      const pick = $('.ordpick', box), sq = $('.ordseq', box), undo = $('button', box);
      const draw = () => {
        pick.innerHTML = items.map((o, j) => seq.includes(j) ? '' : `<button type="button" class="btn-chip" data-j="${j}">${o.t}</button>`).join('');
        sq.innerHTML = seq.map(j => `<div class="it">${items[j].t}</div>`).join('');
        $$('.btn-chip', pick).forEach(b => b.addEventListener('click', () => { seq.push(+b.dataset.j); draw(); if (seq.length === items.length) fin(); }));
      };
      const fin = () => { const ok = seq.every((j, p) => items[j].k === p); undo.remove(); $$('.it', sq).forEach((d, p) => d.classList.add(items[seq[p]].k === p ? 'ok' : 'bad')); if (!ok) sq.insertAdjacentHTML('afterend', `<div class="small"><b>Orden correcto:</b> ${q.items.map((t, p) => (p + 1) + '. ' + t).join(' · ')}</div>`); verdict(ok); done(ok, seq.map(j => items[j].t).join(' → ')); };
      undo.addEventListener('click', () => { seq.pop(); draw(); }); draw();
    } else if (q.k === 'mt') {
      const rs = shuffle(q.pairs.map(p => p[1]));
      box.innerHTML = head + q.pairs.map((p, k) => `<div class="mtrow"><div class="l">${p[0]}</div><select data-k="${k}" aria-label="Relación"><option value="">Elige…</option>${rs.map(r => `<option>${r}</option>`).join('')}</select></div>`).join('') + `<button class="btn btn-dark rounded-pill btn-sm fw-bold" type="button">Comprobar</button>` + why;
      $('button', box).addEventListener('click', () => {
        const sels = $$('select', box); if (sels.some(s => !s.value)) return; let ok = true;
        sels.forEach((s, k) => { const g = s.value === q.pairs[k][1]; s.classList.add(g ? 'ok' : 'bad'); if (!g) { ok = false; s.insertAdjacentHTML('afterend', ''); s.title = 'Correcto: ' + q.pairs[k][1]; } s.disabled = true; });
        $('button', box).remove(); if (!ok) $('.why', box).insertAdjacentHTML('afterbegin', '<div class="mb-1"><b>Correcto:</b> ' + q.pairs.map(p => p[0] + ' ⇒ ' + p[1]).join(' · ') + '</div>'); verdict(ok); done(ok, '');
      });
    }
  }
  TC.renderQ = renderQ;

  /* ---------- quiz de cada aprendizaje ---------- */
  function mountQuiz(host, s) {
    const qs = s.quiz || []; if (!qs.length) { host.remove(); return; }
    host.innerHTML = `<div class="quiz-head"><h3><i class="bi bi-patch-question-fill me-1"></i>Pon a prueba lo aprendido</h3><span class="score-pill" data-sc>0 / ${qs.length}</span></div><div data-body></div><div data-foot class="mt-2"></div>`;
    const body = $('[data-body]', host), foot = $('[data-foot]', host), pill = $('[data-sc]', host);
    const best = ST.score[s.id]; if (best) foot.innerHTML = `<span class="small text-muted"><i class="bi bi-trophy-fill text-warning"></i> Tu mejor resultado: <b>${best.ok} / ${best.total}</b></span>`;
    const run = () => {
      body.innerHTML = ''; let ok = 0, n = 0; pill.textContent = '0 / ' + qs.length;
      qs.forEach((q, i) => renderQ(q, i, body, good => {
        n++; if (good) ok++; pill.textContent = ok + ' / ' + qs.length;
        if (n === qs.length) {
          const prev = ST.score[s.id]; if (!prev || ok > prev.ok) ST.score[s.id] = { ok, total: qs.length };
          const pct = ok / qs.length; if (pct >= .8 && !ST.done[s.id]) { ST.done[s.id] = true; const cb = $(`[data-done="${s.id}"]`); if (cb) cb.checked = true; }
          save(); refreshProgress();
          foot.innerHTML = `<div class="tip-box ${pct >= .8 ? 't-ok' : pct >= .5 ? 't-warn' : 't-bad'}"><i class="bi ${pct >= .8 ? 'bi-emoji-sunglasses-fill' : 'bi-arrow-repeat'}"></i><div><b>${ok} de ${qs.length} correctas.</b> ${pct >= .8 ? 'Dominas este aprendizaje: lo marqué como estudiado.' : pct >= .5 ? 'Vas bien; repasa las explicaciones en amarillo y vuelve a intentarlo.' : 'Relee la sección y reintenta; las explicaciones te dicen en qué fallaste.'}</div></div><button class="btn btn-dark rounded-pill btn-sm fw-bold" data-retry type="button"><i class="bi bi-arrow-repeat me-1"></i>Reintentar</button>`;
          $('[data-retry]', foot).addEventListener('click', () => { foot.innerHTML = ''; run(); host.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
        }
      }));
    }; run();
  }

  /* ---------- render de bloques ---------- */
  const GL = []; // glosario
  function blockHTML(b, s, ctx) {
    switch (b.t) {
      case 'p': return `<p>${b.x}</p>`;
      case 'h': { const id = `${s.id.replace('.', '_')}-h${ctx.h++}`; ctx.toc.push([id, b.x.replace(/<[^>]+>/g, '')]); return `<h3 class="sub-h" id="${id}">${b.x}</h3>`; }
      case 'defs': b.items.forEach(([t, d]) => GL.push({ t: t.replace(/<[^>]+>/g, ''), d, sec: s.id, u: s.unit })); return `<div class="def-grid">${b.items.map(([t, d]) => `<div class="def-card"><b>${t}</b>${d}</div>`).join('')}</div>`;
      case 'l': { const tag = b.ord ? 'ol' : 'ul'; return `<${tag}>${b.items.map(i => `<li>${i}</li>`).join('')}</${tag}>`; }
      case 'tip': { const ic = { info: 'bi-info-circle-fill', ok: 'bi-check-circle-fill', warn: 'bi-exclamation-triangle-fill', bad: 'bi-x-octagon-fill', key: 'bi-key-fill' }[b.kind || 'info']; return `<div class="tip-box t-${b.kind || 'info'}"><i class="bi ${ic}"></i><div>${b.title ? `<b>${b.title}</b> ` : ''}${b.x}</div></div>`; }
      case 'tb': return `<div class="table-responsive my-2"><table class="tb"><thead><tr>${b.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'cards': return `<div class="mc-grid">${b.items.map(c => `<div class="mcard" ${c.c ? `style="--cc:${c.c}"` : ''}><h4>${c.i ? `<i class="bi ${c.i}"></i>` : ''}${c.t}</h4>${c.x ? `<p>${c.x}</p>` : ''}${c.l ? `<ul>${c.l.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>`;
      case 'steps': return `<ol class="steps">${b.items.map(i => `<li>${i}</li>`).join('')}</ol>`;
      case 'tl': return `<div class="tl">${b.items.map(i => `<div class="ti"><span class="yr">${i[0]}</span><b>${i[1]}</b><div class="small">${i[2] || ''}</div></div>`).join('')}</div>`;
      case 'w': ctx.w++; return `<div class="wgt-box"><div class="wgt-head"><i class="bi ${b.icon || 'bi-joystick'}"></i>${b.title}<span class="tag">Interactivo</span></div><div class="wgt-body">${b.hint ? `<div class="wgt-hint"><i class="bi bi-hand-index-thumb me-1"></i>${b.hint}</div>` : ''}<div class="wgt" data-w="${b.id}"></div></div></div>`;
    }
    return '';
  }
  function secHTML(s, i) {
    const ctx = { h: 0, toc: [], w: 0 };
    const body = s.blocks.map(b => blockHTML(b, s, ctx)).join(''); TC.stats.w += ctx.w;
    const prev = TC.SECS[i - 1], next = TC.SECS[i + 1], sid = 's' + s.id.replace('.', '_');
    const toc = ctx.toc.length > 1 ? `<div class="mini-toc" aria-label="En esta sección">${ctx.toc.map(t => `<a href="#${t[0]}">${t[1]}</a>`).join('')}</div>` : '';
    const nav = `<div class="d-flex justify-content-between flex-wrap gap-2 mt-3">${prev ? `<a class="btn btn-outline-secondary btn-sm rounded-pill" href="#s${prev.id.replace('.', '_')}"><i class="bi bi-arrow-left me-1"></i>${prev.id} ${prev.title.length > 34 ? prev.title.slice(0, 32) + '…' : prev.title}</a>` : '<span></span>'}${next ? `<a class="btn btn-dark btn-sm rounded-pill" href="#s${next.id.replace('.', '_')}">${next.id} ${next.title.length > 34 ? next.title.slice(0, 32) + '…' : next.title}<i class="bi bi-arrow-right ms-1"></i></a>` : `<a class="btn btn-dark btn-sm rounded-pill" href="#glosario">Glosario y examen final<i class="bi bi-arrow-right ms-1"></i></a>`}</div>`;
    return `<section class="lesson mb-5 acc${s.unit}" id="${sid}" data-sec="${s.id}"><div class="card lesson-card"><div class="lesson-head u${s.unit}"><div class="num">${s.id}</div><div class="me-auto" style="min-width:200px"><h2 class="h4 fw-bold mb-0">${s.title}</h2><small>${s.sub || ''}</small></div>
      <button class="btn btn-sm btn-light rounded-pill btn-bm" data-bm="${s.id}" title="Marcar esta sección" aria-label="Marcar esta sección"><i class="bi bi-bookmark"></i> <span class="d-none d-sm-inline">Marcar</span></button>
      <label class="done-chk"><input type="checkbox" data-done="${s.id}">Estudiado</label></div>
      <div class="card-body">${toc}${body}<div class="quiz" data-quiz="${s.id}"></div>
      <details class="mt-3"><summary class="fw-bold small text-muted" style="cursor:pointer"><i class="bi bi-pencil-square me-1"></i>Mis notas de esta sección</summary><textarea class="note mt-2" data-note="${s.id}" placeholder="Escribe aquí tus dudas o apuntes (se guardan en este navegador)…"></textarea></details>${nav}</div></div></section>`;
  }

  /* ---------- progreso, marcadores e índice ---------- */
  const secs = () => TC.SECS;
  const idOf = id => 's' + id.replace('.', '_');
  function unitPct(n) { const l = secs().filter(s => s.unit === n); return l.length ? Math.round(100 * l.filter(s => ST.done[s.id]).length / l.length) : 0; }
  function refreshProgress() {
    const tot = secs().length, d = secs().filter(s => ST.done[s.id]).length, pct = Math.round(100 * d / tot);
    $('#hero-prog-bar').style.width = pct + '%'; $('#hero-prog-txt').textContent = `Avance: ${d} de ${tot} aprendizajes estudiados (${pct} %)`;
    TC.UNITS.forEach(u => { const b = $(`#um${u.n} .mini-prog > div`); if (b) b.style.width = unitPct(u.n) + '%'; const t = $(`#um${u.n} .upct`); if (t) t.textContent = unitPct(u.n) + ' %'; });
    $('#bm-count').textContent = Object.keys(ST.bm).filter(k => ST.bm[k]).length;
    $$('[data-bm]').forEach(b => { const on = !!ST.bm[b.dataset.bm]; b.classList.toggle('on', on); b.querySelector('i').className = 'bi ' + (on ? 'bi-bookmark-fill' : 'bi-bookmark'); });
    renderIdx();
  }
  let curTab = 'idx', curSec = null;
  function renderIdx() {
    const box = $('#idx-body'); if (!box) return;
    $$('#idx-tabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.t === curTab));
    const row = s => { const sc = ST.score[s.id]; return `<a class="idx-row acc${s.unit} ${curSec === s.id ? 'cur' : ''}" href="#${idOf(s.id)}" data-close><span class="n">${s.id}</span><span class="flex-grow-1">${s.title}</span>${sc ? `<span class="badge text-bg-light border">${sc.ok}/${sc.total}</span>` : ''}${ST.bm[s.id] ? '<i class="bi bi-bookmark-fill text-warning"></i>' : ''}${ST.done[s.id] ? '<i class="bi bi-check-circle-fill text-success"></i>' : '<i class="bi bi-circle text-muted"></i>'}</a>`; };
    if (curTab === 'idx') {
      box.innerHTML = TC.UNITS.map(u => `<div class="idx-unit" style="background:${u.color}"><i class="bi ${u.icon} me-1"></i>Unidad ${u.n} · ${u.short}<span class="float-end">${unitPct(u.n)} %</span></div>` + secs().filter(s => s.unit === u.n).map(row).join('')).join('') +
        `<div class="idx-unit bg-dark"><i class="bi bi-journal-text me-1"></i>Al final</div><a class="idx-row" href="#glosario" data-close><span class="n"><i class="bi bi-spellcheck"></i></span>Glosario</a><a class="idx-row" href="#examen" data-close><span class="n"><i class="bi bi-patch-question-fill"></i></span>Examen final</a>`;

  TC.sec({ id: '2.3', unit: 2, title: 'Riesgos de la computadora: tóxicos, basura electrónica y ergonomía', sub: 'Sustancias peligrosas, normas, tecnopatías y buenas posturas',
    blocks: [
      T('key', 'Los equipos electrónicos contienen <b>sustancias tóxicas</b> (plomo, mercurio, cadmio…). Al terminar su vida útil se vuelven <b>basura electrónica</b> que debe recibir un manejo especial. Su uso prolongado puede causar <b>tecnopatías</b> físicas y psicológicas, que se previenen con <b>ergonomía</b> y pausas activas.', 'Resumen rápido:'),

  TC.sec({ id: '2.5', unit: 2, title: 'Software malicioso y violencia digital', sub: 'Tipos de malware, formas de contagio, protección y riesgos en línea',

  TC.sec({ id: '2.6', unit: 2, title: 'Representación binaria y unidades de almacenamiento', sub: 'Sistema binario, código ASCII, conversiones y unidades de medida de la información',
    blocks: [
      T('key', 'Las computadoras procesan todo con <b>bits</b> (0 y 1). Un <b>byte</b> son 8 bits. El <b>código ASCII</b> asigna un número a cada carácter (ej.: A = 65 = 1000001). Las unidades de almacenamiento crecen de 1024 en 1024: <b>1 KB = 1024 B; 1 MB = 1024 KB; 1 GB = 1024 MB; 1 TB = 1024 GB</b>.', 'Resumen rápido:'),
      D([['Dígito', 'Símbolo que representa una unidad en un sistema numérico. En el decimal son 0 al 9; en el binario, 0 y 1.'], ['Bit', 'Unidad mínima de información: un 0 o un 1 (apagado o encendido).'], ['Byte', 'Grupo de 8 bits; permite representar un carácter.'], ['Sistema binario', 'Sistema de numeración que usa solo dos dígitos (0 y 1). Es la base del funcionamiento de los circuitos digitales, que tienen dos estados: encendido y apagado.'], ['Carácter', 'Símbolo que representa una letra, número, signo de puntuación o espacio.'], ['Código ASCII', '<i>American Standard Code for Information Interchange</i>: tabla estándar que asigna un número a letras, dígitos, símbolos y caracteres de control, para que los equipos intercambien texto.'], ['Equivalencia', 'Relación de igualdad entre dos expresiones o unidades que, aunque se vean distintas, tienen el mismo valor.']]),

      P('Para convertir un número decimal a binario se <b>divide entre 2</b> varias veces, se anota el <b>residuo</b> de cada división y se lee el resultado <b>de abajo hacia arriba</b>.'),
      TB(['Ejemplo: 28', 'División', 'Cociente', 'Residuo'], [['1', '28 ÷ 2', '14', '0'], ['2', '14 ÷ 2', '7', '0'], ['3', '7 ÷ 2', '3', '1'], ['4', '3 ÷ 2', '1', '1'], ['5', '1 ÷ 2', '0', '1']]),
      T('ok', 'Leyendo los residuos de abajo hacia arriba: <b>28 = 11100</b>. Otro ejemplo: <b>65 = 1000001</b>, que es la letra <b>A</b> en ASCII.'),
      W('binaryLab', 'Laboratorio binario y ASCII', 'bi-123', 'Enciende los bits o escribe un carácter y mira la conversión paso a paso.'),

      mc('¿Qué fps es el estándar tradicional del <b>cine</b>?', ['24', '10', '120', '1'], 0, 'El cine usa 24 cuadros por segundo.'),
      mc('MP4 es un…', ['Formato (contenedor)', 'Códec de audio', 'Tipo de monitor', 'Lenguaje de programación'], 0, 'Un MP4 suele contener video H.264 y audio AAC.'),
      mt('Relaciona.', [['H.264', 'Códec de video muy extendido'], ['AAC', 'Códec de audio'], ['MKV', 'Contenedor con varias pistas y subtítulos'], ['WebM', 'Formato abierto para la Web']], 'Formato y códec son cosas distintas.'),
      mc('El resultado de <b>4K (3840 × 2160)</b> comparado con Full HD (1920 × 1080) es…', ['Cuatro veces más píxeles', 'El doble de píxeles', 'La mitad de píxeles', 'Igual'], 0, 'Tiene el doble de ancho y el doble de alto: 2 × 2 = 4 veces los píxeles.'),
      mc('En Clipchamp, el elemento donde se acomodan y cortan los clips es…', ['La escala de tiempo', 'El panel de impresión', 'La hoja de cálculo', 'El navegador'], 0, 'El cabezal marca el punto donde se corta.'),
      ord('Ordena el proceso para producir un video.', ['Planear con un guion', 'Grabar o reunir clips', 'Editar en la escala de tiempo', 'Exportar el video final'], 'Planear → reunir material → editar → exportar.')
    ] });
  W_.resolutions = el => {
    const R = [['hd', 'HD 1280 × 720', 1280, 720, '#1c7ed6'], ['fhd', 'Full HD 1920 × 1080', 1920, 1080, '#2f9e44'], ['uhd', '4K 3840 × 2160', 3840, 2160, '#e8590c']];
    el.innerHTML = U.seg(R.map(r => [r[0], r[1].split(' ')[0] + (r[0] === 'fhd' ? ' HD' : '')]), 'fhd') + `<div class="row g-3 mt-1 align-items-center"><div class="col-md-7"><svg viewBox="0 0 400 230" style="max-width:100%" data-s></svg></div><div class="col-md-5"><div class="readout" data-r></div></div></div>`;
    const draw = k => { const r = R.find(x => x[0] === k), sc = 90 / 3840 * 4, base = 1920 * 1080; let s = ''; R.slice().reverse().forEach(q => { const w = q[2] * 0.1, h = q[3] * 0.1; s += `<rect x="10" y="10" width="${w}" height="${h}" fill="${q[4]}" fill-opacity="${q[0] === k ? .45 : .1}" stroke="${q[4]}" stroke-width="${q[0] === k ? 3 : 1}"/>`; s += `<text x="${16}" y="${10 + h - 8}" font-size="10" fill="${q[4]}" font-weight="800">${q[1].split(' ')[0]}</text>`; }); $('[data-s]', el).innerHTML = s;
      const px = r[2] * r[3]; $('[data-r]', el).innerHTML = `<b>${r[1]}</b><br>Píxeles por cuadro: ${r[2]} × ${r[3]} = <b>${px.toLocaleString('es-MX')}</b><br>Frente a Full HD: <b>${(px / base).toFixed(2)}×</b> los píxeles<br><small>Cada cuadro es una imagen: más píxeles dan más detalle y más peso.</small>`; };
    U.bindSeg(el, draw); draw('fhd');
  };
  W_.fpsDemo = el => {
    el.innerHTML = U.seg([[3, '3 fps'], [12, '12 fps'], [24, '24 fps'], [60, '60 fps']], 24) + `<div style="position:relative;height:90px;background:#0f172a;border-radius:12px;margin-top:.5rem;overflow:hidden"><div data-b style="position:absolute;top:30px;left:0;width:30px;height:30px;border-radius:50%;background:#ffd43b;box-shadow:0 0 12px #ffd43b"></div></div><div class="readout mt-2" data-r></div>`;
    let fps = 24, t0 = performance.now(), last = -1, raf = 0; const b = $('[data-b]', el);
    const loop = now => { if (!el.isConnected) return; const per = 2000, ph = ((now - t0) % per) / per, tri = ph < .5 ? ph * 2 : 2 - ph * 2, frame = Math.floor((now - t0) / (1000 / fps)); if (frame !== last) { last = frame; const q = Math.floor(((frame * (1000 / fps)) % per) / per * 1000) / 1000, tt = q < .5 ? q * 2 : 2 - q * 2; b.style.left = `calc(${tt * 100}% - ${tt * 30}px)`; } raf = requestAnimationFrame(loop); };
    U.bindSeg(el, v => { fps = +v; last = -1; $('[data-r]', el).textContent = `${fps} cuadros por segundo: ${fps <= 3 ? 'se ve entrecortado, como una presentación de diapositivas' : fps <= 12 ? 'movimiento visible a saltos (animación sencilla)' : fps <= 24 ? 'estándar de cine, fluido' : 'muy fluido (videojuegos, deportes)'}.`; }); $('[data-r]', el).textContent = '24 cuadros por segundo: estándar de cine, fluido.'; raf = requestAnimationFrame(loop);
  };
  W_.bitrateCalc = el => {
    el.innerHTML = `<div class="row g-2"><div class="col-6 col-md-4"><div class="inlab">Bitrate (Mbps)</div><input class="tin" type="number" min="0.1" step="0.5" value="5" data-b></div><div class="col-6 col-md-4"><div class="inlab">Duración (segundos)</div><input class="tin" type="number" min="1" value="60" data-d></div></div><div class="readout mt-2" data-r></div>`;
    const go = () => { const b = parseFloat($('[data-b]', el).value), d = parseFloat($('[data-d]', el).value); if (!(b > 0) || !(d > 0)) { $('[data-r]', el).textContent = 'Escribe valores positivos.'; return; } const mb = b * d, MB = mb / 8, f = n => n.toLocaleString('es-MX', { maximumFractionDigits: 2 }); $('[data-r]', el).innerHTML = `${f(b)} Mbps × ${f(d)} s = <b>${f(mb)} megabits</b><br>÷ 8 = <b>${f(MB)} megabytes (MB)</b>${MB >= 1000 ? ' ≈ ' + f(MB / 1000) + ' GB' : ''}<br><small>Por cada hora a ese bitrate: ${f(b * 3600 / 8 / 1000)} GB.</small>`; };
    $$('input', el).forEach(i => i.addEventListener('input', go)); go();
  };
  W_.containerCodec = el => U.classify(el, { cats: ['Formato (contenedor)', 'Códec'], items: [['MP4', 0], ['H.264', 1], ['MKV', 0], ['AAC', 1], ['AVI', 0], ['VP9', 1], ['MOV', 0], ['WebM', 0], ['MP3', 1, 'MP3 es un códec de audio (y también un formato de archivo).']] });
  W_.timelineEdit = el => {
    const base = () => [{ n: 'Intro', d: 6, c: '#1c7ed6' }, { n: 'Entrevista', d: 12, c: '#7048e8' }, { n: 'Cierre', d: 8, c: '#2f9e44' }]; let clips = base(), sel = 1, ph = 9; const tr = new Set();
    el.innerHTML = `<div class="d-flex gap-2 flex-wrap mb-2"><button class="btn-chip" data-cut type="button"><i class="bi bi-scissors"></i> Cortar en el cabezal</button><button class="btn-chip" data-del type="button"><i class="bi bi-trash"></i> Eliminar clip seleccionado</button><button class="btn-chip" data-tr type="button"><i class="bi bi-intersect"></i> Transición tras el clip</button><button class="btn-chip" data-rs type="button">Restablecer</button></div><div style="background:#0f172a;border-radius:12px;padding:12px;position:relative" data-t></div><input type="range" class="form-range mt-1" min="0" max="26" step=".5" value="9" data-p aria-label="Cabezal"><div class="readout" data-r></div>`;
    const total = () => clips.reduce((a, c) => a + c.d, 0);
    const draw = () => { const T = total(); ph = Math.min(ph, T); $('[data-p]', el).max = T; $('[data-p]', el).value = ph; let x = 0, h = '<div style="display:flex;height:54px;position:relative">'; clips.forEach((c, k) => { h += `<div data-k="${k}" style="flex:${c.d};background:${c.c};border:3px solid ${k === sel ? '#ffd43b' : 'transparent'};border-radius:8px;color:#fff;font-weight:800;font-size:.78rem;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;margin-right:${tr.has(k) ? '0' : '2px'};${tr.has(k) ? 'clip-path:polygon(0 0,100% 0,92% 100%,0 100%);' : ''}">${esc(c.n)}<small>${c.d} s</small></div>`; }); h += `<div style="position:absolute;left:${T ? ph / T * 100 : 0}%;top:-6px;bottom:-6px;width:3px;background:#fff;pointer-events:none"></div></div>`; $('[data-t]', el).innerHTML = h;
      $$('[data-k]', el).forEach(d => d.addEventListener('click', () => { sel = +d.dataset.k; draw(); })); $('[data-r]', el).innerHTML = `Duración total: <b>${T} s</b> · Cabezal en <b>${ph} s</b> · Clip seleccionado: <b>${clips[sel] ? esc(clips[sel].n) : 'ninguno'}</b> · Transiciones: <b>${tr.size}</b>`; };
    $('[data-p]', el).addEventListener('input', e => { ph = +e.target.value; draw(); });
    $('[data-cut]', el).addEventListener('click', () => { let x = 0; for (let k = 0; k < clips.length; k++) { const c = clips[k]; if (ph > x && ph < x + c.d) { const a = ph - x; clips.splice(k, 1, { n: c.n, d: a, c: c.c }, { n: c.n + ' (2)', d: c.d - a, c: c.c }); tr.clear(); sel = k; break; } x += c.d; } draw(); });
    $('[data-del]', el).addEventListener('click', () => { if (clips.length > 1 && clips[sel]) { clips.splice(sel, 1); tr.clear(); sel = Math.max(0, sel - 1); } draw(); });
    $('[data-tr]', el).addEventListener('click', () => { if (sel < clips.length - 1) { tr.has(sel) ? tr.delete(sel) : tr.add(sel); } draw(); });
    $('[data-rs]', el).addEventListener('click', () => { clips = base(); tr.clear(); sel = 1; ph = 9; draw(); }); draw();
  };
})();
document.addEventListener('DOMContentLoaded',function(){TC.init();});
</script>
