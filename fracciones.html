<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matemáticas - Fracciones</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    :root { --c1:#e03131; --c2:#1c7ed6; --c3:#2f9e44; --c4:#f08c00; --c5:#7048e8; --ok:#2f9e44; --bad:#e03131;
      --shadow-sm:0 4px 10px rgba(15,23,42,.06); --shadow-md:0 10px 25px rgba(15,23,42,.12); --shadow-lg:0 18px 40px rgba(15,23,42,.18); }
    html { scroll-behavior:smooth; }
    body { background:#f1f5f9; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; min-height:100vh; display:flex; flex-direction:column; color:#1e293b; }
    main { flex:1; } .mono { font-family:'Courier New',monospace; font-weight:700; }

    .app-navbar { background:linear-gradient(90deg,#0f172a,#1e293b); box-shadow:0 4px 20px rgba(0,0,0,.3); z-index:1040; }
    .app-navbar .dropdown-menu { border:0; border-radius:14px; box-shadow:var(--shadow-lg); padding:.6rem; }
    .app-navbar .dropdown-item { border-radius:10px; padding:.6rem .9rem; font-weight:500; }
    .app-navbar .dropdown-item:hover { background:#e7efff; color:#0d6efd; } .app-navbar .dropdown-item.active { background:#0d6efd; color:#fff; }
    .app-navbar .nav-link.active-group { color:#fff; border-bottom:3px solid #0d6efd; }

    .hero-header { position:relative; overflow:hidden; background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%); color:#fff; padding:3rem 1rem 2.6rem; border-bottom:5px solid #e8590c; box-shadow:var(--shadow-md); }
    .hero-header .sym { position:absolute; font-weight:800; color:#fff; opacity:.1; animation:floaty 7s ease-in-out infinite; pointer-events:none; user-select:none; }
    @keyframes floaty { 50% { transform:translateY(-14px) rotate(4deg); } }
    .hero-header .container { position:relative; z-index:1; }

    .panel { background:#fff; border-radius:16px; box-shadow:var(--shadow-sm); padding:1.1rem; border:1px solid #f1f5f9; }
    .tip-box { border-radius:14px; padding:.8rem 1rem; font-size:.92rem; box-shadow:var(--shadow-sm); }
    .s-amp{background:#e7f1fb} .s-ok{background:#e6f6ea} .s-res{background:#fdeaea} .s-volt{background:#fff4e0} .s-watt{background:#efeafc}
    .manual-bar { background:#fff; border-radius:16px; box-shadow:var(--shadow-sm); padding:.8rem 1rem; margin-bottom:1rem; border:1px solid #f1f5f9; }
    .nav-pills .nav-link { color:#334155; font-weight:700; border-radius:12px; background:#fff; box-shadow:var(--shadow-sm); margin:0 .35rem .5rem 0; }
    .nav-pills .nav-link.active { background:#0f172a; color:#fff; box-shadow:var(--shadow-md); }
    .tab-pane { animation:pop .35s both; } @keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .intro-box { background:linear-gradient(135deg,#f1ecff,#fff); border:1px solid #ddd2ff; border-left:5px solid #7048e8; border-radius:14px; padding:.8rem 1rem; margin-bottom:1rem; }

    /* Leyes (acordeón) */
    .law-item { border:0; border-radius:16px !important; box-shadow:var(--shadow-sm); margin-bottom:.7rem; overflow:hidden; }
    .law-item .accordion-button { gap:.7rem; flex-wrap:wrap; font-weight:700; }
    .law-item .accordion-button:not(.collapsed) { background:#efeafc; color:#5130b9; }
    .law-num { width:30px; height:30px; border-radius:50%; background:#7048e8; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; flex:0 0 auto; }
    .law-f { margin-left:auto; font-weight:400; color:#1e293b; }
    .pinput { width:78px; font-family:'Courier New',monospace; font-weight:700; text-align:center; }
    .tk { display:inline-block; width:18px; height:18px; border-radius:50%; margin:2px; animation:tkIn .35s both; box-shadow:inset 0 -2px 0 rgba(0,0,0,.18); }
    .tk.cut { opacity:.25; text-decoration:line-through; position:relative; } .tk.cut::after { content:"×"; position:absolute; inset:0; text-align:center; line-height:18px; font-size:.8rem; color:#000; }
    @keyframes tkIn { from { transform:scale(0); } to { transform:scale(1); } }
